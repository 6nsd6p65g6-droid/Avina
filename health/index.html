<!DOCTYPE html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f6fb">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b1020">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<!--APP:START-->
<title>عيادة الجيب</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: airy single column — greeting, gradient pulse CTA, a 2-up grid of vital cards with sparklines, then daily panels; floating pill tab bar.
   Palette: clinical cobalt blue + fresh mint, coral only for the heart, on a cool near-white. Type: Readex Pro (display & numerals) with IBM Plex Sans Arabic (body). */
:root{
  --bg:#f4f6fb;--surface:#ffffff;--surface-2:#f2f5fa;--ink:#111827;--muted:#667085;--line:#e6eaf1;--card-border:rgba(17,24,39,.045);
  --accent:#3d63dd;--accent-ink:#ffffff;--accent-soft:#eaf0ff;
  --ceil:#0fa38e;--ceil-soft:#e0f5f1;
  --pulse:#ef4d6a;--pulse-soft:#ffe9ed;--pulse-grid:rgba(239,77,106,.08);
  --sun:#e8930c;--sun-soft:#fff3dc;--violet:#7a5af0;--violet-soft:#f0ebff;
  --ok:#0e9f6e;--ok-soft:#e1f6ee;--warn:#c2740a;--warn-soft:#fff4df;--bad:#e5484d;--bad-soft:#ffeaea;--on-bad:#ffffff;--info:#3d63dd;--info-soft:#eaf0ff;
  --grad:linear-gradient(135deg,#4a6cf0 0%,#16b8a4 100%);--on-grad:#ffffff;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.06);
  --float:0 12px 36px rgba(16,24,40,.14);
  --scrim:rgba(10,15,30,.40);
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;
  --f-num:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1020;--surface:#121a2e;--surface-2:#18213a;--ink:#eef2fa;--muted:#98a2b8;--line:#232d47;--card-border:#1f2944;
  --accent:#8ea6ff;--accent-ink:#0b1020;--accent-soft:#1c2647;
  --ceil:#40d7bf;--ceil-soft:#0f2e2e;
  --pulse:#ff7d93;--pulse-soft:#3b1c26;--pulse-grid:rgba(255,125,147,.08);
  --sun:#fbbf4a;--sun-soft:#352a12;--violet:#a993ff;--violet-soft:#241d45;
  --ok:#3fd99a;--ok-soft:#0f2e22;--warn:#f5b54a;--warn-soft:#352812;--bad:#ff7a7f;--bad-soft:#3b1a1e;--on-bad:#2a0508;--info:#8ea6ff;--info-soft:#1c2647;
  --grad:linear-gradient(135deg,#3d5bd6 0%,#0f9e8c 100%);--on-grad:#ffffff;
  --shadow:none;--float:0 12px 36px rgba(0,0,0,.5);--scrim:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1020;--surface:#121a2e;--surface-2:#18213a;--ink:#eef2fa;--muted:#98a2b8;--line:#232d47;--card-border:#1f2944;
  --accent:#8ea6ff;--accent-ink:#0b1020;--accent-soft:#1c2647;
  --ceil:#40d7bf;--ceil-soft:#0f2e2e;
  --pulse:#ff7d93;--pulse-soft:#3b1c26;--pulse-grid:rgba(255,125,147,.08);
  --sun:#fbbf4a;--sun-soft:#352a12;--violet:#a993ff;--violet-soft:#241d45;
  --ok:#3fd99a;--ok-soft:#0f2e22;--warn:#f5b54a;--warn-soft:#352812;--bad:#ff7a7f;--bad-soft:#3b1a1e;--on-bad:#2a0508;--info:#8ea6ff;--info-soft:#1c2647;
  --grad:linear-gradient(135deg,#3d5bd6 0%,#0f9e8c 100%);--on-grad:#ffffff;
  --shadow:none;--float:0 12px 36px rgba(0,0,0,.5);--scrim:rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.7 var(--f-body);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
bdi,.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.eyebrow{font-size:12.5px;color:var(--muted)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* header */
header.top{padding-block:14px 4px}
.top-row{display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:44px;height:44px;flex:none;border-radius:14px;box-shadow:0 2px 10px rgba(61,99,221,.16);border:1px solid var(--card-border)}
.brand b{font:700 18px/1.25 var(--f-display);display:block;letter-spacing:-.2px}
.brand small{color:var(--muted);font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sos{margin-inline-start:auto;flex:none;background:var(--bad-soft);color:var(--bad);border:0;border-radius:999px;padding:9px 14px;font:600 14px/1 var(--f-display);display:inline-flex;gap:6px;align-items:center}
.sos svg{width:18px;height:18px}
main{padding-block:4px calc(118px + env(safe-area-inset-bottom,0px))}
.stack{display:grid;gap:16px}
.sec{font:700 18px/1.4 var(--f-display);margin:12px 0 -4px;text-wrap:balance;letter-spacing:-.2px}
.sec small{font:400 12.5px var(--f-body);color:var(--muted);margin-inline-start:6px;letter-spacing:0}
.panel{background:var(--surface);border:1px solid var(--card-border);border-radius:22px;padding:18px;box-shadow:var(--shadow);min-width:0}
.panel h3{font:600 16px/1.4 var(--f-display);margin:0 0 8px}
.muted{color:var(--muted)}.small{font-size:13px}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0;line-height:1.65}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
/* greeting */
.greet{padding:4px 2px 0}
.greet h1{font:700 28px/1.3 var(--f-display);margin:2px 0 6px;text-wrap:balance;letter-spacing:-.4px}
.greet p{margin:0;color:var(--muted);font-size:14.5px;max-width:60ch}
.greet .state{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--card-border);box-shadow:var(--shadow);border-radius:999px;padding:5px 12px 5px 14px;color:var(--ink);font-size:13.5px}
.greet .state i{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.greet .state.warn i{background:var(--warn)}.greet .state.bad i{background:var(--bad)}.greet .state.none i{background:var(--muted)}
/* pulse CTA */
.hero-act{display:flex;align-items:center;gap:14px;width:100%;text-align:start;background:var(--grad);border:0;border-radius:24px;padding:18px;color:var(--on-grad);box-shadow:0 12px 28px rgba(61,99,221,.22);position:relative;overflow:hidden}
.hero-act::before{content:"";position:absolute;inset:auto -40px -60px auto;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.10)}
.hero-act .hic{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.18);color:var(--on-grad);position:relative}
.hero-act .hic::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid rgba(255,255,255,.7);opacity:0;animation:ring 2.6s ease-out infinite}
@keyframes ring{0%{transform:scale(.86);opacity:.6}100%{transform:scale(1.3);opacity:0}}
.hero-act .hic svg{width:28px;height:28px}
.hero-act b{font:700 17px/1.35 var(--f-display);display:block}
.hero-act span{font-size:13px;opacity:.88}
.hero-act .go{margin-inline-start:auto;opacity:.9;position:relative}
.hero-act .go svg{width:22px;height:22px}
/* vital cards */
.vgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.vcard{background:var(--surface);border:1px solid var(--card-border);border-radius:22px;padding:14px 14px 12px;box-shadow:var(--shadow);text-align:start;display:grid;gap:6px;color:var(--ink);min-width:0;transition:transform .15s}
.vcard:active{transform:scale(.98)}
.vh{display:flex;align-items:center;gap:8px;min-width:0}
.vi{width:32px;height:32px;border-radius:11px;background:var(--cs);color:var(--c);display:grid;place-items:center;flex:none}
.vi svg{width:18px;height:18px}
.vl{font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.vv{display:flex;align-items:baseline;gap:6px;min-width:0}
.vv bdi{font:600 28px/1.1 var(--f-num);letter-spacing:-.6px;white-space:nowrap}
.vv small{font-size:12px;color:var(--muted);white-space:nowrap}
.vv bdi.empty{font:500 17px/1.6 var(--f-body);color:var(--muted);letter-spacing:0}
.spark{width:100%;height:30px;color:var(--c);display:block;overflow:visible}
.vt{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--muted);opacity:.5}
.dot.ok{background:var(--ok);opacity:1}.dot.warn{background:var(--warn);opacity:1}.dot.bad{background:var(--bad);opacity:1}.dot.info{background:var(--info);opacity:1}
@media (max-width:360px){.vv bdi{font-size:23px}}
/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--muted);border:0}
.chip svg{width:14px;height:14px}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.info{background:var(--info-soft);color:var(--info)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:14px;padding:11px 18px;font:600 15px/1.25 var(--f-display);background:var(--accent);color:var(--accent-ink);text-decoration:none}
.btn svg{width:18px;height:18px;flex:none}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--line)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:var(--bad);color:var(--on-bad)}
.btn.sm{padding:7px 13px;font-size:13.5px;border-radius:12px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.linkish{background:none;border:0;color:var(--accent);font-weight:600;padding:0}
/* quick actions */
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.qa{background:var(--surface);border:1px solid var(--card-border);border-radius:20px;padding:14px 8px 12px;display:grid;justify-items:center;gap:8px;text-align:center;font-size:13px;font-weight:600;color:var(--ink);box-shadow:var(--shadow)}
.qa svg{width:42px;height:42px;padding:10px;border-radius:14px;background:var(--accent-soft);color:var(--accent)}
.qa:nth-child(2) svg{background:var(--ceil-soft);color:var(--ceil)}.qa:nth-child(3) svg{background:var(--violet-soft);color:var(--violet)}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,152px),1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--card-border);border-radius:20px;padding:14px;text-align:start;display:flex;flex-direction:column;gap:6px;color:var(--ink);box-shadow:var(--shadow);min-width:0}
.tile .ic{width:40px;height:40px;border-radius:13px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.tile .ic svg{width:21px;height:21px}
.tile .ic.p{background:var(--pulse-soft);color:var(--pulse)}
.tile .ic.c{background:var(--ceil-soft);color:var(--ceil)}
.tile b{font:600 15px/1.35 var(--f-display)}
.tile .d{font-size:12.5px;color:var(--muted);line-height:1.55}
.tile .ft{margin-top:auto;padding-top:4px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:11.5px;color:var(--muted)}
.need{font-size:11px;background:var(--surface-2);border-radius:999px;padding:1px 8px;color:var(--muted)}
/* banners */
.banner{border-radius:18px;padding:14px;display:flex;gap:12px;align-items:flex-start}
.banner svg{width:22px;height:22px;flex:none;margin-top:2px}
.banner.info{background:var(--info-soft);color:var(--ink)}.banner.info svg{color:var(--info)}
.banner.bad{background:var(--bad-soft)}.banner.bad svg{color:var(--bad)}
.banner.warn{background:var(--warn-soft)}.banner.warn svg{color:var(--warn)}
.banner p{margin:2px 0 0;font-size:13.5px}
.banner b{font-family:var(--f-display);font-weight:600}
/* water + meds */
.water{display:flex;gap:16px;align-items:center}
.ring{width:96px;height:96px;flex:none}
.ring .tr{fill:none;stroke:var(--surface-2);stroke-width:11}
.ring .fg{fill:none;stroke:url(#wgrad);stroke-width:11;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dasharray .4s}
.ring text{fill:var(--ink);font:600 18px var(--f-num)}
.big{font:600 22px/1.3 var(--f-num);margin:2px 0 8px}
.big small{font:400 13px var(--f-body);color:var(--muted)}
.dose{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.dose:last-child{border-bottom:0}
.dose .t{font:600 14px var(--f-num);width:52px;flex:none;color:var(--accent)}
.dose .n{flex:1;min-width:0}
.dose .n b{font-weight:600}.dose .n small{display:block;color:var(--muted);font-size:12px}
.tick{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);background:none;display:grid;place-items:center;color:transparent;flex:none}
.tick svg{width:16px;height:16px}
.tick.on{background:var(--ok);border-color:var(--ok);color:var(--surface)}
/* forms */
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr))}
.field{display:grid;gap:5px;min-width:0}
.field label,.lbl{font-size:13px;color:var(--muted);font-weight:500}
input,select,textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:11px 13px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent);background:var(--surface)}
input.numin{font:600 26px/1.2 var(--f-num);text-align:center;direction:ltr}
textarea{resize:vertical;min-height:64px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:inline-block;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;cursor:pointer}
.seg input:checked+span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.checks{display:grid;gap:8px}
.ck{display:flex;gap:10px;align-items:flex-start;padding:12px 13px;border:1px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;font-size:14px;line-height:1.55}
.ck input{width:20px;height:20px;margin:1px 0 0;flex:none;accent-color:var(--accent)}
.ck.em input{accent-color:var(--bad)}
.ck:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.ck.em:has(input:checked){border-color:var(--bad);background:var(--bad-soft)}
.err{color:var(--bad);font-size:13px;min-height:1px;margin:4px 0 0}
/* result */
.result{border-radius:20px;padding:16px;background:var(--surface-2);display:grid;gap:4px}
.result.ok{background:var(--ok-soft)}.result.warn{background:var(--warn-soft)}.result.bad{background:var(--bad-soft)}.result.info{background:var(--info-soft)}
.result .chip{background:var(--surface)}
.r-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.r-top b{font:600 16px/1.4 var(--f-display)}
.r-val{font:600 36px/1.15 var(--f-num);direction:ltr;text-align:right;letter-spacing:-.5px}
.r-val small{font:500 14px var(--f-body);color:var(--muted);letter-spacing:0}
.result p{margin:2px 0 0;font-size:14px}
/* log */
.mchips{display:flex;gap:6px;flex-wrap:wrap}
.mchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--ink)}
.mchip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mchip small{font-family:var(--f-num);opacity:.7;margin-inline-start:4px}
.chart{direction:ltr;margin-top:8px}
.chart svg{display:block;width:100%;height:auto}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .tk{fill:var(--muted);font:500 10px var(--f-num)}
.chart .band{fill:var(--ok-soft)}
.chart .ref{stroke:var(--ok);stroke-width:1;stroke-dasharray:3 3;opacity:.7}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:middle;margin-inline-end:5px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.stat{background:var(--surface-2);border-radius:14px;padding:9px 11px;min-width:0}
.stat span{display:block;font-size:11.5px;color:var(--muted)}
.stat b{font:600 16px/1.3 var(--f-num);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:420px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rlist{display:grid}
.rd{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);min-width:0}
.rd:last-child{border-bottom:0}
.rd .v{font:600 17px var(--f-num);min-width:70px}
.rd .m{flex:1;min-width:0;font-size:12.5px;color:var(--muted)}
.rd .m b{color:var(--ink);font-weight:500;font-size:13px}
.x{background:none;border:0;color:var(--muted);padding:6px;border-radius:10px;display:grid;place-items:center;font-size:12px;font-weight:600}
.x svg{width:16px;height:16px}
.x.confirm{color:var(--on-bad);background:var(--bad);padding:4px 10px}
/* body numbers */
.kv{display:grid;gap:0}
.kv>div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:baseline}
.kv>div:last-child{border-bottom:0}
.kv span{color:var(--muted);font-size:13.5px}
.kv b{font:600 15px var(--f-num);text-align:left;white-space:nowrap}
.kv em{font-style:normal;font-size:12px;color:var(--muted);display:block;text-align:left}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;pointer-events:none;
  padding:0 max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.tabs-in{pointer-events:auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));max-width:520px;margin:0 auto;padding:7px;
  background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--card-border);border-radius:28px;box-shadow:var(--float)}
.tabs button{background:none;border:0;display:grid;justify-items:center;gap:2px;padding:5px 0 4px;color:var(--muted);font-size:11.5px;font-weight:600;border-radius:22px}
.tabs button span.i{width:48px;height:30px;border-radius:999px;display:grid;place-items:center;transition:background .2s}
.tabs svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs button[aria-current="page"] span.i{background:var(--accent-soft)}
/* sheet */

function mdLite(t){
  const lines=esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').split(/\n/);let out='',inList=false;

function resample(ts,vs,fs){const out=[];if(ts.length<2)return out;const dt=1/fs;let j=0;for(let t=ts[0];t<=ts[ts.length-1];t+=dt){while(j<ts.length-2&&ts[j+1]<t)j++;const span=ts[j+1]-ts[j]||1;const f=clamp((t-ts[j])/span,0,1);out.push(vs[j]+(vs[j+1]-vs[j])*f)}return out}
function movAvg(x,w){const n=x.length,p=new Float64Array(n+1);for(let i=0;i<n;i++)p[i+1]=p[i]+x[i];const h=Math.floor(w/2),o=new Array(n);for(let i=0;i<n;i++){const a=Math.max(0,i-h),b=Math.min(n-1,i+h);o[i]=(p[b+1]-p[a])/(b-a+1)}return o}
function bandpass(x,fs,lo,hi){const tr=movAvg(x,Math.max(3,Math.round(fs/lo)));const d=x.map((v,i)=>v-tr[i]);return movAvg(d,Math.max(1,Math.round(fs/hi/2)))}
function autoRate(y,fs,minR,maxR){
  const n=y.length;if(n<fs*4)return null;let m=0;for(const v of y)m+=v;m/=n;const x=y.map(v=>v-m);
  const l0=Math.max(2,Math.floor(fs*60/maxR)),l1=Math.min(n-3,Math.ceil(fs*60/minR));if(l1<=l0+2)return null;
  const ac=new Float64Array(l1+2);
  for(let L=l0-1;L<=l1+1;L++){let s=0,e1=0,e2=0;for(let i=0;i+L<n;i++){s+=x[i]*x[i+L];e1+=x[i]*x[i];e2+=x[i+L]*x[i+L]}ac[L]=s/Math.sqrt(e1*e2||1)}
  const pk=[];for(let L=l0;L<=l1;L++)if(ac[L]>ac[L-1]&&ac[L]>=ac[L+1])pk.push(L);if(!pk.length)return null;
  let bl=pk[0],best=ac[bl];for(const L of pk)if(ac[L]>best){best=ac[L];bl=L}
  for(const L of pk){if(L<bl&&Math.abs(L*2-bl)<=2&&ac[L]>0.85*best){bl=L;best=ac[L];break}}
  const a=ac[bl-1],b=ac[bl],c=ac[bl+1],den=a-2*b+c,off=den?0.5*(a-c)/den:0;
  return{rate:60*fs/(bl+clamp(off,-.5,.5)),q:best};
}
function drawWave(cv,arr,cap,color){
  const dpr=window.devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;if(!W)return;
  if(cv.width!==Math.round(W*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr)}
  const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,W,H);if(arr.length<2)return;
  let mx=0;for(const v of arr)mx=Math.max(mx,Math.abs(v));mx=mx||1;
  c.strokeStyle=color;c.lineWidth=2;c.lineJoin='round';c.beginPath();
  arr.forEach((v,i)=>{const x=(i/(cap-1))*W;const y=H/2-v/mx*H*0.38;i?c.lineTo(x,y):c.moveTo(x,y)});c.stroke();
}

function vLog(){
  const have=Object.keys(MET).filter(k=>S.readings.some(r=>r.k===k));
  if(!have.includes(logK))logK=have[0]||'bp';
  const M=MET[logK],rs=byK(logK),numeric=NUMERIC.includes(logK);
  let body='';
  if(!rs.length)body=`<p class="hint">لا توجد قراءات بعد.</p>`;
  else{
    const lr=rs[rs.length-1],c=M.cls(lr.v);
    body=`<div class="between"><div><span class="eyebrow small muted">آخر قراءة · ${fDT.format(lr.ts)}</span><div class="big" style="margin:0"><bdi>${esc(M.val(lr.v))}</bdi> <small>${esc(unitOf(logK))}</small></div></div><span class="chip ${c.lv}">${esc(c.t)}</span></div>`;
    if(numeric){
      const pts=rs.slice(-30).map(r=>({x:r.ts,ys:M.ser(r.v)}));
      const band=typeof M.band==='function'?M.band():M.band;
      body+=`<div class="chart">${chartSVG(pts,{band,refs:M.refs})}</div>`;
      if(M.sn)body+=`<div class="legend"><span><i style="background:var(--accent)"></i>${M.sn[0]}</span><span><i style="background:var(--pulse)"></i>${M.sn[1]}</span><span><i style="background:var(--ok);height:1px"></i>الحد المثالي 120/80</span></div>`;
      else if(band)body+=`<div class="legend"><span><i style="background:var(--ok-soft);height:10px"></i>النطاق الطبيعي</span></div>`;
      const r30=rs.filter(r=>Date.now()-r.ts<30*D),ser=r30.map(r=>M.ser(r.v));
      if(ser.length){const f=(i,fn)=>fn(...ser.map(s=>s[i])),avg=i=>ser.reduce((a,s)=>a+s[i],0)/ser.length;
        const dec=['temp','tremor'].includes(logK)?(logK==='tremor'?2:1):(logK==='wt'||(logK==='glu'&&P().gluUnit==='mmol')?1:0);
        const fm=x=>(+x).toFixed(dec),two=M.sn?(fn=>fm(fn(0))+'/'+fm(fn(1))):(fn=>fm(fn(0)));
        body+=`<div class="stats"><div class="stat"><span>متوسط 30 يوماً</span><b>${two(avg)}</b></div><div class="stat"><span>الأدنى</span><b>${two(i=>f(i,Math.min))}</b></div><div class="stat"><span>الأعلى</span><b>${two(i=>f(i,Math.max))}</b></div><div class="stat"><span>عدد القراءات</span><b>${ser.length}</b></div></div>`}
    }
  }
  return `<div class="stack">
  <h2 class="sec">سجلّك الصحي</h2>
  <div class="mchips">${(have.length?have:['bp']).map(k=>`<button type="button" class="mchip" data-act="logk" data-k="${k}" aria-pressed="${k===logK}">${MET[k].n}<small>${S.readings.filter(r=>r.k===k).length}</small></button>`).join('')}</div>
  <section class="panel">${body}
    <div class="row" style="margin-top:12px">${MANUAL.includes(logK)?`<button class="btn sm" type="button" data-act="add" data-k="${logK}">${ic('plus')}أضف قراءة</button>`:''}${TESTS.find(t=>t.k===logK)?`<button class="btn sm soft" type="button" data-act="test" data-t="${TESTS.find(t=>t.k===logK).id}">أعد الفحص</button>`:''}</div>

function niceStep(raw){const p=10**Math.floor(Math.log10(raw||1)),n=raw/p;return (n<1.5?1:n<3?2:n<7?5:10)*p}
function chartSVG(pts,o){
  if(pts.length<2)return `<p class="hint">تحتاج قراءتين على الأقل لرسم المنحنى.</p>`;
  const W=340,H=176,L=36,R=12,T=12,B=26;
  const xs=pts.map(p=>p.x),x0=Math.min(...xs),x1=Math.max(...xs);
  let ys=pts.flatMap(p=>p.ys.filter(v=>v!=null));const allY=[...ys];if(o.band)allY.push(...o.band);if(o.refs)allY.push(...o.refs);
  let y0=Math.min(...allY),y1=Math.max(...allY);const pad=(y1-y0)*0.12||1;y0-=pad;y1+=pad;
  const st=niceStep((y1-y0)/4),ticks=[];for(let t=Math.ceil(y0/st)*st;t<=y1;t+=st)ticks.push(+t.toFixed(6));
  const X=v=>L+(W-L-R)*(v-x0)/((x1-x0)||1),Y=v=>T+(H-T-B)*(1-(v-y0)/(y1-y0));
  const dec=st<1?(st<0.1?2:1):0;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="منحنى القراءات">`;
  if(o.band)s+=`<rect class="band" x="${L}" y="${Y(Math.min(o.band[1],y1)).toFixed(1)}" width="${W-L-R}" height="${(Y(Math.max(o.band[0],y0))-Y(Math.min(o.band[1],y1))).toFixed(1)}"/>`;
  ticks.forEach(t=>{s+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}"/><text class="tk" x="${L-6}" y="${(Y(t)+3.5).toFixed(1)}" text-anchor="end">${t.toFixed(dec)}</text>`});
  (o.refs||[]).forEach(r=>{s+=`<line class="ref" x1="${L}" x2="${W-R}" y1="${Y(r).toFixed(1)}" y2="${Y(r).toFixed(1)}"/>`});
  const cols=['var(--accent)','var(--pulse)'];const nser=pts[0].ys.length;
  for(let i=0;i<nser;i++){
    const P2=pts.filter(p=>p.ys[i]!=null).map(p=>[X(p.x),Y(p.ys[i])]);
    if(i===0&&nser===1)s+=`<path d="M${P2[0][0].toFixed(1)} ${Y(y0).toFixed(1)} ${P2.map(q=>'L'+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ')} L${P2[P2.length-1][0].toFixed(1)} ${Y(y0).toFixed(1)}Z" fill="${cols[0]}" fill-opacity=".10"/>`;
    s+=`<polyline points="${P2.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ')}" fill="none" stroke="${cols[i]}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;

  s+=`<text class="tk" x="${L}" y="${H-6}" text-anchor="start">${fD.format(x0)}</text><text class="tk" x="${W-R}" y="${H-6}" text-anchor="end">${fD.format(x1)}</text></svg>`;
  return s;
}

function bodyNums(){
  const p=P(),h=+p.height,w=+p.weight,a=age(),sex=p.sex;

    if(isFinite(bf)&&bf>2&&bf<70){const cut=sex==='m'?[6,14,18,25]:[14,21,25,32];const lab=bf<cut[0]?['رياضي جداً','ok']:bf<cut[1]?['رياضي','ok']:bf<cut[2]?['لياقة جيدة','ok']:bf<cut[3]?['متوسط','warn']:['مرتفع','bad'];

  return `<div class="kv">${rows.map(r=>`<div><span>${r[0]}</span><span><b>${r[1]}</b>${r[2]?`<em>${r[2]}</em>`:''}</span></div>`).join('')}</div>`;

  let stream=null,stopped=true,t0=null,miss=0,ema1=null,ema2=0,lastEst=0;let ts=[],R=[],G=[],disp=[];
  const cv=document.createElement('canvas');cv.width=40;cv.height=30;const cx=cv.getContext('2d',{willReadFrequently:true});
  function stopCam(){stopped=true;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}try{vid.srcObject=null}catch(e){}}
  function reset(){t0=null;ts=[];R=[];G=[];disp=[];ema1=null;ema2=0;prog.style.width='0';bpmEl.textContent='--';heart.classList.remove('beat')}
  function estimate(a,bnd){
    const idx=[];for(let i=0;i<ts.length;i++)if(ts[i]>=a&&ts[i]<=bnd)idx.push(i);if(idx.length<60)return null;

      cx.drawImage(vid,0,0,40,30);const d=cx.getImageData(8,6,24,18).data;let r=0,g=0,bl=0;const n=d.length/4;
      for(let i=0;i<d.length;i+=4){r+=d[i];g+=d[i+1];bl+=d[i+2]}r/=n;g/=n;bl/=n;

/* ---------- test: tremor ---------- */
function testTremor(b){
  b.innerHTML=`<div class="stage"><div class="bignum"><bdi id="trN">--</bdi><small>م/ث² · شدة الاهتزاز</small></div><canvas class="wave" id="trWave"></canvas><div class="prog"><i id="trProg"></i></div><div class="status" id="trSt">اجلس، ومدّ ذراعك أمامك، وامسك الهاتف في راحة يدك دون أن تسند مرفقك.</div></div>
  <ol class="steps"><li>اختر اليد التي تريد اختبارها.</li><li>بعد «ابدأ» لديك 3 ثوانٍ لمدّ ذراعك.</li><li>أبقِ يدك ثابتة قدر الإمكان لمدة 15 ثانية.</li></ol>
  <div class="field"><span class="lbl">اليد</span><div class="seg"><label><input type="radio" name="tr-h" value="R" checked><span>اليمنى</span></label><label><input type="radio" name="tr-h" value="L"><span>اليسرى</span></label></div></div>
  <button class="btn block" type="button" id="trGo">ابدأ الاختبار</button><div id="trOut"></div>`;
  let live=true,listener=null,timer=0;const stopAll=()=>{if(listener)removeEventListener('devicemotion',listener);listener=null;clearInterval(timer)};
  const st=$('#trSt',b),go=$('#trGo',b),out=$('#trOut',b),prog=$('#trProg',b),wave=$('#trWave',b),col=cssVar('--accent');
  go.onclick=async()=>{
    out.innerHTML='';go.disabled=true;
    if(!(await motionPerm())||!(await motionProbe())){go.disabled=false;out.innerHTML=`<div class="banner warn">${ic('alert')}<div><b>حساس الحركة غير متاح</b><p>${NO_SENSOR()}</p></div></div>`;return}
    for(let i=3;i>0;i--){if(!live)return;st.textContent='مدّ ذراعك… '+i;await sleep(1000)}
    const ts=[],X=[],Y=[],Z=[],disp=[];const t0=performance.now()/1000;let gx=null,gy,gz;
    listener=e=>{let a=e.acceleration,x,y,z;if(a&&a.x!=null){x=a.x;y=a.y;z=a.z}else{a=e.accelerationIncludingGravity;if(!a||a.x==null)return;if(gx===null){gx=a.x;gy=a.y;gz=a.z}gx+=(a.x-gx)*.1;gy+=(a.y-gy)*.1;gz+=(a.z-gz)*.1;x=a.x-gx;y=a.y-gy;z=a.z-gz}
      const t=performance.now()/1000-t0;ts.push(t);X.push(x);Y.push(y);Z.push(z);disp.push(Math.hypot(x,y,z)*Math.sign(x||1));if(disp.length>150)disp.shift()};
    addEventListener('devicemotion',listener);st.textContent='ثبّت يدك…';
    timer=setInterval(()=>{const el=performance.now()/1000-t0;prog.style.width=clamp(el/15*100,0,100)+'%';drawWave(wave,disp,150,col);if(el>=15){stopAll();try{navigator.vibrate&&navigator.vibrate(150)}catch(e){}done()}},100);
    function done(){
      go.disabled=false;go.textContent='أعد الاختبار';
      if(ts.length<100){out.innerHTML=`<div class="banner warn">${ic('alert')}<div><b>بيانات غير كافية</b><p>${NO_SENSOR()}</p></div></div>`;return}
      const fs=50,ax=[X,Y,Z].map(ch=>{const r=resample(ts.map(t=>t),ch,fs).slice(fs);const m=movAvg(r,25);return r.map((v,i)=>v-m[i])});
      const n=ax[0].length;let ss=0;for(let i=0;i<n;i++)ss+=ax[0][i]**2+ax[1][i]**2+ax[2][i]**2;const rms=Math.sqrt(ss/n);
      let bestF=0,bestP=0;for(let f=3;f<=14;f+=0.25){let p=0;for(const s of ax){let re=0,im=0;for(let i=0;i<n;i++){const w=2*Math.PI*f*i/fs;re+=s[i]*Math.cos(w);im-=s[i]*Math.sin(w)}p+=re*re+im*im}if(p>bestP){bestP=p;bestF=f}}
      const c=cTremor(rms),hand=($('input[name="tr-h"]:checked',b)||{}).value||'R';$('#trN',b).textContent=rms.toFixed(2);st.textContent='';
      out.innerHTML=`<div class="sheet-b">${resultHTML(c,rms.toFixed(2),'م/ث²',`<p class="small muted">التردد السائد: <bdi>${bestF.toFixed(1)}</bdi> هرتز. النتيجة للمقارنة مع نفسك عبر الوقت، وليست تشخيصاً.</p>`)}<button class="btn" type="button" id="trSave">احفظ في السجل</button></div>`;
      $('#trSave',out).onclick=ev=>{addReading('tremor',{rms:+rms.toFixed(3),hz:+bestF.toFixed(1),hand});ev.target.disabled=true;ev.target.textContent='حُفظت';toast('حُفظت النتيجة')};
    }
  };
  return()=>{live=false;stopAll()};
}

/* ---------- test: reaction ---------- */
function testReact(b){
  b.innerHTML=`<p class="hint" style="margin:0">حين يتحول المربع إلى الأخضر المسه بأسرع ما يمكن. خمس محاولات.</p><button type="button" class="pad" id="rxPad">المس للبدء</button><div class="row" id="rxTimes"></div><div id="rxOut"></div>`;
  const pad=$('#rxPad',b),times=$('#rxTimes',b),out=$('#rxOut',b);let state='idle',tGo=0,to=0,res=[];
  const set=(s,t)=>{state=s;pad.className='pad '+(s==='wait'?'wait':s==='go'?'go':s==='early'?'early':'');pad.textContent=t};
  function arm(){set('wait','انتظر اللون الأخضر…');to=setTimeout(()=>{tGo=performance.now();set('go','المس الآن!')},1500+Math.random()*2500)}
  pad.addEventListener('pointerdown',e=>{e.preventDefault();
    if(state==='idle'||state==='early'||state==='shown'){arm();return}
    if(state==='wait'){clearTimeout(to);set('early','مبكراً! المس لإعادة المحاولة');return}
    if(state==='go'){const ms=Math.round(performance.now()-tGo);res.push(ms);times.innerHTML=res.map(x=>`<span class="chip"><bdi>${x}</bdi> م.ث</span>`).join('');
      if(res.length<5){set('shown',ms+' ملي ثانية · المس للمحاولة التالية')}
      else{state='done';const avg=Math.round(res.reduce((a,x)=>a+x,0)/res.length),best=Math.min(...res),c=cReact(avg);pad.className='pad';pad.textContent='انتهى الاختبار';
        out.innerHTML=`<div class="sheet-b">${resultHTML(c,avg,'ملي ثانية',`<p class="small muted">أفضل محاولة: <bdi>${best}</bdi> ملي ثانية.</p>`)}<div class="row"><button class="btn" type="button" id="rxSave">احفظ في السجل</button><button class="btn ghost" type="button" id="rxRe">أعد</button></div></div>`;
        $('#rxSave',out).onclick=ev=>{addReading('react',{ms:avg,best});ev.target.disabled=true;ev.target.textContent='حُفظت';toast('حُفظت النتيجة')};
        $('#rxRe',out).onclick=()=>{res=[];times.innerHTML='';out.innerHTML='';set('idle','المس للبدء')}}}
  });
  return()=>clearTimeout(to);
}

/* ---------- test: visual acuity (tumbling E) ---------- */
function testAcuity(b){
  const SN=[200,100,70,50,40,30,25,20],DIST=400,mm20=DIST*Math.tan(5/60*Math.PI/180);
  let eye='R',lvl=0,trial=0,ok=0,wrong=0,dir=0,passed=null,results={};
  function intro(){
    b.innerHTML=`${P().pxmm?'':`<div class="banner info">${ic('ruler')}<div><b>عايِر الشاشة أولاً</b><p>لتكون أحجام الحروف دقيقة على هاتفك.</p><div class="row" style="margin-top:8px"><button class="btn sm" type="button" id="acCal">عايِر الآن</button></div></div></div>`}
    <ol class="steps"><li>امسك الهاتف على بُعد 40 سم من عينيك (تقريباً المسافة من المرفق إلى أطراف الأصابع).</li><li>إذا كنت تلبس نظارة للقراءة أو للبعيد فالبسها.</li><li>غطِّ عينك ${eye==='R'?'اليسرى':'اليمنى'} بكفّك دون ضغط، واختبر العين ${EYE[eye]}.</li><li>اضغط السهم الذي يشير إلى اتجاه فتحة الحرف E.</li></ol>
    <button class="btn block" type="button" id="acGo">${ic('eye')}ابدأ بالعين ${EYE[eye]}</button>`;
    const cal=$('#acCal',b);if(cal)cal.onclick=()=>{b.innerHTML=calibHTML();mountCalib(b,intro)};
    $('#acGo',b).onclick=()=>{lvl=0;trial=0;ok=0;wrong=0;passed=null;stage();next()};
  }
  function stage(){
    b.innerHTML=`<div class="stage"><div class="status" id="acSt"></div><div class="eye-box"><canvas id="acCv" width="200" height="200"></canvas></div>
    <div class="arrows"><button type="button" class="u" data-d="3" aria-label="أعلى">${ic('arrowU')}</button><button type="button" class="l" data-d="2" aria-label="يسار">${ic('arrowL')}</button><button type="button" class="n" data-d="-1">لا أراه</button><button type="button" class="r" data-d="0" aria-label="يمين">${ic('arrowR')}</button><button type="button" class="d" data-d="1" aria-label="أسفل">${ic('arrowD')}</button></div></div>`;
    $$('.arrows button',b).forEach(x=>x.onclick=()=>answer(+x.dataset.d));
  }
  function drawE(){
    const cv=$('#acCv',b),dpr=window.devicePixelRatio||1;cv.width=Math.round(200*dpr);cv.height=Math.round(200*dpr);
    const c=cv.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,cv.width,cv.height);
    const hpx=mm20*(SN[lvl]/20)*pxmm()*dpr,u=Math.max(1,Math.round(hpx/5)),s=u*5;
    c.save();c.translate(Math.round(cv.width/2),Math.round(cv.height/2));c.rotate(dir*Math.PI/2);c.translate(-s/2,-s/2);c.fillStyle='#000';
    c.fillRect(0,0,u,s);c.fillRect(0,0,s,u);c.fillRect(0,2*u,s,u);c.fillRect(0,4*u,s,u);c.restore();
    $('#acSt',b).textContent=`العين ${EYE[eye]} · المستوى ${lvl+1} من ${SN.length} · المحاولة ${trial+1} من 4`;
  }
  function next(){dir=Math.floor(Math.random()*4);drawE()}
  function answer(d){
    if(d===dir)ok++;else wrong++;trial++;
    if(ok>=3||wrong>=2||trial>=4){
      if(ok>=3){passed=SN[lvl];lvl++;if(lvl>=SN.length)return finishEye()}else return finishEye();
      trial=0;ok=0;wrong=0}
    next();
  }
  function finishEye(){
    const d=passed||400;results[eye]=d;addReading('vision',{eye,d});
    if(eye==='R'){eye='L';b.innerHTML=`${resultHTML(cVision(d),snel(d),'العين اليمنى · '+snelM(d))}<button class="btn block" type="button" id="acNext">الآن العين اليسرى</button>`;$('#acNext',b).onclick=intro;return}
    const worst=Math.max(results.R||400,results.L||400);

let aiTier='default';
async function callAI(input,o,json){
  const run=t=>json?aiSample.json(input,{...o,modelTier:t}):aiSample(input,{...o,modelTier:t});
  try{return await run(aiTier)}catch(e){if(e&&e.code==='invalid_request'&&aiTier!=='default'){aiTier='default';return await run('default')}throw e}
}
function aiErr(e){const c=e&&e.code;
  if(c==='limit')return `وصلت إلى حد أسئلتك اليوم${e.limit?' ('+e.limit+')':''}. يتجدد الحد غداً، أو اشترك لتحصل على أسئلة أكثر.`;
  if(c==='upgrade')return 'هذه الميزة متاحة لمشتركي برو وألترا.';
  if(c==='auth')return 'سجّل الدخول لتستخدم الطبيب الذكي.';
  if(c==='network')return 'تعذّر الاتصال بالإنترنت. تحقق من اتصالك ثم أعد المحاولة.';
  if(c==='ai_failed'||c==='server')return 'تعذّر إنشاء الإجابة الآن. حاول مرة أخرى بعد قليل.';
  return c==='not_granted'?'لم يُسمح باستخدام Claude لهذه الصفحة. يمكنك السماح من قائمة الأذونات ثم المحاولة مجدداً.':c==='rate_limited'?'طلبات كثيرة الآن. انتظر قليلاً ثم أعد المحاولة.':c==='invalid_json'?'جاء الرد ناقصاً. أعد المحاولة.':c==='cancelled'?'أُوقف الطلب.':'تعذّر الحصول على إجابة الآن. حاول مرة أخرى.'}

async function aiJSON(payload,signal){const res=await cloudFetch(payload,signal);let j;try{j=JSON.parse((await res.text()).trim())}catch(e){throw {code:'invalid_json'}}if(j&&j.error)throw {code:j.error};return j}
async function aiChat(turns,o){
  if(aiSample)return callAI([{role:'user',content:rules()},{role:'assistant',content:'فهمت. سأتبع هذه التعليمات.'},...turns],{cache:false,signal:o.signal,onText:o.onText});
  const res=await cloudFetch({purpose:'chat',turns,context:aiContext(),emNum:emNum()},o.signal);
  const u=res.headers.get('X-Quota-Used');if(cloud.status&&u&&u!=='0')cloud.status.used_today=+u;
  const rd=res.body.getReader(),dec=new TextDecoder();let text='';
  try{for(;;){const {done,value}=await rd.read();if(done)break;text+=dec.decode(value,{stream:true});o.onText&&o.onText({text})}}
  catch(e){if(text)throw {code:'cancelled',text};throw {code:e&&e.name==='AbortError'?'cancelled':'network'}}
  return {text:text+dec.decode()};
}
async function aiArticle(topic,o){if(aiSample)return {article:await callAI(artPrompt(topic),{signal:o.signal},true)};return aiJSON({purpose:'article',topic},o.signal)}
async function aiVerify(topic,a){if(aiSample)return callAI(verPrompt(topic,a),{},true);return (await aiJSON({purpose:'verify',topic})).verify}
function normVer(r){if(r&&r.v)return r;const ok=['accurate','minor','major'];return {v:ok.includes(r&&r.verdict)?r.verdict:'minor',summary:r&&typeof r.summary==='string'?r.summary:'',issues:(Array.isArray(r&&r.issues)?r.issues:[]).filter(i=>i&&typeof i.claim==='string').map(i=>({claim:i.claim,fix:typeof i.fix==='string'?i.fix:''}))}}
function upsell(e){const c=e&&e.code;if(!CLOUD)return '';if(c==='auth')return `<div class="row" style="margin-top:8px"><button class="btn sm" type="button" data-act="account">تسجيل الدخول</button></div>`;
  if(c==='limit'||c==='upgrade')return `<div class="row" style="margin-top:8px"><button class="btn sm" type="button" data-act="plans">عرض الاشتراكات</button></div>`;return ''}
function quotaLine(){const st=cloud.status;if(!CLOUD||!st||st.is_admin||aiSample)return '';const left=Math.max(0,st.daily_ai-st.used_today);
  return `<p class="hint" style="text-align:center;margin:0">متبقٍ لك اليوم: <bdi>${left}</bdi> من <bdi>${st.daily_ai}</bdi> سؤال · خطة ${esc(st.name)}${st.plan!=='ultra'?' · <button type="button" class="linkish small" data-act="plans">ترقية</button>':''}</p>`}

/* account */
function authMsg(e){const c=(e&&(e.code||e.error_code))||'',m=(e&&e.message)||'';
  if(c==='invalid_credentials'||/Invalid login/i.test(m))return 'البريد أو كلمة المرور غير صحيحة.';
  if(c==='email_not_confirmed'||/not confirmed/i.test(m))return 'أكّد بريدك أولاً من الرابط الذي أرسلناه إليك، ثم سجّل الدخول.';
  if(c==='user_already_exists'||/already registered/i.test(m))return 'هذا البريد مسجّل مسبقاً. سجّل الدخول بدلاً من ذلك.';
  if(c==='weak_password'||/password/i.test(m)&&/least|weak|short/i.test(m))return 'كلمة المرور ضعيفة. استخدم 8 أحرف على الأقل.';
  if(/rate limit|too many/i.test(m)||c.includes('rate_limit'))return 'محاولات كثيرة. انتظر قليلاً ثم أعد المحاولة.';
  if(/fetch|network/i.test(m))return 'تعذّر الاتصال بالإنترنت.';
  return 'حدث خطأ: '+(m||'غير معروف');}

  <form id="acF" class="sheet-b" novalidate>
    <div class="field"><label for="ac-email">البريد الإلكتروني</label><input id="ac-email" type="email" dir="ltr" autocomplete="email" required></div>
    <div class="field"><label for="ac-pass">كلمة المرور</label><input id="ac-pass" type="password" dir="ltr" autocomplete="${up?'new-password':'current-password'}" minlength="8" required></div>

    <div class="between small"><button type="button" class="linkish" id="acSwap">${up?'لديك حساب؟ سجّل الدخول':'ليس لديك حساب؟ أنشئ حساباً'}</button>${up?'':'<button type="button" class="linkish" id="acForgot">نسيت كلمة المرور؟</button>'}</div>
  </form><div id="acOut"></div>`,b=>{
    const f=$('#acF',b),err=$('#acErr',b),go=$('#acGo',b),em=()=>$('#ac-email',b).value.trim(),pw=()=>$('#ac-pass',b).value;
    $('#acSwap',b).onclick=()=>sheetAccount(up?'in':'up',why);

      fg.disabled=true;const {error}=await cloud.sb.auth.resetPasswordForEmail(em(),{redirectTo:appURL()});fg.disabled=false;
      err.textContent='';$('#acOut',b).innerHTML=error?`<p class="err">${esc(authMsg(error))}</p>`:`<div class="result ok"><p>أرسلنا رابط تغيير كلمة المرور إلى <bdi>${esc(em())}</bdi>. افتحه من هذا الهاتف.</p></div>`};
    f.onsubmit=async e=>{e.preventDefault();err.textContent='';
      if(!/^\S+@\S+\.\S+$/.test(em()))return err.textContent='اكتب بريداً إلكترونياً صحيحاً.';
      if(pw().length<8)return err.textContent='كلمة المرور 8 أحرف على الأقل.';
      go.disabled=true;go.textContent='لحظة…';
      const r=up?await cloud.sb.auth.signUp({email:em(),password:pw(),options:{emailRedirectTo:appURL()}}):await cloud.sb.auth.signInWithPassword({email:em(),password:pw()});
      go.disabled=false;go.textContent=up?'أنشئ الحساب':'دخول';
      if(r.error){err.textContent=authMsg(r.error);return}
      if(up&&!r.data.session){f.hidden=true;$('#acOut',b).innerHTML=`<div class="result ok"><div class="r-top"><b>تحقق من بريدك</b></div><p>أرسلنا رابط تأكيد إلى <bdi>${esc(em())}</bdi>. افتح الرابط من هذا الهاتف، ثم سجّل الدخول.</p></div>`;return}
      toast('أهلاً بك!');
    };
    setTimeout(()=>$('#ac-email',b).focus(),150);
  });
}

function sheetAdmin(tab='pay'){
  if(!(cloud.status&&cloud.status.is_admin))return;
  const T=[['pay','الطلبات'],['set','الإعدادات'],['lib','الموسوعة'],['grant','منح اشتراك']];
  openSheet('لوحة التحكم',`<div class="seg" id="adTabs">${T.map(([k,n])=>`<label><input type="radio" name="ad-t" value="${k}" ${k===tab?'checked':''}><span>${n}</span></label>`).join('')}</div><div id="adBody" class="sheet-b"></div>`,b=>{
    let live=true;const body=$('#adBody',b);

  $('.seg',body).onchange=e=>adPays(body,live,e.target.value);
  const {data,error}=await cloud.sb.from('payments').select('*').eq('status',filter).order('created_at',{ascending:filter==='pending'}).limit(50);
  const list=$('#adList',body);if(!list||!live())return;
  if(error){list.innerHTML=`<p class="err">${esc(error.message)}</p>`;return}
  if(!data.length){list.innerHTML='<p class="hint">لا توجد طلبات هنا.</p>';return}
  list.innerHTML=data.map(x=>`<div class="paper" style="display:grid;gap:6px" data-pid="${x.id}">
    <div class="between"><b>${esc((planOf(x.plan)||{}).name||x.plan)} · ${x.months} ${x.months>2?'أشهر':'شهر'}</b><span class="chip ${PSTAT[x.status][0]}">${PSTAT[x.status][1]}</span></div>
    <div class="small" dir="ltr" style="text-align:right">${esc(x.email||'')}</div>
    <div class="small">${METHODS[x.method]||x.method} · <bdi>${usd(x.amount_usd)}</bdi>${x.amount_lyd?' · <b>'+lyd(x.amount_lyd)+'</b>':''} · ${fDT.format(new Date(x.created_at))}</div>
    ${x.reference?`<div class="small">المرجع: ${esc(x.reference)}</div>`:''}${x.cards?`<pre class="small" dir="ltr" style="margin:0;white-space:pre-wrap;font-family:var(--f-num);user-select:all">${esc(x.cards)}</pre>`:''}${x.note?`<div class="small">ملاحظة: ${esc(x.note)}</div>`:''}${x.admin_note?`<div class="small">ملاحظتك: ${esc(x.admin_note)}</div>`:''}
    <div class="row">${x.receipt_path?`<button class="btn sm ghost" type="button" data-rc="${esc(x.receipt_path)}">عرض الإيصال</button>`:''}${x.status==='pending'?`<button class="btn sm" type="button" data-ok="${x.id}">${ic('check')}قبول وتفعيل</button><input placeholder="سبب الرفض (اختياري)" data-note="${x.id}" style="flex:1;min-width:140px;padding:6px 10px"><button class="btn sm ghost" type="button" data-no="${x.id}" style="color:var(--bad)">رفض</button>`:''}</div></div>`).join('');
  list.onclick=async e=>{const t=e.target.closest('button');if(!t)return;
    if(t.dataset.rc){t.disabled=true;const {data:u}=await cloud.sb.storage.from('receipts').createSignedUrl(t.dataset.rc,600);t.disabled=false;
      if(u&&u.signedUrl){const a=document.createElement('a');a.href=u.signedUrl;a.target='_blank';a.rel='noopener';a.textContent='افتح الإيصال';a.className='btn sm';t.replaceWith(a)}else toast('تعذّر فتح الإيصال');return}
    if(t.dataset.ok){t.disabled=true;const {error}=await cloud.sb.rpc('approve_payment',{p_id:t.dataset.ok});if(error){toast('تعذّر: '+error.message);t.disabled=false;return}toast('فُعّل الاشتراك');adPays(body,live,filter)}
    if(t.dataset.no){t.disabled=true;const note=($(`[data-note="${t.dataset.no}"]`,list)||{}).value||null;const {error}=await cloud.sb.rpc('reject_payment',{p_id:t.dataset.no,p_note:note});if(error){toast('تعذّر: '+error.message);t.disabled=false;return}toast('رُفض الطلب');adPays(body,live,filter)}};
}

  await loadPublic();
  body.innerHTML=`<form id="asF" class="sheet-b">
    <div class="form"><div class="field"><label for="as-rate">سعر الدولار بالدينار الليبي</label><input id="as-rate" inputmode="decimal" dir="ltr" value="${esc(setting('lyd_rate',0)||'')}" placeholder="مثال: 7.5"></div>
    <div class="field"><label for="as-mk">زيادة الكروت (%)</label><input id="as-mk" inputmode="numeric" dir="ltr" value="${Math.round(+setting('card_markup',0.2)*100)}"></div>
    <div class="field"><label for="as-sup">رقم الدعم (واتساب أو هاتف)</label><input id="as-sup" dir="ltr" value="${esc(setting('support',''))}"></div></div>
    <div class="field"><label for="as-bank">بيانات الحساب المصرفي (تظهر لمن يدفع بالحوالة)</label><textarea id="as-bank" rows="4" placeholder="اسم المصرف&#10;اسم صاحب الحساب&#10;رقم الحساب">${esc(setting('bank_info',''))}</textarea></div>
    <div class="field"><label for="as-card">تعليمات الدفع بالكروت (اختياري)</label><textarea id="as-card" rows="3" placeholder="مثال: نقبل كروت ليبيانا والمدار من فئة 10 و20 ديناراً">${esc(setting('card_info',''))}</textarea></div>
    <p class="err" id="asErr"></p><button class="btn block" type="submit">احفظ الإعدادات</button></form>`;
  $('#asF',body).onsubmit=async e=>{e.preventDefault();const rate=parseFloat($('#as-rate',body).value.replace(',','.'))||0,mk=(parseFloat($('#as-mk',body).value)||0)/100;
    const rows=[{key:'lyd_rate',value:rate},{key:'card_markup',value:mk},{key:'support',value:$('#as-sup',body).value.trim()},{key:'bank_info',value:$('#as-bank',body).value.trim()},{key:'card_info',value:$('#as-card',body).value.trim()}];
    const {error}=await cloud.sb.from('settings').upsert(rows);if(error){$('#asErr',body).textContent=error.message;return}await loadPublic();toast('حُفظت الإعدادات')};
}
async function adLibrary(body,live){
  const all=[...new Set(SYSTEMS.flatMap(x=>x[1]))];
  body.innerHTML='<p class="hint">جارٍ التحميل…</p>';
  const {data,error}=await cloud.sb.from('articles').select('topic,reviewed');if(!live())return;
  if(error){body.innerHTML=`<p class="err">${esc(error.message)}</p>`;return}
  const have=new Set(data.map(r=>r.topic)),missing=all.filter(t=>!have.has(t));
  body.innerHTML=`<div class="kv"><div><span>مقالات جاهزة في المكتبة</span><b>${data.length}</b></div><div><span>مواضيع الأقسام غير المكتوبة</span><b>${missing.length} من ${all.length}</b></div><div><span>راجعها طبيب</span><b>${data.filter(r=>r.reviewed).length}</b></div></div>
   <p class="hint">المستخدم المجاني يقرأ المقالات الجاهزة فقط، لذلك اكتب مقالات الأقسام مسبقاً. تُكتب كل مقالة مرة واحدة بأقوى نموذج، وتكلّف تقريباً 0.07 دولار (المجموع ≈ ${usd(missing.length*0.07)}).</p>
   ${missing.length?`<button class="btn block" type="button" id="alGo">اكتب المقالات الناقصة (${missing.length})</button>`:'<div class="result ok"><p>كل مواضيع الأقسام مكتوبة.</p></div>'}
   <div class="prog" hidden id="alPr"><i></i></div><p class="status" id="alSt"></p>`;
  const g=$('#alGo',body);if(!g)return;let stop=false;
  g.onclick=async()=>{if(g.dataset.run){stop=true;g.textContent='يتوقف بعد المقالة الحالية…';return}g.dataset.run=1;g.textContent='إيقاف';$('#alPr',body).hidden=false;let done=0,fail=0;
    for(const t of missing){if(stop||!live())break;$('#alSt',body).textContent='يكتب: '+t+' ('+(done+1)+' من '+missing.length+')';
      try{const r=await aiArticle(t,{});const a=cleanArt(r.article);if(a)artPut(t,a)}catch(e){fail++}done++;$('#alPr i',body).style.width=(done/missing.length*100)+'%'}
    if(live()){$('#alSt',body).textContent=`انتهى: ${done-fail} مقالة جديدة${fail?' · تعذّرت '+fail:''}.`;setTimeout(()=>live()&&adLibrary(body,live),1500)}};
}
function adGrant(body){
  body.innerHTML=`<form id="agF" class="sheet-b"><p class="hint" style="margin:0">امنح اشتراكاً يدوياً (هدية أو تجربة أو دفع خارج التطبيق).</p>
    <div class="field"><label for="ag-email">بريد المستخدم</label><input id="ag-email" type="email" dir="ltr" required></div>
    <div class="form"><div class="field"><label for="ag-plan">الخطة</label><select id="ag-plan">${cloud.plans.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')}</select></div>
    <div class="field"><label for="ag-m">عدد الأشهر</label><select id="ag-m">${[1,3,6,12].map(m=>`<option>${m}</option>`).join('')}</select></div></div>
    <p class="err" id="agErr"></p><button class="btn block" type="submit">امنح الاشتراك</button></form>`;
  $('#agF',body).onsubmit=async e=>{e.preventDefault();const {error}=await cloud.sb.rpc('grant_plan',{p_email:$('#ag-email',body).value,p_plan:$('#ag-plan',body).value,p_months:+$('#ag-m',body).value});
    if(error){$('#agErr',body).textContent=/user_not_found/.test(error.message)?'لا يوجد مستخدم بهذا البريد. يجب أن ينشئ حساباً أولاً.':error.message;return}toast('تم منح الاشتراك')};
}

/* ---------- actions ---------- */
const OPEN_TEST={heart:['قياس النبض بالكاميرا',testHeart],breath:['معدل التنفس',testBreath],tremor:['ثبات اليد',testTremor],react:['سرعة رد الفعل',testReact],acuity:['حدة البصر',testAcuity],color:['تمييز الألوان',testColor],amsler:['شبكة أمسلر',b=>testGrid(b,'amsler')],astig:['اللابؤرية',b=>testGrid(b,'astig')],hear:['فحص السمع',testHear]};
const ACT={
  go:a=>go(a.dataset.v),close:()=>closeSheet(),
  vital:a=>{const k=a.dataset.k;if(last(k)){logK=k;go('log')}else sheetAdd(k)},
  add:a=>sheetAdd(a.dataset.k),addPick:()=>sheetAddPick(),
  test:a=>{const t=OPEN_TEST[a.dataset.t];if(t)openSheet(t[0],'',t[1])},
  sym:a=>sheetSym(a.dataset.id),sys:a=>sheetSys(a.dataset.i),enc:a=>sheetArticle(a.dataset.topic),q:a=>sheetQ(a.dataset.q),chat:()=>sheetChat(),sos:()=>sheetSOS(),report:()=>sheetReport(),calib:()=>sheetCalib(),
  logk:a=>{logK=a.dataset.k;if(view==='log')render();else go('log')},
  copy:a=>copyText(a.dataset.txt),
  account:a=>sheetAccount(a.dataset.mode||'in'),plans:()=>sheetPlans(),checkout:a=>sheetCheckout(a.dataset.plan),admin:()=>sheetAdmin(),logout:()=>logout(),
  water:a=>{ensureReal();const k=dayKey(),before=S.water[k]||0;S.water[k]=Math.max(0,before+(+a.dataset.ml));persist();render();if(before<waterGoal()&&S.water[k]>=waterGoal())toast('أحسنت! وصلت إلى هدف الماء اليوم')},
  dose:a=>{ensureReal();const k=dayKey(),key=a.dataset.key;S.medLog[k]=S.medLog[k]||{};if(S.medLog[k][key])delete S.medLog[k][key];else S.medLog[k][key]=Date.now();persist();render()},
  del:a=>{if(!a.classList.contains('confirm')){$$('.x.confirm').forEach(x=>{x.classList.remove('confirm');x.innerHTML=ic('trash')});a.classList.add('confirm');a.textContent='تأكيد الحذف';return}
    S.readings=S.readings.filter(r=>r.id!==a.dataset.id);persist();render();toast('حُذفت القراءة')},
  demoClear:()=>{ensureReal();persist();render();toast('بدأ ملفك الخاص')},
  medToggle:a=>{const m=S.meds.find(x=>x.id===a.dataset.id);if(m){m.on=!m.on;persist();render()}},
  medDel:a=>{if(!a.classList.contains('confirm')){a.classList.add('confirm');a.textContent='تأكيد';return}S.meds=S.meds.filter(x=>x.id!==a.dataset.id);persist();render()},
  notif:async()=>{try{const r=await Notification.requestPermission();toast(r==='granted'?'فُعّلت التذكيرات':'لم يُسمح بالتنبيهات')}catch(e){toast('التنبيهات غير مدعومة هنا')}render()},
  export:()=>saveFile('عيادة-الجيب-نسخة-'+dayKey()+'.json',JSON.stringify(S,null,1)),
  import:()=>$('#importFile').click(),
  wipe:a=>{if(!a.classList.contains('confirm')){a.classList.add('confirm');a.style.background='var(--bad)';a.style.color='var(--on-bad)';a.textContent='اضغط مرة أخرى لحذف كل شيء نهائياً';return}
    const keep={country:P().country,emNum:P().emNum,gluUnit:P().gluUnit,pxmm:P().pxmm};S=blankState();Object.assign(S.profile,keep);persist();render();toast('حُذفت كل البيانات')}
};
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;const f=ACT[a.dataset.act];if(f){e.preventDefault();f(a,e)}});
$('#sheetBg').addEventListener('click',e=>{if(e.target.id==='sheetBg')closeSheet()});
addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheetBg').hidden)closeSheet()});
$('#importFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const x=normalize(JSON.parse(rd.result));if(!x)throw 0;S=x;S.demo=false;persist();render();toast('استُعيدت بياناتك')}catch(err){toast('الملف غير صالح. اختر ملف نسخة احتياطية من عيادة الجيب.')}};rd.readAsText(f);e.target.value=''});
document.addEventListener('change',e=>{
  const el=e.target;if(el.id==='medForm'||el.closest('#medForm'))return;const f=el.dataset&&el.dataset.p;if(!f)return;
  if(el.type==='radio'&&!el.checked)return;const wasDemo=ensureReal();const v=el.value;
  P()[f]=String(v).trim();
  if(f==='country'){const c=COUNTRIES.find(x=>x[0]===v);if(c)P().emNum=c[2];const n=$('#p-emNum');if(n)n.value=P().emNum}
  if(f==='weight'&&+v>=20&&+v<=300){const lw=last('wt');if(!lw||Math.abs(lw.v.kg-+v)>=0.05){S.readings.push({id:uid(),k:'wt',ts:Date.now(),v:{kg:Math.round(+v*10)/10}})}}
  persist();
  if(wasDemo||f==='gluUnit'){render();return}
  const bn=$('#bodyNums');if(bn)bn.innerHTML=bodyNums();
});
document.addEventListener('submit',e=>{
  if(e.target.id==='encF'){e.preventDefault();const q=$('#encQ').value.trim();if(q)sheetArticle(q);return}
  if(e.target.id!=='medForm')return;e.preventDefault();const name=$('#m-name').value.trim();if(!name){$('#m-name').focus();return}
  const times=['m-t1','m-t2','m-t3'].map(i=>$('#'+i).value).filter(Boolean);if(!times.length)return;
  ensureReal();S.meds.push({id:uid(),name,dose:$('#m-dose').value.trim(),times:[...new Set(times)].sort(),on:true});persist();render();toast('أُضيف '+name);
});

/* ---------- medication reminders ---------- */
const notified=new Set();
setInterval(()=>{
  const now=new Date(),hm=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0'),log=S.medLog[dayKey()]||{};
  for(const m of S.meds){if(!m.on||!(m.times||[]).includes(hm))continue;const key=dayKey()+m.id+hm;if(notified.has(key)||log[m.id+'@'+hm])continue;notified.add(key);
    toast('حان موعد '+m.name+(m.dose?' · '+m.dose:''));
    if(!IN_VIEWER&&'Notification' in window&&Notification.permission==='granted'){const opt={body:(m.dose||'')+' — الساعة '+hm,icon:'icon-192.png',tag:key};
      if(navigator.serviceWorker&&navigator.serviceWorker.controller)navigator.serviceWorker.ready.then(r=>r.showNotification('موعد الدواء: '+m.name,opt)).catch(()=>{});else try{new Notification('موعد الدواء: '+m.name,opt)}catch(e){}}
    if(view==='home'&&$('#sheetBg').hidden)render();
  }
},20000);

/* ---------- boot ---------- */
view=VIEWS[location.hash.slice(1)]?location.hash.slice(1):'home';
render();
connectRemote();
cloudInit();
if(IN_VIEWER){claude.use('sample').then(async s=>{if(!s)return;aiSample=s;try{const l=await s.limits();const t=l&&l.modelTiers;aiTier=(!t||t.includes('complex'))?'complex':'default'}catch(e){}if($('#sheetBg').hidden)render()}).catch(()=>{})}
if(!IN_VIEWER&&'serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
})();
</script>
