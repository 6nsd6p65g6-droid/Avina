<!DOCTYPE html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f6fc">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c1226">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<!--APP:START-->
<title>أفينا</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Marcellus&family=Amiri:wght@700&display=swap">
<style>
/* Layout: airy single column — greeting, gradient pulse CTA, a 2-up grid of vital cards with sparklines, then daily panels; floating pill tab bar.
   Avina identity: lapis blue + tile turquoise + gold leaf on a cool paper white (old medical manuscripts); coral only for the heart.
   Type: Figtree (Latin UI & numerals) with IBM Plex Sans Arabic; Marcellus / Amiri for the wordmark only. */
:root{
  --bg:#f4f6fc;--surface:#ffffff;--surface-2:#eef2fa;--ink:#17203b;--muted:#5f6a88;--line:#e1e6f1;--card-border:rgba(23,32,59,.05);
  --accent:#1f3c88;--accent-ink:#ffffff;--accent-soft:#e6ecf9;
  --ceil:#178f8d;--ceil-soft:#dcf1f0;
  --pulse:#e0485f;--pulse-soft:#fde8ec;--pulse-grid:rgba(224,72,95,.08);
  --sun:#b9861f;--sun-soft:#f8eed8;--violet:#6a5ad8;--violet-soft:#eeebfc;
  --ok:#0e9468;--ok-soft:#e1f5ec;--warn:#b26d0a;--warn-soft:#fbf0dc;--bad:#d9434c;--bad-soft:#fde9ea;--on-bad:#ffffff;--info:#1f3c88;--info-soft:#e6ecf9;
  --gold:#c8962c;--brand-bg:#1f3c88;--brand-fg:#f4f6fc;
  --grad:linear-gradient(135deg,#1f3c88 0%,#178f8d 100%);--on-grad:#ffffff;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.06);
  --float:0 12px 36px rgba(16,24,40,.14);
  --scrim:rgba(10,15,30,.40);
  --f-display:"Figtree","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"Figtree","IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;
  --f-num:"Figtree","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-brand:"Marcellus","Amiri",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1226;--surface:#131b33;--surface-2:#1a2340;--ink:#eef1f8;--muted:#9aa4bf;--line:#243052;--card-border:#202a4a;
  --accent:#93acf5;--accent-ink:#0c1226;--accent-soft:#1c2850;
  --ceil:#41c9c3;--ceil-soft:#0f2d33;
  --pulse:#ff7d93;--pulse-soft:#3b1c26;--pulse-grid:rgba(255,125,147,.08);
  --sun:#e2b65a;--sun-soft:#33280f;--violet:#a99bff;--violet-soft:#241d45;
  --ok:#3fd99a;--ok-soft:#0f2e22;--warn:#f5b54a;--warn-soft:#352812;--bad:#ff7a7f;--bad-soft:#3b1a1e;--on-bad:#2a0508;--info:#93acf5;--info-soft:#1c2850;
  --gold:#e2b65a;--brand-bg:#2a4aa6;--brand-fg:#f4f6fc;
  --grad:linear-gradient(135deg,#2a4aa6 0%,#14807e 100%);--on-grad:#ffffff;
  --shadow:none;--float:0 12px 36px rgba(0,0,0,.5);--scrim:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1226;--surface:#131b33;--surface-2:#1a2340;--ink:#eef1f8;--muted:#9aa4bf;--line:#243052;--card-border:#202a4a;
  --accent:#93acf5;--accent-ink:#0c1226;--accent-soft:#1c2850;
  --ceil:#41c9c3;--ceil-soft:#0f2d33;
  --pulse:#ff7d93;--pulse-soft:#3b1c26;--pulse-grid:rgba(255,125,147,.08);
  --sun:#e2b65a;--sun-soft:#33280f;--violet:#a99bff;--violet-soft:#241d45;
  --ok:#3fd99a;--ok-soft:#0f2e22;--warn:#f5b54a;--warn-soft:#352812;--bad:#ff7a7f;--bad-soft:#3b1a1e;--on-bad:#2a0508;--info:#93acf5;--info-soft:#1c2850;
  --gold:#e2b65a;--brand-bg:#2a4aa6;--brand-fg:#f4f6fc;
  --grad:linear-gradient(135deg,#2a4aa6 0%,#14807e 100%);--on-grad:#ffffff;
  --shadow:none;--float:0 12px 36px rgba(0,0,0,.5);--scrim:rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.7 var(--f-body);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
bdi,.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.eyebrow{font-size:12.5px;color:var(--muted)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* header */
header.top{padding-block:14px 4px}
.top-row{display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 auto}
.brand>div{min-width:0}
.brand svg{width:44px;height:44px;flex:none;border-radius:14px;box-shadow:0 2px 10px rgba(31,60,136,.22)}
.brand b{font:700 22px/1.2 var(--f-brand);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--accent)}
html[lang="en"] .brand b{font-weight:400;font-size:20px;letter-spacing:.16em;text-transform:uppercase}
.brand small{color:var(--muted);font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sos{margin-inline-start:auto;flex:none;background:var(--bad-soft);color:var(--bad);border:0;border-radius:999px;padding:9px 14px;font:600 14px/1 var(--f-display);display:inline-flex;gap:6px;align-items:center}
.sos svg{width:18px;height:18px}
.langb{margin-inline-start:auto;flex:none;background:var(--surface);border:1px solid var(--card-border);box-shadow:var(--shadow);color:var(--ink);border-radius:999px;min-width:44px;padding:9px 12px;font:600 13.5px/1 var(--f-display)}
.langb+.sos{margin-inline-start:0}
[dir="ltr"] .hero-act .go svg{transform:scaleX(-1)}
[dir="ltr"] .r-val{text-align:left}
[dir="ltr"] .msg.u{justify-self:end;border-end-start-radius:18px;border-end-end-radius:6px}
[dir="ltr"] .msg.a{justify-self:start;border-end-end-radius:18px;border-end-start-radius:6px}
main{padding-block:4px calc(118px + env(safe-area-inset-bottom,0px))}
.stack{display:grid;gap:16px}
.sec{font:700 18px/1.4 var(--f-display);margin:12px 0 -4px;text-wrap:balance;letter-spacing:-.2px}
.sec small{font:400 12.5px var(--f-body);color:var(--muted);margin-inline-start:6px;letter-spacing:0}
.panel{background:var(--surface);border:1px solid var(--card-border);border-radius:22px;padding:18px;box-shadow:var(--shadow);min-width:0}
.panel h3{font:600 16px/1.4 var(--f-display);margin:0 0 8px}
.muted{color:var(--muted)}.small{font-size:13px}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0;line-height:1.65}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
/* greeting */
.greet{padding:4px 2px 0}
.greet h1{font:700 28px/1.3 var(--f-display);margin:2px 0 6px;text-wrap:balance;letter-spacing:-.4px}
.greet p{margin:0;color:var(--muted);font-size:14.5px;max-width:60ch}
.greet .state{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--card-border);box-shadow:var(--shadow);border-radius:999px;padding:5px 12px 5px 14px;color:var(--ink);font-size:13.5px}
.greet .state i{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.greet .state.warn i{background:var(--warn)}.greet .state.bad i{background:var(--bad)}.greet .state.none i{background:var(--muted)}
/* pulse CTA */
.hero-act{display:flex;align-items:center;gap:14px;width:100%;text-align:start;background:var(--grad);border:0;border-radius:24px;padding:18px;color:var(--on-grad);box-shadow:0 12px 28px rgba(31,60,136,.22);position:relative;overflow:hidden}
.hero-act::before{content:"";position:absolute;inset:auto -40px -60px auto;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.10)}
.hero-act .hic{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.18);color:var(--on-grad);position:relative}
.hero-act .hic::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid rgba(255,255,255,.7);opacity:0;animation:ring 2.6s ease-out infinite}
@keyframes ring{0%{transform:scale(.86);opacity:.6}100%{transform:scale(1.3);opacity:0}}
.hero-act .hic svg{width:28px;height:28px}
.hero-act b{font:700 17px/1.35 var(--f-display);display:block}
.hero-act span{font-size:13px;opacity:.88}
.hero-act .go{margin-inline-start:auto;opacity:.9;position:relative}
.hero-act .go svg{width:22px;height:22px}
/* vital cards */
.vgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.vcard{background:var(--surface);border:1px solid var(--card-border);border-radius:22px;padding:14px 14px 12px;box-shadow:var(--shadow);text-align:start;display:grid;gap:6px;color:var(--ink);min-width:0;transition:transform .15s}
.vcard:active{transform:scale(.98)}
.vh{display:flex;align-items:center;gap:8px;min-width:0}
.vi{width:32px;height:32px;border-radius:11px;background:var(--cs);color:var(--c);display:grid;place-items:center;flex:none}
.vi svg{width:18px;height:18px}
.vl{font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.vv{display:flex;align-items:baseline;gap:6px;min-width:0}
.vv bdi{font:600 28px/1.1 var(--f-num);letter-spacing:-.6px;white-space:nowrap}
.vv small{font-size:12px;color:var(--muted);white-space:nowrap}
.vv bdi.empty{font:500 17px/1.6 var(--f-body);color:var(--muted);letter-spacing:0}
.spark{width:100%;height:30px;color:var(--c);display:block;overflow:visible}
.vt{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--muted);opacity:.5}
.dot.ok{background:var(--ok);opacity:1}.dot.warn{background:var(--warn);opacity:1}.dot.bad{background:var(--bad);opacity:1}.dot.info{background:var(--info);opacity:1}
@media (max-width:360px){.vv bdi{font-size:23px}}
/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--muted);border:0}
.chip svg{width:14px;height:14px}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.info{background:var(--info-soft);color:var(--info)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:14px;padding:11px 18px;font:600 15px/1.25 var(--f-display);background:var(--accent);color:var(--accent-ink);text-decoration:none}
.btn svg{width:18px;height:18px;flex:none}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--line)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:var(--bad);color:var(--on-bad)}
.btn.sm{padding:7px 13px;font-size:13.5px;border-radius:12px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.linkish{background:none;border:0;color:var(--accent);font-weight:600;padding:0}
/* quick actions */
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.qa{background:var(--surface);border:1px solid var(--card-border);border-radius:20px;padding:14px 8px 12px;display:grid;justify-items:center;gap:8px;text-align:center;font-size:13px;font-weight:600;color:var(--ink);box-shadow:var(--shadow)}
.qa svg{width:42px;height:42px;padding:10px;border-radius:14px;background:var(--accent-soft);color:var(--accent)}
.qa:nth-child(2) svg{background:var(--ceil-soft);color:var(--ceil)}.qa:nth-child(3) svg{background:var(--violet-soft);color:var(--violet)}
/* tiles */
.fam{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.fam::-webkit-scrollbar{display:none}
.fchip{flex:none;display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:13.5px;line-height:1.25;text-align:start}
.fchip svg{width:17px;height:17px;color:var(--muted);flex:none}
.fchip small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.fchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fchip[aria-pressed="true"] svg,.fchip[aria-pressed="true"] small{color:inherit}
.fchip.add{border-style:dashed;color:var(--accent)}
.fchip.add svg{color:inherit}
.labt{display:grid}
.labr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.labr:last-child{border-bottom:0}
.labr b{font-size:14.5px;min-width:0;overflow-wrap:anywhere}
.labr .v{font:600 15px/1.4 var(--f-num);white-space:nowrap;text-align:end}
.labr .n{grid-column:1/-1;font-size:13px;color:var(--muted)}
.linkrow{background:none;border:0;border-bottom:1px solid var(--line);width:100%;text-align:start;color:inherit;font:inherit}
.linkrow svg{width:18px;height:18px;color:var(--muted);flex:none;margin-inline-start:auto}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,152px),1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--card-border);border-radius:20px;padding:14px;text-align:start;display:flex;flex-direction:column;gap:6px;color:var(--ink);box-shadow:var(--shadow);min-width:0}
.tile .ic{width:40px;height:40px;border-radius:13px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.tile .ic svg{width:21px;height:21px}
.tile .ic.p{background:var(--pulse-soft);color:var(--pulse)}
.tile .ic.c{background:var(--ceil-soft);color:var(--ceil)}
.tile b{font:600 15px/1.35 var(--f-display)}
.tile .d{font-size:12.5px;color:var(--muted);line-height:1.55}
.tile .ft{margin-top:auto;padding-top:4px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:11.5px;color:var(--muted)}
.need{font-size:11px;background:var(--surface-2);border-radius:999px;padding:1px 8px;color:var(--muted)}
/* banners */
.banner{border-radius:18px;padding:14px;display:flex;gap:12px;align-items:flex-start}
.banner svg{width:22px;height:22px;flex:none;margin-top:2px}
.banner.info{background:var(--info-soft);color:var(--ink)}.banner.info svg{color:var(--info)}
.banner.bad{background:var(--bad-soft)}.banner.bad svg{color:var(--bad)}
.banner.warn{background:var(--warn-soft)}.banner.warn svg{color:var(--warn)}
.banner p{margin:2px 0 0;font-size:13.5px}
.banner b{font-family:var(--f-display);font-weight:600}
/* water + meds */
.water{display:flex;gap:16px;align-items:center}
.ring{width:96px;height:96px;flex:none}
.ring .tr{fill:none;stroke:var(--surface-2);stroke-width:11}
.ring .fg{fill:none;stroke:url(#wgrad);stroke-width:11;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dasharray .4s}
.ring text{fill:var(--ink);font:600 18px var(--f-num)}
.big{font:600 22px/1.3 var(--f-num);margin:2px 0 8px}
.big small{font:400 13px var(--f-body);color:var(--muted)}
.dose{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.dose:last-child{border-bottom:0}
.dose .t{font:600 14px var(--f-num);width:52px;flex:none;color:var(--accent)}
.dose .n{flex:1;min-width:0}
.dose .n b{font-weight:600}.dose .n small{display:block;color:var(--muted);font-size:12px}
.tick{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);background:none;display:grid;place-items:center;color:transparent;flex:none}
.tick svg{width:16px;height:16px}
.tick.on{background:var(--ok);border-color:var(--ok);color:var(--surface)}
/* forms */
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr))}
.field{display:grid;gap:5px;min-width:0}
.field label,.lbl{font-size:13px;color:var(--muted);font-weight:500}
input,select,textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:11px 13px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent);background:var(--surface)}
input.numin{font:600 26px/1.2 var(--f-num);text-align:center;direction:ltr}
textarea{resize:vertical;min-height:64px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:inline-block;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;cursor:pointer}
.seg input:checked+span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.checks{display:grid;gap:8px}
.ck{display:flex;gap:10px;align-items:flex-start;padding:12px 13px;border:1px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;font-size:14px;line-height:1.55}
.ck input{width:20px;height:20px;margin:1px 0 0;flex:none;accent-color:var(--accent)}
.ck.em input{accent-color:var(--bad)}
.ck:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.ck.em:has(input:checked){border-color:var(--bad);background:var(--bad-soft)}
.err{color:var(--bad);font-size:13px;min-height:1px;margin:4px 0 0}
/* result */
.result{border-radius:20px;padding:16px;background:var(--surface-2);display:grid;gap:4px}
.result.ok{background:var(--ok-soft)}.result.warn{background:var(--warn-soft)}.result.bad{background:var(--bad-soft)}.result.info{background:var(--info-soft)}
.result .chip{background:var(--surface)}
.r-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.r-top b{font:600 16px/1.4 var(--f-display)}
.r-val{font:600 36px/1.15 var(--f-num);direction:ltr;text-align:right;letter-spacing:-.5px}
.r-val small{font:500 14px var(--f-body);color:var(--muted);letter-spacing:0}
.result p{margin:2px 0 0;font-size:14px}
/* log */
.mchips{display:flex;gap:6px;flex-wrap:wrap}
.mchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--ink)}
.mchip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mchip small{font-family:var(--f-num);opacity:.7;margin-inline-start:4px}
.chart{direction:ltr;margin-top:8px}
.chart svg{display:block;width:100%;height:auto}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .tk{fill:var(--muted);font:500 10px var(--f-num)}
.chart .band{fill:var(--ok-soft)}
.chart .ref{stroke:var(--ok);stroke-width:1;stroke-dasharray:3 3;opacity:.7}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:middle;margin-inline-end:5px}

ب أن يبدأ بـ https://":"The PayPal link must start with https://","إذا كان الألم موضعياً ويزداد عند الضغط على مكانه أو مع حركة معينة، فقد يكون من العضلات أو الأضلاع. الراحة والكمادات الدافئة والمسكن البسيط قد تساعد. أي ألم صدر جديد غير واضح السبب يستحق تقييماً طبياً.":"If the pain is in one spot and gets worse when you press on it or with a certain movement, it may come from the muscles or ribs. Rest, warm compresses and a simple painkiller may help. Any new chest pain without a clear cause deserves a medical check.","اشرب الماء، وارتح في غرفة هادئة قليلة الإضاءة، ونَم إن استطعت. يمكن استخدام مسكن مثل الباراسيتامول وفق النشرة. قلّل الكافيين والشاشات، ولاحظ إن كان الصداع يتكرر مع أطعمة أو مواقف معينة.":"Drink water, rest in a quiet, dim room, and sleep if you can. A painkiller such as paracetamol can be used as directed on the leaflet. Cut down on caffeine and screens, and notice whether the headache returns with certain foods or situations.","إذا كان خفيفاً ومع زكام، فارتح واشرب السوائل وتجنب الدخان. جرّب التنفس البطيء: شهيق من الأنف 4 ثوانٍ وزفير من الفم 6 ثوانٍ. إن كان لديك بخاخ موصوف فاستخدمه حسب تعليمات طبيبك.":"If it is mild and comes with a cold, rest, drink fluids and avoid smoke. Try slow breathing: breathe in through your nose for 4 seconds and out through your mouth for 6 seconds. If you have a prescribed inhaler, use it as your doctor instructed.","الراحة والسوائل الدافئة والعسل (للبالغين والأطفال فوق سنة) تخفف السعال. الغرغرة بماء دافئ وملح تريح الحلق. معظم نزلات البرد تتحسن خلال 7–10 أيام ولا تحتاج مضاداً حيوياً.":"Rest, warm drinks and honey (for adults and children over one year) ease a cough. Gargling with warm salt water soothes the throat. Most colds get better within 7–10 days and do not need antibiotics.","تناول وجبات صغيرة وخفيفة، وتجنب الدهون والتوابل الحارة، واشرب السوائل. الكمادة الدافئة على البطن قد تريح التقلصات. تجنب مسكنات مثل الإيبوبروفين إذا كان الألم في المعدة.":"Eat small, light meals, avoid fatty and spicy food, and drink fluids. A warm compress on the belly may ease cramps. Avoid painkillers such as ibuprofen if the pain is in your stomach.","ذكرتَ أفكاراً عن إيذاء نفسك. هذا شعور يمرّ به كثيرون، ولست وحدك. تحدّث اليوم مع شخص تثق به، أو مع طبيب أو أخصائي نفسي. إذا شعرت أنك في خطر الآن فاتصل بالطوارئ فوراً":"You mentioned thoughts of hurting yourself. Many people go through this feeling, and you are not alone. Talk today with someone you trust, or with a doctor or mental health professional. If you feel you are in danger right now, call emergency services immediately","أفينا ليست جهازاً طبياً معتمداً. القياسات بالكاميرا والحساسات تقريبية وتتأثر بالإضاءة والحركة ونوع الهاتف. لا تغيّر علاجك بناءً على التطبيق دون استشارة طبيبك.":"Avina is not a certified medical device. Camera and sensor measurements are approximate and are affected by light, movement and phone model. Do not change your treatment based on the app without consulting your doctor.","اشرب سوائل كثيرة، وارتح، والبس ملابس خفيفة. خافض الحرارة مثل الباراسيتامول وفق النشرة يخفف الانزعاج. سجّل حرارتك كل بضع ساعات في التطبيق لمتابعة التغيّر.":"Drink plenty of fluids, rest and wear light clothing. A fever reducer such as paracetamol, taken as directed on the leaflet, eases discomfort. Log your temperature every few hours in the app to follow the change.","تناول 15–20 غراماً من سكر سريع فوراً (نصف كوب عصير أو 3–4 ملاعق صغيرة سكر) وأعد القياس بعد 15 دقيقة. إذا كان الشخص مشوشاً أو فاقد الوعي فاتصل بالإسعاف.":"Take 15–20 grams of fast sugar right away (half a cup of juice or 3–4 teaspoons of sugar) and measure again after 15 minutes. If the person is confused or unconscious, call an ambulance.","إذا ظهر لك تشوّه جديد في الخطوط فراجع طبيب العيون خلال أيام، وفي اليوم نفسه إن ظهر فجأة. كرر هذا الفحص أسبوعياً إذا كنت فوق الخمسين أو مصاباً بالسكري.":"If you notice new distortion in the lines, see an eye doctor within days, and the same day if it appears suddenly. Repeat this test weekly if you are over fifty or have diabetes.","المستخدم المجاني يقرأ المقالات الجاهزة فقط، لذلك اكتب مقالات الأقسام مسبقاً. تُكتب كل مقالة مرة واحدة وتُحفظ للجميع. مع المزوّد المجاني قد تتوقف الكتابة عند بلوغ الحد اليومي فتُكمَل في اليوم التالي، ومع Claude تكلّف المقالة تقريباً 0.07 دولار (المجموع":"Free users can only read ready-made articles, so write the section articles in advance. Each article is written once and saved for everyone. With the free provider, writing may stop at the daily limit and continue the next day; with Claude an article costs about $0.07 (total","تجنب ما تشك أنه سبب الحساسية، واستخدم كمادات باردة ومرطباً خالياً من العطور. مضاد الهيستامين المتاح دون وصفة قد يخفف الحكة وفق النشرة. لا تحك الجلد.":"Avoid whatever you suspect caused the allergy, and use cold compresses and a fragrance-free moisturizer. An over-the-counter antihistamine may ease itching as directed on the leaflet. Do not scratch your skin.","استمر في الحركة الخفيفة بدل الراحة التامة في السرير. الكمادات الدافئة والمسكنات البسيطة وفق النشرة تساعد. معظم آلام الظهر تتحسن خلال أسابيع قليلة.":"Keep moving gently instead of complete bed rest. Warm compresses and simple painkillers, taken as directed, help. Most back pain improves within a few weeks.","نَم 7–9 ساعات بانتظام، واشرب الماء، وتحرك يومياً ولو بالمشي 20 دقيقة. اختبار المزاج في التطبيق قد يكشف إن كان للتعب علاقة بالتوتر أو الاكتئاب.":"Sleep 7–9 hours regularly, drink water, and move every day, even a 20-minute walk. The mood test in the app may show whether your tiredness is linked to stress or depression.","اشرب محلول معالجة الجفاف برشفات صغيرة ومتكررة. تناول أطعمة خفيفة مثل الأرز والموز والخبز المحمص حين تتحسن. اغسل يديك جيداً لتجنب نقل العدوى.":"Drink oral rehydration solution in small, frequent sips. Eat light foods such as rice, bananas and toast when you feel better. Wash your hands well to avoid spreading infection.","اجلس أو استلقِ فوراً وارفع قدميك. اشرب الماء وتناول شيئاً إن لم تأكل منذ مدة. قِس ضغطك وسكرك إن أمكن وسجّلهما. انهض ببطء من الجلوس والنوم.":"Sit or lie down right away and raise your feet. Drink water and eat something if you have not eaten for a while. Measure and log your blood pressure and sugar if you can. Get up slowly from sitting or lying down.","استرح 5 دقائق وأعد القياس. إذا بقي مرتفعاً أو صاحبه ألم في الصدر أو ضيق نفس أو صداع شديد أو ضعف أو اضطراب في الرؤية، فاتصل بالإسعاف فوراً.":"Rest 5 minutes and measure again. If it stays high or comes with chest pain, shortness of breath, severe headache, weakness or vision problems, call an ambulance immediately.","ضع بطاقة بنكية (أو أي بطاقة بالحجم نفسه) بالطول على الشاشة في زاوية المستطيل، ثم حرّك المؤشر حتى يطابق عرض المستطيل عرض البطاقة تماماً.":"Place a bank card (or any card of the same size) upright on the screen in the corner of the rectangle, then move the slider until the rectangle's width matches the card's width exactly.","أفينا أداة للمتابعة والتوعية الصحية، وليست جهازاً طبياً معتمداً، ولا تغني عن الطبيب. في الحالات الطارئة اتصل بالإسعاف":"Avina is a tool for health tracking and awareness. It is not a certified medical device and does not replace a doctor. In an emergency, call an ambulance","اكتب أي موضوع يخص جسمك أو صحتك، أو اختر من الأقسام بالأسفل. يُكتب كل مدخل بعد مراجعة دقيقة، ويمكنك طلب مراجعة ثانية لدقته.":"Type any topic about your body or health, or choose from the sections below. Each entry is written after careful review, and you can ask for a second accuracy review.","المعدل الطبيعي 95% فأكثر. أعد القياس، وراجع الطبيب إن تكرر أو صاحبه ضيق نفس. مرضى الرئة المزمنة قد تكون لهم أهداف أخرى.":"Normal is 95% or higher. Measure again, and see a doctor if it repeats or comes with shortness of breath. People with chronic lung disease may have different targets.","معلومات تثقيفية عامة كتبها نموذج ذكاء اصطناعي، وقد تحتوي أخطاء. لا تغني عن الطبيب، ولا تبدأ دواءً أو توقفه بناءً عليها.":"General educational information written by an AI model, and it may contain mistakes. It does not replace a doctor. Do not start or stop a medicine based on it.","جرّب مرة أخرى: لمسة خفيفة دون ضغط، وغطِّ الفلاش والعدسة معاً، وثبّت يدك. الأيدي الباردة تضعف الإشارة؛ دفّئها أولاً.":"Try again: a light touch without pressing, cover the flash and lens together, and keep your hand still. Cold hands weaken the signal, so warm them first.","أعراضك، أو تحليل لا تفهمه، أو دواء، أو كيف يعمل جسمك. يقرأ ملفك وقراءاتك الأخيرة، ويخبرك بدرجة ثقته في كل إجابة.":"Your symptoms, a lab test you do not understand, a medicine, or how your body works. It reads your profile and recent readings and tells you how confident it is in each answer.","اجلس وتنفس ببطء. قلّل الكافيين ومشروبات الطاقة والتدخين. قِس نبضك بالكاميرا وسجّله، وأخبر طبيبك إن تكرر الخفقان.":"Sit down and breathe slowly. Cut down on caffeine, energy drinks and smoking. Measure your pulse with the camera and log it, and tell your doctor if the palpitations come back.","إذا لم يستطع الكلام أو التنفس: 5 ضربات قوية بين لوحي الكتف ثم 5 ضغطات على البطن فوق السرة إلى الداخل والأعلى.":"If they cannot speak or breathe: 5 firm blows between the shoulder blades, then 5 thrusts on the belly above the navel, inward and upward.","اشرب كمية جيدة من الماء ولا تؤجل التبول. إذا لم تتحسن الحرقة خلال يومين أو تكررت، فراجع الطبيب لتحليل البول.":"Drink plenty of water and do not hold in urine. If the burning does not improve within two days or keeps coming back, see a doctor for a urine test.","هذا مؤشر أولي؛ يؤكده طبيب العيون باختبار قياسي. تأكد من إيقاف الوضع الليلي ومرشحات الألوان ثم أعد الاختبار.":"This is an early indicator; an eye doctor confirms it with a standard test. Make sure night mode and color filters are off, then repeat the test.","ما ذكرته من علامات الخطر يحتاج تقييماً طبياً فورياً. لا تقُد السيارة بنفسك، وابقَ مع شخص حتى تصل المساعدة.":"The danger signs you mentioned need immediate medical assessment. Do not drive yourself, and stay with someone until help arrives.","هذا نطاق ما قبل السكري (100–125). الحركة وتقليل السكريات والنشويات المكررة تساعد، واطلب تحليلاً تأكيدياً.":"This is the prediabetes range (100–125). Exercise and cutting down on sugars and refined starches help; ask for a confirmatory test.","اشرب السوائل وارتح. خافض الحرارة يخفف الانزعاج. راجع الطبيب إن استمرت أكثر من 3 أيام أو ظهرت علامات خطر.":"Drink fluids and rest. A fever reducer eases discomfort. See a doctor if it lasts more than 3 days or danger signs appear.","استخدم خافض الحرارة واطلب استشارة طبية اليوم، وفوراً إذا صاحبها تيبس رقبة أو تشوش أو طفح أو صعوبة تنفس.":"Use a fever reducer and get medical advice today, and immediately if it comes with a stiff neck, confusion, a rash or difficulty breathing.","الأعراض التي اخترتها تستحق فحصاً طبياً خلال 24 ساعة. إذا ظهرت أي علامة خطر قبل ذلك فاتصل بالإسعاف.":"The symptoms you chose deserve a medical check within 24 hours. If any danger sign appears before then, call an ambulance.","من قياسات منزلية سجّلها المستخدم في تطبيق أفينا، وهي قياسات استرشادية تحتاج تأكيداً سريرياً.":"from home measurements the user logged in the Avina app. These are indicative measurements that need clinical confirmation.","تُحفظ بياناتك على هذا الجهاز فقط. أنشئ حساباً لتحفظها في السحابة، أو احتفظ بنسخة احتياطية دورياً.":"Your data is saved on this device only. Create an account to save it in the cloud, or keep a backup regularly.","راقب مزاجك، وأعد الاختبار بعد أسبوعين. الحركة اليومية والنوم المنتظم والتحدث مع شخص تثق به تساعد.":"Watch your mood and repeat the test in two weeks. Daily activity, regular sleep and talking with someone you trust help.","اجلس مرتاحاً 5 دقائق، ظهرك مسنود وقدماك على الأرض، والذراع بمستوى القلب. لا تتكلم أثناء القياس.":"Sit comfortably for 5 minutes, back supported, feet flat on the floor, arm at heart level. Do not talk while measuring.","تابع القياس على عدة أيام. الحركة اليومية وتقليل الملح والوزن تخفض الضغط. استشر طبيبك إن استمر.":"Keep measuring over several days. Daily activity and cutting salt and weight lower blood pressure. See your doctor if it persists.","تناول 15 غراماً من سكر سريع (نصف كوب عصير، أو 3–4 ملاعق صغيرة سكر)، وأعد القياس بعد 15 دقيقة.":"Take 15 grams of fast sugar (half a cup of juice, or 3–4 teaspoons of sugar), and measure again after 15 minutes.","قراءتان صائمتان عند 126 أو أكثر قد تشيران إلى السكري. راجع الطبيب لإجراء تحليل السكر التراكمي":"Two fasting readings of 126 or more may indicate diabetes. See your doctor for an HbA1c test","أنشئ حساباً مجانياً لتحفظ ملفك الصحي في السحابة، وتستخدم الطبيب الذكي والموسوعة من أي جهاز.":"Create a free account to save your health profile in the cloud and use the smart doctor and the encyclopedia from any device.","ستسمع نغمات تتصاعد تدريجياً في كل أذن. اضغط «أسمعها» فور سماع أي نغمة ولو كانت خافتة جداً.":"You will hear tones that get gradually louder in each ear. Tap «I hear it» as soon as you hear any tone, even a very faint one.","ضعف السمع المفاجئ في أذن واحدة حالة عاجلة تستدعي مراجعة طبيب الأنف والأذن خلال 24–48 ساعة.":"Sudden hearing loss in one ear is urgent and needs an ear, nose and throat doctor within 24–48 hours.","تنفس أسرع من 24 في الراحة قد يدل على مشكلة؛ اطلب تقييماً طبياً، وفوراً إذا صاحبه ضيق نفس.":"Breathing faster than 24 at rest may point to a problem; get a medical assessment, and immediately if it comes with shortness of breath.","هذا استبيان فحص أولي وليس تشخيصاً. حُفظت النتيجة لتقارنها عند إعادة الاختبار بعد أسبوعين.":"This is a screening questionnaire, not a diagnosis. The result was saved so you can compare when you repeat the test in two weeks.","اشرب الماء وأعد القياس. إذا صاحبه قيء أو ألم بطن أو تنفس سريع أو نعاس فاطلب رعاية عاجلة.":"Drink water and measure again. If it comes with vomiting, belly pain, fast breathing or drowsiness, get urgent care.","تأكد أنك مرتاح منذ 5 دقائق. القهوة والتوتر والحمى والجفاف ترفع النبض. أعد القياس لاحقاً.":"Make sure you have been resting for 5 minutes. Coffee, stress, fever and dehydration raise the pulse. Measure again later.","قد يكون طبيعياً عند الرياضيين وأثناء الراحة العميقة. استشر الطبيب إن صاحبه تعب أو دوخة.":"It can be normal in athletes and during deep rest. See a doctor if it comes with function bindState(x){

  x.family=(Array.isArray(x.family)?x.family:[]).filter(q=>q&&typeof q==='object'&&typeof q.id==='string'&&q.profile).map(fixPerson);

function mdLite(t){

/* ---------- signal processing ---------- */
function resample(ts,vs,fs){const out=[];if(ts.length<2)return out;const dt=1/fs;let j=0;for(let t=ts[0];t<=ts[ts.length-1];t+=dt){while(j<ts.length-2&&ts[j+1]<t)j++;const span=ts[j+1]-ts[j]||1;const f=clamp((t-ts[j])/span,0,1);out.push(vs[j]+(vs[j+1]-vs[j])*f)}return out}
function movAvg(x,w){const n=x.length,p=new Float64Array(n+1);for(let i=0;i<n;i++)p[i+1]=p[i]+x[i];const h=Math.floor(w/2),o=new Array(n);for(let i=0;i<n;i++){const a=Math.max(0,i-h),b=Math.min(n-1,i+h);o[i]=(p[b+1]-p[a])/(b-a+1)}return o}
function bandpass(x,fs,lo,hi){const tr=movAvg(x,Math.max(3,Math.round(fs/lo)));const d=x.map((v,i)=>v-tr[i]);return movAvg(d,Math.max(1,Math.round(fs/hi/2)))}
function autoRate(y,fs,minR,maxR){
  const n=y.length;if(n<fs*4)return null;let m=0;for(const v of y)m+=v;m/=n;const x=y.map(v=>v-m);
  const l0=Math.max(2,Math.floor(fs*60/maxR)),l1=Math.min(n-3,Math.ceil(fs*60/minR));if(l1<=l0+2)return null;
  const ac=new Float64Array(l1+2);
  for(let L=l0-1;L<=l1+1;L++){let s=0,e1=0,e2=0;for(let i=0;i+L<n;i++){s+=x[i]*x[i+L];e1+=x[i]*x[i];e2+=x[i+L]*x[i+L]}ac[L]=s/Math.sqrt(e1*e2||1)}
  const pk=[];for(let L=l0;L<=l1;L++)if(ac[L]>ac[L-1]&&ac[L]>=ac[L+1])pk.push(L);if(!pk.length)return null;
  let bl=pk[0],best=ac[bl];for(const L of pk)if(ac[L]>best){best=ac[L];bl=L}
  for(const L of pk){if(L<bl&&Math.abs(L*2-bl)<=2&&ac[L]>0.85*best){bl=L;best=ac[L];break}}
  const a=ac[bl-1],b=ac[bl],c=ac[bl+1],den=a-2*b+c,off=den?0.5*(a-c)/den:0;
  return{rate:60*fs/(bl+clamp(off,-.5,.5)),q:best};
}
function drawWave(cv,arr,cap,color){
  const dpr=window.devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;if(!W)return;
  if(cv.width!==Math.round(W*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr)}
  const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,W,H);if(arr.length<2)return;
  let mx=0;for(const v of arr)mx=Math.max(mx,Math.abs(v));mx=mx||1;
  c.strokeStyle=color;c.lineWidth=2;c.lineJoin='round';c.beginPath();
  arr.forEach((v,i)=>{const x=(i/(cap-1))*W;const y=H/2-v/mx*H*0.38;i?c.lineTo(x,y):c.moveTo(x,y)});c.stroke();
}

function imgToJpeg(file,max=1600,q=.82){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{try{const k=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.naturalWidth*k));c.height=Math.max(1,Math.round(im.naturalHeight*k));
    const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',q).split(',')[1])}catch(e){rej(e)}};

      if(ser.length){const f=(i,fn)=>fn(...ser.map(s=>s[i])),avg=i=>ser.reduce((a,s)=>a+s[i],0)/ser.length;
        const dec=['temp','tremor'].includes(logK)?(logK==='tremor'?2:1):(logK==='wt'||(logK==='glu'&&P().gluUnit==='mmol')?1:0);

function niceStep(raw){const p=10**Math.floor(Math.log10(raw||1)),n=raw/p;return (n<1.5?1:n<3?2:n<7?5:10)*p}
function chartSVG(pts,o){
  if(pts.length<2)return `<p class="hint">تحتاج قراءتين على الأقل لرسم المنحنى.</p>`;
  const W=340,H=176,L=36,R=12,T=12,B=26;
  const xs=pts.map(p=>p.x),x0=Math.min(...xs),x1=Math.max(...xs);
  let ys=pts.flatMap(p=>p.ys.filter(v=>v!=null));const allY=[...ys];if(o.band)allY.push(...o.band);if(o.refs)allY.push(...o.refs);
  let y0=Math.min(...allY),y1=Math.max(...allY);const pad=(y1-y0)*0.12||1;y0-=pad;y1+=pad;
  const st=niceStep((y1-y0)/4),ticks=[];for(let t=Math.ceil(y0/st)*st;t<=y1;t+=st)ticks.push(+t.toFixed(6));
  const X=v=>L+(W-L-R)*(v-x0)/((x1-x0)||1),Y=v=>T+(H-T-B)*(1-(v-y0)/(y1-y0));
  const dec=st<1?(st<0.1?2:1):0;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="منحنى القراءات">`;
  if(o.band)s+=`<rect class="band" x="${L}" y="${Y(Math.min(o.band[1],y1)).toFixed(1)}" width="${W-L-R}" height="${(Y(Math.max(o.band[0],y0))-Y(Math.min(o.band[1],y1))).toFixed(1)}"/>`;
  ticks.forEach(t=>{s+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}"/><text class="tk" x="${L-6}" y="${(Y(t)+3.5).toFixed(1)}" text-anchor="end">${t.toFixed(dec)}</text>`});
  (o.refs||[]).forEach(r=>{s+=`<line class="ref" x1="${L}" x2="${W-R}" y1="${Y(r).toFixed(1)}" y2="${Y(r).toFixed(1)}"/>`});
  const cols=['var(--accent)','var(--pulse)'];const nser=pts[0].ys.length;
  for(let i=0;i<nser;i++){
    const P2=pts.filter(p=>p.ys[i]!=null).map(p=>[X(p.x),Y(p.ys[i])]);
    if(i===0&&nser===1)s+=`<path d="M${P2[0][0].toFixed(1)} ${Y(y0).toFixed(1)} ${P2.map(q=>'L'+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ')} L${P2[P2.length-1][0].toFixed(1)} ${Y(y0).toFixed(1)}Z" fill="${cols[0]}" fill-opacity=".10"/>`;
    s+=`<polyline points="${P2.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ')}" fill="none" stroke="${cols[i]}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
    P2.forEach((q,j)=>{s+=`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="${j===P2.length-1?4.2:2.2}" fill="${j===P2.length-1?cols[i]:'var(--surface)'}" stroke="${cols[i]}" stroke-width="1.6"/>`});
  }
  s+=`<text class="tk" x="${L}" y="${H-6}" text-anchor="start">${fD.format(x0)}</text><text class="tk" x="${W-R}" y="${H-6}" text-anchor="end">${fD.format(x1)}</text></svg>`;
  return s;
}

function bodyNums(){
  const p=P(),h=+p.height,w=+p.weight,a=age(),sex=p.sex;
  if(!(h>50)||!(w>10))return `<p class="hint" style="margin:0">أدخل طولك ووزنك لحساب مؤشراتك.</p>`;
  const hm=h/100,bmi=w/(hm*hm),cb=cBMI(bmi),rows=[];
  rows.push(['مؤشر كتلة الجسم',bmi.toFixed(1),`<span class="chip ${cb.lv}">${cb.t}</span>`]);
  rows.push(['الوزن الصحي لطولك',(18.5*hm*hm).toFixed(0)+'–'+(24.9*hm*hm).toFixed(0)+' كغ','']);
  if(a&&(sex==='m'||sex==='f')){const bmr=10*w+6.25*h-5*a+(sex==='m'?5:-161),tdee=bmr*(+p.activity||1.375);
    rows.push(['الحرق الأساسي (BMR)',Math.round(bmr)+' سعرة','معادلة ميفلين']);
    rows.push(['احتياجك اليومي',Math.round(tdee)+' سعرة','لإنقاص الوزن: '+Math.round(tdee-500)])}
  rows.push(['الماء اليومي',(Math.round(w*33/250)*250/1000).toFixed(2).replace(/0$/,'')+' لتر','33 مل لكل كغ']);
  if(a){const mx=220-a;rows.push(['أقصى نبض',mx+' ن/د','220 − العمر']);rows.push(['نبض حرق الدهون',Math.round(mx*.6)+'–'+Math.round(mx*.7)+' ن/د','60–70%']);rows.push(['نبض اللياقة القلبية',Math.round(mx*.7)+'–'+Math.round(mx*.85)+' ن/د','70–85%'])}
  const wa=+p.waist,ne=+p.neck,hi=+p.hip;
  if(wa>30){const r=wa/h;rows.push(['نسبة الخصر إلى الطول',r.toFixed(2),`<span class="chip ${r<0.5?'ok':r<0.6?'warn':'bad'}">${r<0.5?'صحية':r<0.6?'مرتفعة':'مرتفعة جداً'}</span>`])}
  if(wa>30&&ne>15&&(sex==='m'||(sex==='f'&&hi>30))){
    let bf=sex==='m'?495/(1.0324-0.19077*Math.log10(wa-ne)+0.15456*Math.log10(h))-450:495/(1.29579-0.35004*Math.log10(wa+hi-ne)+0.22100*Math.log10(h))-450;
    if(isFinite(bf)&&bf>2&&bf<70){const cut=sex==='m'?[6,14,18,25]:[14,21,25,32];const lab=bf<cut[0]?['رياضي جداً','ok']:bf<cut[1]?['رياضي','ok']:bf<cut[2]?['لياقة جيدة','ok']:bf<cut[3]?['متوسط','warn']:['مرتفع','bad'];
      rows.push(['نسبة الدهون (طريقة البحرية)',bf.toFixed(1)+'%',`<span class="chip ${lab[1]}">${lab[0]}</span>`])}}
  return `<div class="kv">${rows.map(r=>`<div><span>${r[0]}</span><span><b>${r[1]}</b>${r[2]?`<em>${r[2]}</em>`:''}</span></div>`).join('')}</div>`;
}

/* ---------- add reading ---------- */
function numIn(id,label,ph,attrs='inputmode="decimal"'){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" class="numin" ${attrs} placeholder="${ph}" autocomplete="off"></div>`}
const getN=id=>{const v=($('#'+id)||{}).value;if(v==null||String(v).trim()==='')return null;const n=parseFloat(String(v).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace('٫','.').replace(',','.'));return isFinite(n)?n:NaN};
function sheetAdd(k){
  const forms={
    bp:`<div class="form">${numIn('f-sys','الانقباضي (الرقم العلوي)','120','inputmode="numeric"')}${numIn('f-dia','الانبساطي (الرقم السفلي)','80','inputmode="numeric"')}${numIn('f-pul','النبض (اختياري)','72','inputmode="numeric"')}</div><p class="hint">اجلس مرتاحاً 5 دقائق، ظهرك مسنود وقدماك على الأرض، والذراع بمستوى القلب. لا تتكلم أثناء القياس.</p>`,
    glu:`<div class="form">${numIn('f-glu','السكر ('+gUnit()+')',P().gluUnit==='mmol'?'5.4':'95')}</div><div class="field"><span class="lbl">توقيت القياس</span><div class="seg">${Object.entries(CTX).map(([v,n],i)=>`<label><input type="radio" name="f-ctx" value="${v}" ${i===0?'checked':''}><span>${n}</span></label>`).join('')}</div></div><p class="hint">صائم = دون طعام 8 ساعات على الأقل.</p>`,
    spo2:`<div class="form">${numIn('f-spo','تشبع الأكسجين (%)','98','inputmode="numeric"')}${numIn('f-pul','النبض (اختياري)','72','inputmode="numeric"')}</div><p class="hint">استخدم جهاز قياس الأكسجين على الإصبع، ويدك دافئة وثابتة، وانتظر حتى تستقر القراءة.</p>`,
    temp:`<div class="form">${numIn('f-tmp','الحرارة (°م)','36.8')}</div><p class="hint">يمكنك إدخال الفهرنهايت وسيُحوَّل تلقائياً.</p>`,
    wt:`<div class="form">${numIn('f-wt','الوزن (كغ)',P().weight||'70')}</div><p class="hint">تزن صباحاً بعد دخول الحمام وقبل الأكل للحصول على قراءات قابلة للمقارنة.</p>`,
    hr:`<div class="form">${numIn('f-hr','النبض (نبضة/د)','72','inputmode="numeric"')}</div><p class="hint">عُدّ نبضك في المعصم 30 ثانية واضربه في 2، أو استخدم <button type="button" class="linkish" data-act="test" data-t="heart">القياس بالكاميرا</button>.</p>`,
    rr:`<div class="form">${numIn('f-rr','الأنفاس في الدقيقة','16','inputmode="numeric"')}</div><p class="hint">عُدّ مرات ارتفاع صدرك خلال 30 ثانية واضربها في 2، أو استخدم <button type="button" class="linkish" data-act="test" data-t="breath">القياس بالحساس</button>.</p>`
  };
  openSheet('سجّل '+MET[k].n,`<form id="addF" class="sheet-b" novalidate>${forms[k]}<p class="err" id="addErr"></p><button class="btn block" type="submit">احفظ القراءة</button></form><div id="addOut"></div>`,b=>{
    const f=$('#addF',b);setTimeout(()=>{const i=$('input.numin',f);if(i)i.focus()},120);
    f.addEventListener('submit',e=>{e.preventDefault();const err=$('#addErr',b);err.textContent='';
      const bad=m=>{err.textContent=m;return null};let v=null,note='';
      if(k==='bp'){const s=getN('f-sys'),d=getN('f-dia'),p=getN('f-pul');if(!(s>=60&&s<=260))return bad('أدخل الرقم العلوي بين 60 و260.');if(!(d>=30&&d<=160))return bad('أدخل الرقم السفلي بين 30 و160.');if(d>=s)return bad('الرقم العلوي يجب أن يكون أكبر من السفلي.');v={sys:Math.round(s),dia:Math.round(d)};if(p>=30&&p<=220)v.pulse=Math.round(p)}
      if(k==='glu'){let g=getN('f-glu');const mm=P().gluUnit==='mmol';if(!(g>0))return bad('أدخل قيمة السكر.');const mg=mm?g*18:g;if(!(mg>=20&&mg<=600))return bad(mm?'أدخل قيمة بين 1.1 و33.3.':'أدخل قيمة بين 20 و600.');v={mg:Math.round(mg),ctx:($('input[name="f-ctx"]:checked',b)||{}).value||'r'}}
      if(k==='spo2'){const s=getN('f-spo');if(!(s>=60&&s<=100))return bad('أدخل نسبة بين 60 و100.');v={pct:Math.round(s)}}
      if(k==='temp'){let t=getN('f-tmp');if(t>=90&&t<=110){t=(t-32)*5/9;note='حُوّلت من فهرنهايت.'}if(!(t>=33&&t<=43))return bad('أدخل حرارة بين 33 و43 درجة مئوية.');v={c:Math.round(t*10)/10}}
      if(k==='wt'){const w=getN('f-wt');if(!(w>=20&&w<=300))return bad('أدخل وزناً بين 20 و300 كغ.');v={kg:Math.round(w*10)/10}}
      if(k==='hr'){const h=getN('f-hr');if(!(h>=30&&h<=220))return bad('أدخل نبضاً بين 30 و220.');v={bpm:Math.round(h),src:'man'}}
      if(k==='rr'){const r=getN('f-rr');if(!(r>=4&&r<=60))return bad('أدخل قيمة بين 4 و60.');v={rpm:Math.round(r),src:'man'}}
      if(!v)return;
      addReading(k,v);
      if((k==='bp'||k==='spo2')){const p=getN('f-pul');if(p>=30&&p<=220)addReading('hr',{bpm:Math.round(p),src:k})}
      const c=MET[k].cls(v);f.hidden=true;
      $('#addOut',b).innerHTML=`<div class="sheet-b">${resultHTML(c,MET[k].val(v),unitOf(k))}${note?`<p class="hint">${note}</p>`:''}<div class="row"><button class="btn" type="button" data-act="close">تم</button><button class="btn ghost" type="button" data-act="add" data-k="${k}">قراءة أخرى</button></div></div>`;
    });
  });
}

/* ---------- test: heart (camera PPG) ---------- */
function testHeart(b){
  b.innerHTML=`<div class="stage">
    <div class="hr-top"><div class="hr-cam"><video id="hrVid" playsinline muted autoplay></video></div><div class="bignum"><bdi id="hrBpm">--</bdi><small>نبضة في الدقيقة</small></div>${ic('heart','heart')}</div>
    <canvas class="wave" id="hrWave" aria-hidden="true"></canvas>
    <div class="prog"><i id="hrProg"></i></div>
    <div class="status" id="hrSt">اضغط «ابدأ» ثم غطِّ الكاميرا الخلفية والفلاش بطرف إصبعك.</div>
  </div>
  <ol class="steps"><li>اجلس واسترح دقيقة قبل القياس.</li><li>غطِّ العدسة والفلاش معاً بطرف السبابة، بلمسة خفيفة دون ضغط.</li><li>ثبّت يدك ولا تتكلم حتى يكتمل الشريط (30 ثانية).</li></ol>
  <button class="btn block" type="button" id="hrGo">${ic('heart')}ابدأ القياس</button>
  <div id="hrOut"></div>`;
  const vid=$('#hrVid',b),st=$('#hrSt',b),bpmEl=$('#hrBpm',b),prog=$('#hrProg',b),wave=$('#hrWave',b),goBtn=$('#hrGo',b),out=$('#hrOut',b),heart=$('.heart',b);
  const DUR=30,WARM=2.5,CAP=150,col=cssVar('--pulse')||'#cf3653';
  let stream=null,stopped=true,t0=null,miss=0,ema1=null,ema2=0,lastEst=0;let ts=[],R=[],G=[],disp=[];
  const cv=document.createElement('canvas');cv.width=40;cv.height=30;const cx=cv.getContext('2d',{willReadFrequently:true});
  function stopCam(){stopped=true;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}try{vid.srcObject=null}catch(e){}}
  function reset(){t0=null;ts=[];R=[];G=[];disp=[];ema1=null;ema2=0;prog.style.width='0';bpmEl.textContent='--';heart.classList.remove('beat')}
  function estimate(a,bnd){
    const idx=[];for(let i=0;i<ts.length;i++)if(ts[i]>=a&&ts[i]<=bnd)idx.push(i);if(idx.length<60)return null;
    const t=idx.map(i=>ts[i]);let best=null;
    for(const ch of [R,G]){const v=idx.map(i=>ch[i]);const mean=v.reduce((x,y)=>x+y,0)/v.length;if(mean>252||mean<8)continue;
      const y=bandpass(resample(t,v,30),30,0.7,4);const e=autoRate(y,30,40,180);if(e&&(!best||e.q>best.q))best=e}
    return best;
  }
  function frame(){
    if(stopped)return;
    if(vid.readyState>=2&&vid.videoWidth){
      cx.drawImage(vid,0,0,40,30);const d=cx.getImageData(8,6,24,18).data;let r=0,g=0,bl=0;const n=d.length/4;
      for(let i=0;i<d.length;i+=4){r+=d[i];g+=d[i+1];bl+=d[i+2]}r/=n;g/=n;bl/=n;
      const now=performance.now()/1000,finger=r>55&&r>g*1.45&&r>bl*1.45;
      if(!finger){if(++miss>8&&t0!==null){reset();st.textContent='ابتعد إصبعك. أعد وضعه على الكاميرا والفلاش معاً.'}else if(t0===null)st.textContent='ضع طرف إصبعك على الكاميرا الخلفية والفلاش…'}
      else{miss=0;if(t0===null){t0=now;st.textContent='ممتاز، ثبّت إصبعك… جارٍ القياس'}
        const el=now-t0;ts.push(el);R.push(r);G.push(g);
        const sig=r>250?g:r;if(ema1===null)ema1=sig;ema1+=(sig-ema1)*0.05;const hp=sig-ema1;ema2+=(hp-ema2)*0.4;disp.push(-ema2);if(disp.length>CAP)disp.shift();drawWave(wave,disp,CAP,col);
        prog.style.width=clamp(el/DUR*100,0,100)+'%';
        if(el>WARM+7&&now-lastEst>1){lastEst=now;const e=estimate(Math.max(WARM,el-10),el);if(e&&e.q>0.3){bpmEl.textContent=Math.round(e.rate);heart.style.setProperty('--beat',(60/e.rate).toFixed(2)+'s');heart.classList.add('beat')}}
        if(el>=DUR){finish();return}}
    }
    if(vid.requestVideoFrameCallback)vid.requestVideoFrameCallback(frame);else requestAnimationFrame(frame);
  }
  function finish(){
    const e=estimate(WARM,DUR);stopCam();goBtn.hidden=false;goBtn.disabled=false;goBtn.innerHTML=ic('heart')+'قِس مرة أخرى';heart.classList.remove('beat');
    if(!e||e.q<0.32){st.textContent='';out.innerHTML=`<div class="banner warn">${ic('alert')}<div><b>لم نلتقط نبضاً واضحاً</b><p>جرّب مرة أخرى: لمسة خفيفة دون ضغط، وغطِّ الفلاش والعدسة معاً، وثبّت يدك. الأيدي الباردة تضعف الإشارة؛ دفّئها أولاً.</p></div></div>`;bpmEl.textContent='--';return}
    const bpm=Math.round(e.rate),c=cHR(bpm);bpmEl.textContent=bpm;st.textContent='جودة الإشارة: '+(e.q>0.7?'ممتازة':e.q>0.5?'جيدة':'مقبولة');
    out.innerHTML=`<div class="sheet-b">${resultHTML(c,bpm,'نبضة/د')}<div class="row"><button class="btn" type="button" id="hrSave">احفظ في السجل</button></div></div>`;
    $('#hrSave',out).onclick=ev=>{addReading('hr',{bpm,src:'cam',q:+e.q.toFixed(2)});ev.target.disabled=true;ev.target.textContent='حُفظت';toast('حُفظت القراءة')};
  }
  goBtn.onclick=async()=>{
    out.innerHTML='';reset();goBtn.disabled=true;st.textContent='جارٍ تشغيل الكاميرا…';
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){camFail();return}
    try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:320},height:{ideal:240},frameRate:{ideal:30}}})}catch(e){camFail(e);return}
    const track=stream.getVideoTracks()[0];let torch=false;
    try{const caps=track.getCapabilities&&track.getCapabilities();if(caps&&caps.torch){await track.applyConstraints({advanced:[{torch:true}]});torch=true}}catch(e){}
    vid.srcObject=stream;try{await vid.play()}catch(e){}
    stopped=false;goBtn.hidden=true;st.textContent=torch?'ضع طرف إصبعك على الكاميرا والفلاش…':'لم يتوفر الفلاش في هذا المتصفح. قف قرب ضوء قوي وغطِّ الكاميرا بإصبعك…';
    frame();
  };
  function camFail(e){
    goBtn.disabled=false;st.textContent='';
    const denied=e&&(e.name==='NotAllowedError'||e.name==='SecurityError');
    out.innerHTML=`<div class="banner warn">${ic('alert')}<div><b>الكاميرا غير متاحة</b><p>${IN_VIEWER?'الكاميرا لا تعمل داخل هذا العرض. افتح التطبيق مباشرة في متصفح هاتفك (Chrome أو Safari) لقياس النبض بالكاميرا.':denied?'لم يُسمح باستخدام الكاميرا. اسمح بها من إعدادات المتصفح للموقع ثم أعد المحاولة.':'لم نتمكن من تشغيل الكاميرا الخلفية على هذا الجهاز.'}</p><div class="row" style="margin-top:8px"><button class="btn sm" type="button" data-act="add" data-k="hr">أدخل النبض يدوياً</button></div></div></div>`;
  }
  return stopCam;
}

/* ---------- test: breathing ---------- */
function testBreath(b){
  b.innerHTML=`<div class="field"><span class="lbl">طريقة القياس</span><div class="seg"><label><input type="radio" name="br-m" value="s" checked><span>حساس الحركة</span></label><label><input type="radio" name="br-m" value="t"><span>بالنقر مع كل نفَس</span></label></div></div>
  <div id="brBody"></div>`;
  let live=true,listener=null,timer=0;
  const stopAll=()=>{if(listener)removeEventListener('devicemotion',listener);listener=null;clearInterval(timer)};
  const body=$('#brBody',b);
  function sensorUI(){
    stopAll();
    body.innerHTML=`<div class="stage"><div class="bignum"><bdi id="brN">--</bdi><small>نفَس في الدقيقة</small></div><canvas class="wave" id="brWave"></canvas><div class="prog"><i id="brProg"></i></div><div class="status" id="brSt">استلقِ على ظهرك وضع الهاتف على بطنك فوق السرة، والشاشة إلى الأعلى.</div></div>
    <ol class="steps"><li>استلقِ على ظهرك واسترح دقيقة.</li><li>بعد الضغط على «ابدأ» لديك 5 ثوانٍ لوضع الهاتف على بطنك.</li><li>تنفّس بشكل طبيعي ولا تتحرك لمدة 60 ثانية حتى تسمع الاهتزاز أو ترى النتيجة.</li></ol>
    <button class="btn block" type="button" id="brGo">ابدأ القياس</button><div id="brOut"></div>`;
    const st=$('#brSt',body),go=$('#brGo',body),out=$('#brOut',body),prog=$('#brProg',body),wave=$('#brWave',body),col=cssVar('--accent');
    go.onclick=async()=>{
      out.innerHTML='';go.disabled=true;
      if(!(await motionPerm())||!(await motionProbe())){go.disabled=false;out.innerHTML=`<div class="banner warn">${ic('alert')}<div><b>حساس الحركة غير متاح</b><p>${NO_SENSOR()} يمكنك استخدام طريقة النقر بدلاً منه.</p></div></div>`;return}
      for(let i=5;i>0;i--){if(!live)return;st.textContent='ضع الهاتف على بطنك الآن… '+i;await sleep(1000)}
      const ts=[],ax=[],ay=[],az=[],disp=[];const t0=performance.now()/1000;let base=null;
      listener=e=>{const a=e.accelerationIncludingGravity;if(!a||a.x==null)return;const t=performance.now()/1000-t0;ts.push(t);ax.push(a.x);ay.push(a.y);az.push(a.z);
        if(base===null)base=a.z;base+=(a.z-base)*0.01;disp.push(a.z-base);if(disp.length>300)disp.shift()};
      addEventListener('devicemotion',listener);st.textContent='تنفّس بشكل طبيعي…';
      timer=setInterval(()=>{const el=performance.now()/1000-t0;prog.style.width=clamp(el/60*100,0,100)+'%';drawWave(wave,disp.filter((_,i)=>i%2===0),150,col);
        if(el>=60){stopAll();try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}done()}},200);
      function done(){
        go.disabled=false;go.textContent='قِس مرة أخرى';let best=null;
        for(const ch of [ax,ay,az]){const y=bandpass(resample(ts,ch,10),10,0.1,0.9);const e=autoRate(y,10,6,40);if(e&&(!best||e.q>best.q))best=e}

/* ---------- test: tremor ---------- */
function testTremor(b){
  b.innerHTML=`<div class="stage"><div class="bignum"><bdi id="trN">--</bdi><small>م/ث² · شدة الاهتزاز</small></div><canvas class="wave" id="trWave"></canvas><div class="prog"><i id="trProg"></i></div><div class="status" id="trSt">اجلس، ومدّ ذراعك أمامك، وامسك الهاتف في راحة يدك دون أن تسند مرفقك.</div></div>
  <ol class="steps"><li>اختر اليد التي تريد اختبارها.</li><li>بعد «ابدأ» لديك 3 ثوانٍ لمدّ ذراعك.</li><li>أبقِ يدك ثابتة قدر الإمكان لمدة 15 ثانية.</li></ol>
  <div class="field"><span class="lbl">اليد</span><div class="seg"><label><input type="radio" name="tr-h" value="R" checked><span>اليمنى</span></label><label><input type="radio" name="tr-h" value="L"><span>اليسرى</span></label></div></div>
  <button class="btn block" type="button" id="trGo">ابدأ الاختبار</button><div id="trOut"></div>`;
  let live=true,listener=null,timer=0;const stopAll=()=>{if(listener)removeEventListener('devicemotion',listener);listener=null;clearInterval(timer)};
  const st=$('#trSt',b),go=$('#trGo',b),out=$('#trOut',b),prog=$('#trProg',b),wave=$('#trWave',b),col=cssVar('--accent');
  go.onclick=async()=>{
    out.innerHTML='';go.disabled=true;
    if(!(await motionPerm())||!(await motionProbe())){go.disabled=false;out.innerHTML=`<div class="banner warn">${ic('alert')}<div><b>حساس الحركة غير متاح</b><p>${NO_SENSOR()}</p></div></div>`;return}
    for(let i=3;i>0;i--){if(!live)return;st.textContent='مدّ ذراعك… '+i;await sleep(1000)}
    const ts=[],X=[],Y=[],Z=[],disp=[];const t0=performance.now()/1000;let gx=null,gy,gz;
    listener=e=>{let a=e.acceleration,x,y,z;if(a&&a.x!=null){x=a.x;y=a.y;z=a.z}else{a=e.accelerationIncludingGravity;if(!a||a.x==null)return;if(gx===null){gx=a.x;gy=a.y;gz=a.z}gx+=(a.x-gx)*.1;gy+=(a.y-gy)*.1;gz+=(a.z-gz)*.1;x=a.x-gx;y=a.y-gy;z=a.z-gz}
      const t=performance.now()/1000-t0;ts.push(t);X.push(x);Y.push(y);Z.push(z);disp.push(Math.hypot(x,y,z)*Math.sign(x||1));if(disp.length>150)disp.shift()};
    addEventListener('devicemotion',listener);st.textContent='ثبّت يدك…';
    timer=setInterval(()=>{const el=performance.now()/1000-t0;prog.style.width=clamp(el/15*100,0,100)+'%';drawWave(wave,disp,150,col);if(el>=15){stopAll();try{navigator.vibrate&&navigator.vibrate(150)}catch(e){}done()}},100);
    function done(){
      go.disabled=false;go.textContent='أعد الاختبار';
      if(ts.length<100){out.innerHTML=`<div class="banner warn">${ic('alert')}<div><b>بيانات غير كافية</b><p>${NO_SENSOR()}</p></div></div>`;return}
      const fs=50,ax=[X,Y,Z].map(ch=>{const r=resample(ts.map(t=>t),ch,fs).slice(fs);const m=movAvg(r,25);return r.map((v,i)=>v-m[i])});
      const n=ax[0].length;let ss=0;for(let i=0;i<n;i++)ss+=ax[0][i]**2+ax[1][i]**2+ax[2][i]**2;const rms=Math.sqrt(ss/n);
      let bestF=0,bestP=0;for(let f=3;f<=14;f+=0.25){let p=0;for(const s of ax){let re=0,im=0;for(let i=0;i<n;i++){const w=2*Math.PI*f*i/fs;re+=s[i]*Math.cos(w);im-=s[i]*Math.sin(w)}p+=re*re+im*im}if(p>bestP){bestP=p;bestF=f}}
      const c=cTremor(rms),hand=($('input[name="tr-h"]:checked',b)||{}).value||'R';$('#trN',b).textContent=rms.toFixed(2);st.textContent='';
      out.innerHTML=`<div class="sheet-b">${resultHTML(c,rms.toFixed(2),'م/ث²',`<p class="small muted">التردد السائد: <bdi>${bestF.toFixed(1)}</bdi> هرتز. النتيجة للمقارنة مع نفسك عبر الوقت، وليست تشخيصاً.</p>`)}<button class="btn" type="button" id="trSave">احفظ في السجل</button></div>`;
      $('#trSave',out).onclick=ev=>{addReading('tremor',{rms:+rms.toFixed(3),hz:+bestF.toFixed(1),hand});ev.target.disabled=true;ev.target.textContent='حُفظت';toast('حُفظت النتيجة')};
    }
  };
  return()=>{live=false;stopAll()};
}

/* ---------- test: reaction ---------- */
function testReact(b){
  b.innerHTML=`<p class="hint" style="margin:0">حين يتحول المربع إلى الأخضر المسه بأسرع ما يمكن. خمس محاولات.</p><button type="button" class="pad" id="rxPad">المس للبدء</button><div class="row" id="rxTimes"></div><div id="rxOut"></div>`;

  function arm(){set('wait','انتظر اللون الأخضر…');to=setTimeout(()=>{tGo=performance.now();set('go','المس الآن!')},1500+Math.random()*2500)}

      if(res.length<5){set('shown',ms+' ملي ثانية · المس للمحاولة التالية')}
      else{state='done';const avg=Math.round(res.reduce((a,x)=>a+x,0)/res.length),best=Math.min(...res),c=cReact(avg);pad.className='pad';pad.textContent='انتهى الاختبار';
        out.innerHTML=`<div class="sheet-b">${resultHTML(c,avg,'ملي ثانية',`<p class="small muted">أفضل محاولة: <bdi>${best}</bdi> ملي ثانية.</p>`)}<div class="row"><button class="btn" type="button" id="rxSave">احفظ في السجل</button><button class="btn ghost" type="button" id="rxRe">أعد</button></div></div>`;
        $('#rxSave',out).onclick=ev=>{addReading('react',{ms:avg,best});ev.target.disabled=true;ev.target.textContent='حُفظت';toast('حُفظت النتيجة')};
        $('#rxRe',out).onclick=()=>{res=[];times.innerHTML='';out.innerHTML='';set('idle','المس للبدء')}}}
  });
  return()=>clearTimeout(to);
}

/* ---------- test: visual acuity (tumbling E) ---------- */
function testAcuity(b){
  const SN=[200,100,70,50,40,30,25,20],DIST=400,mm20=DIST*Math.tan(5/60*Math.PI/180);
  let eye='R',lvl=0,trial=0,ok=0,wrong=0,dir=0,passed=null,results={};
  function intro(){
    b.innerHTML=`${P().pxmm?'':`<div class="banner info">${ic('ruler')}<div><b>عايِر الشاشة أولاً</b><p>لتكون أحجام الحروف دقيقة على هاتفك.</p><div class="row" style="margin-top:8px"><button class="btn sm" type="button" id="acCal">عايِر الآن</button></div></div></div>`}
    <ol class="steps"><li>امسك الهاتف على بُعد 40 سم من عينيك (تقريباً المسافة من المرفق إلى أطراف الأصابع).</li><li>إذا كنت تلبس نظارة للقراءة أو للبعيد فالبسها.</li><li>غطِّ عينك ${eye==='R'?'اليسرى':'اليمنى'} بكفّك دون ضغط، واختبر العين ${EYE[eye]}.</li><li>اضغط السهم الذي يشير إلى اتجاه فتحة الحرف E.</li></ol>
    <button class="btn block" type="button" id="acGo">${ic('eye')}ابدأ بالعين ${EYE[eye]}</button>`;
    const cal=$('#acCal',b);if(cal)cal.onclick=()=>{b.innerHTML=calibHTML();mountCalib(b,intro)};
    $('#acGo',b).onclick=()=>{lvl=0;trial=0;ok=0;wrong=0;passed=null;stage();next()};
  }
  function stage(){
    b.innerHTML=`<div class="stage"><div class="status" id="acSt"></div><div class="eye-box"><canvas id="acCv" width="200" height="200"></canvas></div>
    <div class="arrows"><button type="button" class="u" data-d="3" aria-label="أعلى">${ic('arrowU')}</button><button type="button" class="l" data-d="2" aria-label="يسار">${ic('arrowL')}</button><button type="button" class="n" data-d="-1">لا أراه</button><button type="button" class="r" data-d="0" aria-label="يمين">${ic('arrowR')}</button><button type="button" class="d" data-d="1" aria-label="أسفل">${ic('arrowD')}</button></div></div>`;
    $$('.arrows button',b).forEach(x=>x.onclick=()=>answer(+x.dataset.d));
  }
  function drawE(){
    const cv=$('#acCv',b),dpr=window.devicePixelRatio||1;cv.width=Math.round(200*dpr);cv.height=Math.round(200*dpr);
    const c=cv.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,cv.width,cv.height);
    const hpx=mm20*(SN[lvl]/20)*pxmm()*dpr,u=Math.max(1,Math.round(hpx/5)),s=u*5;
    c.save();c.translate(Math.round(cv.width/2),Math.round(cv.height/2));c.rotate(dir*Math.PI/2);c.translate(-s/2,-s/2);c.fillStyle='#000';
    c.fillRect(0,0,u,s);c.fillRect(0,0,s,u);c.fillRect(0,2*u,s,u);c.fillRect(0,4*u,s,u);c.restore();
    $('#acSt',b).textContent=`العين ${EYE[eye]} · المستوى ${lvl+1} من ${SN.length} · المحاولة ${trial+1} من 4`;
  }
  function next(){dir=Math.floor(Math.random()*4);drawE()}
  function answer(d){
    if(d===dir)ok++;else wrong++;trial++;
    if(ok>=3||wrong>=2||trial>=4){
      if(ok>=3){passed=SN[lvl];lvl++;if(lvl>=SN.length)return finishEye()}else return finishEye();
      trial=0;ok=0;wrong=0}
    next();
  }
  function finishEye(){
    const d=passed||400;results[eye]=d;addReading('vision',{eye,d});
    if(eye==='R'){eye='L';b.innerHTML=`${resultHTML(cVision(d),snel(d),'العين اليمنى · '+snelM(d))}<button class="btn block" type="button" id="acNext">الآن العين اليسرى</button>`;$('#acNext',b).onclick=intro;return}
    const worst=Math.max(results.R||400,results.L||400);
    b.innerHTML=`<div class="grid2">${resultHTML(cVision(results.R),snel(results.R),'العين اليمنى · '+snelM(results.R))}${resultHTML(cVision(results.L),snel(results.L),'العين اليسرى · '+snelM(results.L))}</div>
    <p class="hint">حُفظت النتائج في سجلك. ${Math.abs(SN.indexOf(results.R)-SN.indexOf(results.L))>=2?'يوجد فرق واضح بين العينين؛ يُنصح بفحص النظر.':''}${worst>30?' يُنصح بفحص النظر لدى أخصائي البصريات.':''} هذا فحص للرؤية القريبة ولا يغني عن فحص العيادة.</p><button class="btn block" type="button" data-act="close">تم</button>`;
  }
  intro();
}

/* ---------- test: color plates ---------- */
function lumOf(r,g,b){const f=c=>{c/=255;return c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4)};return 0.2126*f(r)+0.7152*f(g)+0.0722*f(b)}
function hsl(h,s,l){const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return [255*f(0),255*f(8),255*f(4)].map(Math.round)}
function atLum(h,s,Y){let lo=0,hi=1;for(let i=0;i<16;i++){const m=(lo+hi)/2,[r,g,b]=hsl(h,s,m);if(lumOf(r,g,b)<Y)lo=m;else hi=m}const [r,g,b]=hsl(h,s,(lo+hi)/2);return `rgb(${r},${g},${b})`}
function drawPlate(cv,digit,kind,sat){
  const S0=260,dpr=window.devicePixelRatio||1;cv.width=S0*dpr;cv.height=S0*dpr;const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);
  const m=document.createElement('canvas');m.width=S0;m.height=S0;const mc=m.getContext('2d');mc.fillStyle='#000';mc.font=`700 ${S0*0.6}px Arial,Helvetica,sans-serif`;mc.textAlign='center';mc.textBaseline='middle';mc.fillText(String(digit),S0/2,S0/2+S0*0.03);
  const md=mc.getImageData(0,0,S0,S0).data,R0=S0/2-3,cell=18,grid=new Map(),dots=[];
  const key=(x,y)=>((x/cell)|0)+','+((y/cell)|0);
  for(let a=0;a<12000&&dots.length<1700;a++){
    const r=2.2+Math.pow(Math.random(),1.8)*6.4,ang=Math.random()*Math.PI*2,rad=Math.sqrt(Math.random())*(R0-r),x=S0/2+Math.cos(ang)*rad,y=S0/2+Math.sin(ang)*rad;
    let okk=true;const gx=(x/cell)|0,gy=(y/cell)|0;
    for(let i=-1;i<=1&&okk;i++)for(let j=-1;j<=1&&okk;j++){const arr=grid.get((gx+i)+','+(gy+j));if(arr)for(const d of arr){if(Math.hypot(d[0]-x,d[1]-y)<d[2]+r+0.9){okk=false;break}}}
    if(!okk)continue;const d=[x,y,r];dots.push(d);const k=key(x,y);if(!grid.has(k))grid.set(k,[]);grid.get(k).push(d);
  }
  for(const [x,y,r] of dots){
    const inside=md[((y|0)*S0+(x|0))*4+3]>100;let col;
    if(kind==='ctrl')col=inside?atLum(210,0.18,0.07+Math.random()*0.06):atLum(36,0.28,0.42+Math.random()*0.18);
    else col=inside?atLum(8+Math.random()*20,(0.62+Math.random()*0.12)*sat,0.2+Math.random()*0.14):atLum(68+Math.random()*30,(0.42+Math.random()*0.14)*sat,0.2+Math.random()*0.14);

  }
}
function testColor(b){

  plates.forEach(p=>p.d=pool[Math.floor(Math.random()*pool.length)]);let i=0,score=0,ctrlOk=true;
  function intro(){b.innerHTML=`<ol class="steps"><li>ارفع سطوع الشاشة إلى الحد الأقصى.</li><li>أوقف الوضع الليلي (Night Shift) والوضع الداكن للألوان ومرشحات الألوان.</li><li>اختر الرقم الذي تراه داخل الدائرة، أو «لا أرى رقماً».</li></ol><button class="btn block" type="button" id="clGo">${ic('palette')}ابدأ</button>`;$('#clGo',b).onclick=show}

    const of=plates.length-1;addReading('color',{score,of});

  for(let a=0;a<180;a+=15){const r=a*Math.PI/180,dx=Math.cos(r)*88,dy=Math.sin(r)*88;s+=`<line x1="${(110-dx).toFixed(1)}" y1="${(110-dy).toFixed(1)}" x2="${(110+dx).toFixed(1)}" y2="${(110+dy).toFixed(1)}" stroke="#111" stroke-width="2.4" stroke-linecap="round"/>`}
  for(let h=1;h<=12;h++){const r=(h*30-90)*Math.PI/180;s+=`<text x="${(110+Math.cos(r)*101).toFixed(1)}" y="${(110+Math.sin(r)*101+4).toFixed(1)}" text-anchor="middle" font-size="11" font-family="Arial" fill="#111">${h}</text>`}
  return s+'<circle cx="110" cy="110" r="10" fill="#fff"/></svg>'}
function testGrid(b,kind){

  const Q=isA?['هل كل الخطوط مستقيمة ومتوازية دون انحناء أو تموّج؟','هل تظهر كل المربعات بوضوح دون مناطق مفقودة أو ضبابية أو داكنة؟']:['هل تبدو كل الخطوط بنفس السواد والوضوح؟'];
  function step(){
    b.innerHTML=`<div class="sheet-b" id="gW"><p style="margin:0">${isA?'امسك الهاتف على بُعد 30 سم، والبس نظارة القراءة إن كنت تستخدمها.':'امسك الهاتف على بُعد 40 سم دون نظارة إن أمكن.'} غطِّ العين ${eye==='R'?'اليسرى':'اليمنى'} وانظر بالعين <b>${EYE[eye]}</b> ${isA?'إلى النقطة في المركز دون أن تحرك نظرك.':'إلى مركز اللوحة.'}</p>
    <div class="stage"><div class="whitecard">${isA?amslerSVG():astigSVG()}</div></div>
    ${Q.map((q,i)=>`<div class="field"><span class="lbl" style="color:var(--ink);font-size:14.5px">${q}</span><div class="seg"><label><input type="radio" id="gq${i}y" name="gq${i}" value="1"><span>نعم</span></label><label><input type="radio" id="gq${i}n" name="gq${i}" value="0"><span>لا</span></label></div></div>`).join('')}

    const w=$('#gW',b),btn=$('#gNext',b);

  }
  function done(){
    const card=e=>{const c=M.cls({ok:res[e],eye:e});return `<div class="result ${c.lv}"><span class="small muted">العين ${EYE[e]}</span><div class="r-top"><span class="chip ${c.lv}">${LVN[c.lv]}</span><b>${esc(c.t)}</b></div><p>${esc(c.a)}</p></div>`};
    b.innerHTML=`<div class="grid2">${card('R')}${card('L')}</div>
    <p class="hint">${isA?'إذا ظهر لك تشوّه جديد في الخطوط فراجع طبيب العيون خلال أيام، وفي اليوم نفسه إن ظهر فجأة. كرر هذا الفحص أسبوعياً إذا كنت فوق الخمسين أو مصاباً بالسكري.':'اللابؤرية شائعة وتُصحَّح بالنظارة أو العدسات.'} حُفظت النتائج في سجلك.</p><button class="btn block" type="button" data-act="close">تم</button>`;

/* ---------- test: hearing ---------- */
function hearCls(v){return v.flags&&v.flags.length?C('warn','يحتاج متابعة',v.flags.join(' · ')+'. اختبار مقارن غير معاير؛ يُنصح بتخطيط السمع لدى أخصائي.'):C('ok','سمع متوازن','لم يظهر فرق واضح بين الأذنين أو انخفاض عند ترددات معينة. اختبار مقارن غير معاير.')}
function audiogram(v){
  const F=[500,1000,2000,4000,8000],W=320,H=190,L=34,R=14,T=14,B=26,X=i=>L+(W-L-R)*i/(F.length-1),Y=r=>T+(H-T-B)*clamp(r,0,80)/80;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="مخطط السمع">`;
  for(let r=0;r<=80;r+=20)s+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${Y(r)}" y2="${Y(r)}"/><text class="tk" x="${L-6}" y="${Y(r)+3.5}" text-anchor="end">${r}</text>`;
  F.forEach((f,i)=>s+=`<text class="tk" x="${X(i)}" y="${H-7}" text-anchor="middle">${f>=1000?f/1000+'k':f}</text>`);
  for(const [e,col] of [['R','var(--bad)'],['L','var(--info)']]){const pts=F.map((f,i)=>[X(i),Y(v[e]&&v[e][f]!=null?v[e][f]:80)]);
    s+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${col}" stroke-width="1.8"/>`;
    pts.forEach(([x,y])=>{s+=e==='R'?`<circle cx="${x}" cy="${y}" r="5" fill="var(--surface)" stroke="${col}" stroke-width="2"/>`:`<path d="M${x-4.5} ${y-4.5}l9 9M${x+4.5} ${y-4.5}l-9 9" stroke="${col}" stroke-width="2.2" stroke-linecap="round"/>`})}
  return s+'</svg>';
}
function testHear(b){
  const F=[1000,2000,4000,8000,500],LV=[-80,-70,-60,-50,-40,-30,-20,-10];let ctx=null,live=true,heardFlag=false,toneOn=0;
  b.innerHTML=`<ol class="steps"><li>البس سماعات الأذن (السلكية أفضل) في مكان هادئ.</li><li>اضبط صوت الهاتف على 50% واترك هذا المستوى ثابتاً في كل مرة تختبر فيها لتقارن النتائج.</li><li>ستسمع نغمات تتصاعد تدريجياً في كل أذن. اضغط «أسمعها» فور سماع أي نغمة ولو كانت خافتة جداً.</li></ol>
  <button class="btn block" type="button" id="hGo">${ic('ear')}ابدأ الاختبار (دقيقتان تقريباً)</button>`;
  $('#hGo',b).onclick=run;
  function tone(f,db,ear){const t=ctx.currentTime+0.02,o=ctx.createOscillator(),g=ctx.createGain(),m=ctx.createChannelMerger(2),a=Math.pow(10,db/20);
    o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(a,t+0.06);g.gain.setValueAtTime(a,t+0.85);g.gain.linearRampToValueAtTime(0,t+0.95);
    o.connect(g);g.connect(m,0,ear==='L'?0:1);m.connect(ctx.destination);o.start(t);o.stop(t+1)}
  function wait(ms){return new Promise(res=>{const t0=performance.now();const iv=setInterval(()=>{if(!live||heardFlag||performance.now()-t0>ms){clearInterval(iv);res()}},40)})}
  async function run(){
    try{ctx=new (window.AudioContext||window.webkitAudioContext)();await ctx.resume()}catch(e){b.innerHTML=`<div class="banner warn">${ic('alert')}<div><b>الصوت غير متاح</b><p>لم نتمكن من تشغيل الصوت على هذا الجهاز.</p></div></div>`;return}
    b.innerHTML=`<div class="stage"><div class="status" id="hSt"></div><div class="prog"><i id="hProg"></i></div><button type="button" class="pad" id="hPad" style="min-height:200px">أسمعها</button></div><button class="btn ghost block" type="button" data-act="close">إيقاف</button>`;
    const st=$('#hSt',b),pad=$('#hPad',b),prog=$('#hProg',b);
    pad.addEventListener('pointerdown',e=>{e.preventDefault();if(performance.now()-toneOn<2600){heardFlag=true;pad.classList.add('go');setTimeout(()=>pad.classList.remove('go'),220)}});
    const res={R:{},L:{}};let done=0;
    for(const ear of ['R','L'])for(const f of F){
      let th=null;
      for(const lv of LV){if(!live)return;st.textContent=`الأذن ${EYE[ear]} · ${f} هرتز`;heardFlag=false;await sleep(500+Math.random()*900);if(!live)return;
        toneOn=performance.now();tone(f,lv,ear);await wait(1900);if(heardFlag){th=lv;await sleep(350);break}}
      res[ear][f]=th==null?80:th+80;done++;prog.style.width=(done/(F.length*2)*100)+'%';
    }
    try{ctx.close()}catch(e){}
    const Fs=[500,1000,2000,4000,8000],all=Fs.flatMap(f=>[res.R[f],res.L[f]]),best=Math.min(...all),flags=[];
    const asym=Fs.filter(f=>Math.abs(res.R[f]-res.L[f])>=20);if(asym.length>=2)flags.push('فرق واضح بين الأذنين');
    const drop=Fs.filter(f=>Math.min(res.R[f],res.L[f])-best>=30);if(drop.length)flags.push('انخفاض عند '+drop.map(f=>f>=1000?f/1000+' كيلوهرتز':f+' هرتز').join(' و'));
    if(Fs.some(f=>res.R[f]>=80||res.L[f]>=80))flags.push('نغمات لم تُسمع');
    const v={R:res.R,L:res.L,flags};addReading('hear',v);
    b.innerHTML=`${resultHTML(hearCls(v),null,'')}<div class="chart">${audiogram(v)}</div><div class="legend"><span><i style="background:var(--bad)"></i>الأذن اليمنى (O)</span><span><i style="background:var(--info)"></i>الأذن اليسرى (X)</span><span>الأعلى في المخطط = سمع أفضل</span></div>
    <p class="hint">ضعف السمع المفاجئ في أذن واحدة حالة عاجلة تستدعي مراجعة طبيب الأنف والأذن خلال 24–48 ساعة.</p><button class="btn block" type="button" data-act="close">تم</button>`;
  }
  return()=>{live=false;try{ctx&&ctx.close()}catch(e){}};
}

/* ---------- symptom checker ---------- */
function sheetSym(id){
  const s=SYM.find(x=>x.id===id);if(!s)return;
  const ck=(arr,pre,em)=>arr.map((t,i)=>`<label class="ck ${em?'em':''}"><input type="checkbox" name="${pre}" value="${i}"><span>${t}</span></label>`).join('');
  openSheet(s.n,`<form id="sF" class="sheet-b"><div><h3 class="sec" style="margin:0 0 8px;font-size:15px">علامات خطر: هل لديك أيٌّ منها؟</h3><div class="checks">${ck(s.em,'em',1)}</div></div>
  <div><h3 class="sec" style="margin:0 0 8px;font-size:15px">وهل ينطبق عليك أيٌّ مما يلي؟</h3><div class="checks">${ck(s.ur,'ur')}</div></div>
  <div><h3 class="sec" style="margin:0 0 8px;font-size:15px">عنك</h3><div class="checks">${ck(MODS,'md')}</div></div>
  <button class="btn block" type="submit">اعرض التوصية</button></form><div id="sOut"></div>`,b=>{
    const f=$('#sF',b);f.onsubmit=e=>{e.preventDefault();
      const got=n=>$$(`input[name="${n}"]:checked`,f).map(x=>+x.value),em=got('em'),ur=got('ur'),md=got('md');
      let lv,h,p;
      if(em.length){lv='bad';h='اتصل بالإسعاف الآن';p='ما ذكرته من علامات الخطر يحتاج تقييماً طبياً فورياً. لا تقُد السيارة بنفسك، وابقَ مع شخص حتى تصل المساعدة.'}
      else if(ur.length){lv='warn';h='راجع طبيباً أو قسم الطوارئ اليوم';p='الأعراض التي اخترتها تستحق فحصاً طبياً خلال 24 ساعة. إذا ظهرت أي علامة خطر قبل ذلك فاتصل بالإسعاف.'}
      else if(md.length){lv='info';h='احجز موعداً مع طبيب خلال أيام';p='لا توجد علامات خطر، لكن وضعك الصحي يجعل تقييم الطبيب أفضل. '+s.self}
      else{lv='ok';h='يمكنك العناية بنفسك في المنزل';p=s.self}
      const chosen=[...em.map(i=>s.em[i]),...ur.map(i=>s.ur[i]),...md.map(i=>MODS[i])];
      $('#sOut',b).innerHTML=`<div class="sheet-b"><div class="triage ${lv}"><h3>${h}</h3><p>${esc(p)}</p>${lv==='bad'?`<div class="callnum"><bdi>${esc(emNum())}</bdi></div><div class="row"><a class="btn danger" href="tel:${esc(emNum())}">${ic('phone')}اتصل بالإسعاف</a><button class="btn ghost" type="button" data-act="copy" data-txt="${esc(emNum())}">انسخ الرقم</button></div>`:''}${lv!=='bad'?`<p class="small muted">عُد للتقييم إذا ساءت الأعراض أو ظهرت أي علامة خطر.</p>`:''}</div>
      ${aiVisible()&&lv!=='bad'?`<button class="btn soft block" type="button" id="sAi">${ic('chat')}ناقش حالتك مع طبيب أفينا</button>`:''}<p class="foot">هذه أداة فرز إرشادية مبنية على علامات الخطر الشائعة، ولا تشخّص الحالة.</p></div>`;
      const ai=$('#sAi',b);if(ai)ai.onclick=()=>sheetChat(`أعاني من: ${s.n}.${chosen.length?' وينطبق عليّ: '+chosen.join('، ')+'.':' ولا توجد لديّ علامات الخطر المذكورة.'} ماذا تنصحني؟`);
      $('#sOut',b).scrollIntoView({behavior:'smooth',block:'start'});
    };
  });
}

/* ---------- AI: shared ---------- */
let aiTier='default';
async function callAI(input,o,json){
  const run=t=>json?aiSample.json(input,{...o,modelTier:t}):aiSample(input,{...o,modelTier:t});
  try{return await run(aiTier)}catch(e){if(e&&e.code==='invalid_request'&&aiTier!=='default'){aiTier='default';return await run('default')}throw e}
}
function aiErr(e){const c=e&&e.code;
  if(c==='limit')return `وصلت إلى حد أسئلتك اليوم${e.limit?' ('+e.limit+')':''}. ${CAN_BUY?'يتجدد الحد غداً، أو اشترك لتحصل على أسئلة أكثر.':'يتجدد الحد غداً.'}`;
  if(c==='upgrade')return !CAN_BUY?'هذه الميزة غير متاحة في خطتك.':e.need==='ultra'?'هذه الميزة متاحة لمشتركي ألترا.':'هذه الميزة متاحة لمشتركي برو وألترا.';
  if(c==='auth')return 'سجّل الدخول لتستخدم الطبيب الذكي.';
  if(c==='network')return 'تعذّر الاتصال بالإنترنت. تحقق من اتصالك ثم أعد المحاولة.';
  if(c==='ai_failed'||c==='server')return 'تعذّر إنشاء الإجابة الآن. حاول مرة أخرى بعد قليل.';
  return c==='not_granted'?'لم يُسمح باستخدام Claude لهذه الصفحة. يمكنك السماح من قائمة الأذونات ثم المحاولة مجدداً.':c==='rate_limited'?'طلبات كثيرة الآن. انتظر قليلاً ثم أعد المحاولة.':c==='invalid_json'?'جاء الرد ناقصاً. أعد المحاولة.':c==='cancelled'?'أُوقف الطلب.':'تعذّر الحصول على إجابة الآن. حاول مرة أخرى.'}

  const o={title:str(a.title),en:str(a.en),kind:str(a.kind),summary:str(a.summary),personal:str(a.personal),uncertain:str(a.uncertain),
    confidence:['high','medium','low'].includes(a.confidence)?a.confidence:'medium',urgent:arr(a.urgent),refs:arr(a.refs),
    sections:(Array.isArray(a.sections)?a.sections:[]).map(x=>({h:str(x&&x.h),points:arr(x&&x.points)})).filter(x=>x.h&&x.points.length)};

function sheetArticle(topic,force){
  topic=String(topic||'').replace(/\s+/g,' ').trim().slice(0,120);if(!topic)return;

  const cached=!force&&artCache()[(EN?'en:':'')+topic];
  openSheet(topic,`<div id="artBody"></div>`,b=>{
    const body=$('#artBody',b);
    if(cached){renderArt(body,topic,cached.a);artPut(topic,cached.a);return}
    let live=true;const t0=Date.now(),ctl=new AbortController();
    body.innerHTML=`<div class="loading"><div class="spin"></div><b>يُكتب مدخل «${esc(topic)}»</b><span class="hint" id="artT" style="margin:0">يراجع المعلومات بعناية قبل الكتابة، وقد يستغرق ذلك حتى دقيقة.</span><button class="btn ghost sm" type="button" id="artStop">إيقاف</button></div>`;
    const iv=setInterval(()=>{const el=$('#artT',b);if(el)el.textContent='يفكّر بعمق قبل الكتابة… '+Math.round((Date.now()-t0)/1000)+' ث'},1000);
    $('#artStop',b).onclick=()=>ctl.abort();
    aiArticle(topic,{signal:ctl.signal}).then(r=>{clearInterval(iv);if(!live)return;const a=cleanArt(r.article);if(a&&r.verify)a.ver=normVer(r.verify);if(a&&r.reviewed)a.reviewed=true;if(cloud.session)refreshStatus();
        if(!a){body.innerHTML=`<p class="err">جاء الرد ناقصاً. أعد المحاولة.</p><button class="btn" type="button" id="artAgain">أعد المحاولة</button>`;$('#artAgain',body).onclick=()=>sheetArticle(topic,true);return}
        if(a.kind!=='off_topic')artPut(topic,a);renderArt(body,topic,a)})
      .catch(e=>{clearInterval(iv);if(!live)return;body.innerHTML=`<div class="banner warn">${ic('alert')}<div><b>${e&&(e.code==='upgrade'||e.code==='limit')?'هذا المدخل غير متاح الآن':'لم يكتمل المدخل'}</b><p>${esc(aiErr(e))}</p>${upsell(e)}</div></div><button class="btn" type="button" id="artAgain">أعد المحاولة</button>`;$('#artAgain',body).onclick=()=>sheetArticle(topic,true)});
    return()=>{live=false;clearInterval(iv);ctl.abort()};
  });
}

    const pend=await ln.getPending();if(pend.notifications.length)await ln.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});
    const list=[];let id=1;
    for(const q of people())for(const m of q.meds){if(!m.on)continue;for(const t of (m.times||[])){const [h,mi]=t.split(':').map(Number);if(isNaN(h)||isNaN(mi))continue;
      list.push({id:id++,title:trText('موعد الدواء: ')+m.name+(q===S._me?'':' · '+personName(q)),body:(m.dose?m.dose+' · ':'')+t,schedule:{on:{hour:h,minute:mi},allowWhileIdle:true}})}}
    if(list.length)await ln.schedule({notifications:list.slice(0,60)})}catch(e){}}
function queueReminders(){try{if(!LN())return;clearTimeout(_remT);_remT=setTimeout(syncNativeReminders,1200)}catch(e){}}
if(LN())syncNativeReminders().then(()=>{if(view==='me')render()});
const notified=new Set();
setInterval(()=>{
  const now=new Date(),hm=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  for(const q of people()){const log=q.medLog[dayKey()]||{},who=q===curPerson()?'':' · '+personName(q);for(const m of q.meds){if(!m.on||!(m.times||[]).includes(hm))continue;const key=dayKey()+m.id+hm;if(notified.has(key)||log[m.id+'@'+hm])continue;notified.add(key);
    toast('حان موعد '+m.name+(m.dose?' · '+m.dose:'')+who);
    if(!IN_VIEWER&&!LN()&&'Notification' in window&&Notification.permission==='granted'){const opt={body:(m.dose||'')+' — الساعة '+hm,icon:'icon-192.png',tag:key};
      if(navigator.serviceWorker&&navigator.serviceWorker.controller)navigator.serviceWorker.ready.then(r=>r.showNotification('موعد الدواء: '+m.name+who,opt)).catch(()=>{});else try{new Notification('موعد الدواء: '+m.name+who,opt)}catch(e){}}
    if(view==='home'&&$('#sheetBg').hidden)render();
  }}
},20000);

/* ---------- boot ---------- */
view=VIEWS[location.hash.slice(1)]?location.hash.slice(1):'home';
render();
connectRemote();
cloudInit();
{const ll=document.getElementById('langLbl');if(ll)ll.textContent=EN?'ع':'EN';}
if(IN_VIEWER){claude.use('sample').then(async s=>{if(!s)return;aiSample=s;try{const l=await s.limits();const t=l&&l.modelTiers;aiTier=(!t||t.includes('complex'))?'complex':'default'}catch(e){}if($('#sheetBg').hidden)render()}).catch(()=>{})}
if(!IN_VIEWER&&'serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
})();
</script>
