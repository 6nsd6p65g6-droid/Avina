<!DOCTYPE html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a6a6e">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<!--APP:START-->
<title>عيادة الجيب</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a dark bedside-monitor panel opens Home; clinical panels stack in one column below; a fixed tab bar sits at the bottom. */
:root{
  --bg:#edf2f1;--surface:#ffffff;--surface-2:#f4f8f7;--ink:#10302e;--muted:#557170;--line:#d3e0dd;
  --accent:#0a6a6e;--accent-ink:#ffffff;--accent-soft:#d6ebeb;
  --pulse:#cf3653;--pulse-grid:rgba(207,54,83,.10);
  --ok:#1b7a44;--ok-soft:#dcf0e2;--warn:#8f5400;--warn-soft:#fbebd0;--bad:#bb2232;--bad-soft:#f8dadd;--on-bad:#ffffff;--info:#2c5ba5;--info-soft:#dfe8f7;
  --mon:#0e2523;--mon-2:#13302d;--mon-ink:#e0f5f0;--mon-dim:#8bb4ad;--mon-line:#3fd6b2;--mon-grid:rgba(63,214,178,.075);
  --mon-ok:#3fd6b2;--mon-warn:#f2b45a;--mon-bad:#ff6b7a;
  --shadow:0 1px 2px rgba(16,48,46,.05),0 8px 22px rgba(16,48,46,.06);
  --scrim:rgba(4,18,17,.5);
  --f-display:"Alexandria","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1514;--surface:#11201f;--surface-2:#162826;--ink:#e2efec;--muted:#8ea9a5;--line:#24403c;
  --accent:#4cc3bd;--accent-ink:#04201f;--accent-soft:#143836;
  --pulse:#ff6e86;--pulse-grid:rgba(255,110,134,.10);
  --ok:#5fd08d;--ok-soft:#14321f;--warn:#f2b45a;--warn-soft:#382a10;--bad:#ff7d86;--bad-soft:#3d191c;--on-bad:#2a0508;--info:#8ab0f2;--info-soft:#18284a;
  --mon:#071211;--mon-2:#0d1e1c;--shadow:none;--scrim:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1514;--surface:#11201f;--surface-2:#162826;--ink:#e2efec;--muted:#8ea9a5;--line:#24403c;
  --accent:#4cc3bd;--accent-ink:#04201f;--accent-soft:#143836;
  --pulse:#ff6e86;--pulse-grid:rgba(255,110,134,.10);
  --ok:#5fd08d;--ok-soft:#14321f;--warn:#f2b45a;--warn-soft:#382a10;--bad:#ff7d86;--bad-soft:#3d191c;--on-bad:#2a0508;--info:#8ab0f2;--info-soft:#18284a;
  --mon:#071211;--mon-2:#0d1e1c;--shadow:none;--scrim:rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
.eyebrow{font-size:12px;color:var(--muted)}
.ai-card{display:flex;gap:14px;align-items:flex-start}
.aic{width:44px;height:44px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.aic svg{width:24px;height:24px}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.7 var(--f-body);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
bdi,.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{padding-block:12px 6px}
.top-row{display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:40px;height:40px;flex:none}
.brand b{font:700 18px/1.25 var(--f-display);display:block}
.brand small{color:var(--muted);font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sos{margin-inline-start:auto;flex:none;background:var(--bad);color:var(--on-bad);border:0;border-radius:999px;padding:8px 14px;font:700 14px/1 var(--f-display);display:inline-flex;gap:6px;align-items:center}
.sos svg{width:18px;height:18px}
main{padding-block:6px calc(104px + env(safe-area-inset-bottom,0px))}
.stack{display:grid;gap:14px}
.sec{font:700 16px/1.4 var(--f-display);margin:12px 0 -2px;text-wrap:balance}
.sec small{font:400 12.5px var(--f-body);color:var(--muted);margin-inline-start:6px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);min-width:0}
.panel h3{font:700 15px/1.4 var(--f-display);margin:0 0 8px}
.muted{color:var(--muted)}.small{font-size:13px}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0;line-height:1.65}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
/* monitor */
.monitor{background-color:var(--mon);color:var(--mon-ink);border-radius:22px;padding:14px;position:relative;overflow:hidden;
  background-image:linear-gradient(var(--mon-grid) 1px,transparent 1px),linear-gradient(90deg,var(--mon-grid) 1px,transparent 1px);background-size:13px 13px}
.mon-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--mon-dim)}
.mon-head b{font:600 13px var(--f-display);color:var(--mon-ink)}
.live{display:inline-flex;align-items:center;gap:6px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--mon-line);box-shadow:0 0 0 3px rgba(63,214,178,.18);animation:blink var(--beat,1s) ease-out infinite}
@keyframes blink{0%{opacity:1}60%{opacity:.25}100%{opacity:1}}
.ecg{display:block;width:100%;height:46px;margin:4px 0 10px}
.ecg .base{fill:none;stroke:var(--mon-line);stroke-opacity:.22;stroke-width:1.4;stroke-linejoin:round}
.ecg .sweep{fill:none;stroke:var(--mon-line);stroke-width:1.9;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:14 86;animation:sweep var(--sweep,5s) linear infinite}
@keyframes sweep{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
.vitals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.vital{background:var(--mon-2);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:9px 10px 8px;text-align:start;color:inherit;display:grid;gap:1px;min-width:0}
.vital:hover{border-color:rgba(63,214,178,.35)}
.vital .lb{font-size:11.5px;color:var(--mon-dim);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}
.vital .val{font:600 21px/1.25 var(--f-num);color:var(--mon-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vital .un{font-size:11px;color:var(--mon-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--mon-dim);opacity:.6}
.dot.ok{background:var(--mon-ok);opacity:1}.dot.warn{background:var(--mon-warn);opacity:1}.dot.bad{background:var(--mon-bad);opacity:1}.dot.info{background:#8ab0f2;opacity:1}
@media (max-width:360px){.vital .val{font-size:18px}}
/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 10px;font-size:12.5px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.info{background:var(--info-soft);color:var(--info);border-color:transparent}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:12px;padding:10px 16px;font:600 15px/1.25 var(--f-body);background:var(--accent);color:var(--accent-ink);text-decoration:none}
.btn svg{width:18px;height:18px;flex:none}
.btn.ghost{background:transparent;color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:var(--bad);color:var(--on-bad)}
.btn.sm{padding:6px 12px;font-size:13.5px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.linkish{background:none;border:0;color:var(--accent);font-weight:600;padding:0}
/* quick actions */
.hero-act{display:flex;align-items:center;gap:14px;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);color:var(--ink)}
.hero-act .hic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--pulse-grid);color:var(--pulse)}
.hero-act .hic svg{width:28px;height:28px}
.hero-act b{font:700 16px/1.35 var(--f-display);display:block}
.hero-act span{font-size:13px;color:var(--muted)}
.hero-act .go{margin-inline-start:auto;color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.qa{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 8px;display:grid;justify-items:center;gap:6px;text-align:center;font-size:13px;font-weight:600;color:var(--ink);box-shadow:var(--shadow)}
.qa svg{width:24px;height:24px;color:var(--accent)}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,152px),1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:start;display:flex;flex-direction:column;gap:5px;color:var(--ink);box-shadow:var(--shadow);min-width:0}
.tile .ic{width:36px;height:36px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.tile .ic svg{width:21px;height:21px}
.tile .ic.p{background:var(--pulse-grid);color:var(--pulse)}
.tile b{font:600 14.5px/1.35 var(--f-display)}
.tile .d{font-size:12.3px;color:var(--muted);line-height:1.55}
.tile .ft{margin-top:auto;padding-top:4px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:11.5px;color:var(--muted)}
.need{font-size:11px;border:1px dashed var(--line);border-radius:999px;padding:0 8px;color:var(--muted)}
/* banners */
.banner{border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.banner svg{width:22px;height:22px;flex:none;margin-top:2px}
.banner.info{background:var(--info-soft);color:var(--ink)}.banner.info svg{color:var(--info)}
.banner.bad{background:var(--bad-soft)}.banner.bad svg{color:var(--bad)}
.banner.warn{background:var(--warn-soft)}.banner.warn svg{color:var(--warn)}
.banner p{margin:2px 0 0;font-size:13.5px}
.banner b{font-family:var(--f-display);font-weight:700}
/* water + meds */
.water{display:flex;gap:16px;align-items:center}
.ring{width:92px;height:92px;flex:none}
.ring .tr{fill:none;stroke:var(--accent-soft);stroke-width:10}
.ring .fg{fill:none;stroke:var(--accent);stroke-width:10;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dasharray .4s}
.ring text{fill:var(--ink);font:600 17px var(--f-num)}
.big{font:600 20px/1.3 var(--f-num);margin:2px 0 8px}
.big small{font:400 13px var(--f-body);color:var(--muted)}
.dose{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.dose:last-child{border-bottom:0}
.dose .t{font:600 14px var(--f-num);width:52px;flex:none}
.dose .n{flex:1;min-width:0}
.dose .n b{font-weight:600}.dose .n small{display:block;color:var(--muted);font-size:12px}
.tick{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:none;display:grid;place-items:center;color:transparent;flex:none}
.tick svg{width:16px;height:16px}
.tick.on{background:var(--ok);border-color:var(--ok);color:var(--surface)}
/* forms */
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr))}
.field{display:grid;gap:4px;min-width:0}
.field label,.lbl{font-size:13px;color:var(--muted);font-weight:500}
input,select,textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
input.numin{font:600 24px/1.2 var(--f-num);text-align:center;direction:ltr}
textarea{resize:vertical;min-height:64px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:inline-block;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);font-size:13.5px;cursor:pointer}
.seg input:checked+span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.checks{display:grid;gap:6px}
.ck{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);cursor:pointer;font-size:14px;line-height:1.55}
.ck input{width:20px;height:20px;margin:1px 0 0;flex:none;accent-color:var(--accent)}
.ck.em input{accent-color:var(--bad)}
.ck:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.ck.em:has(input:checked){border-color:var(--bad);background:var(--bad-soft)}
.err{color:var(--bad);font-size:13px;min-height:1px;margin:4px 0 0}
/* result */
.result{border-radius:16px;padding:14px 16px;background:var(--surface-2);display:grid;gap:4px}
.result.ok{background:var(--ok-soft)}.result.warn{background:var(--warn-soft)}.result.bad{background:var(--bad-soft)}.result.info{background:var(--info-soft)}
.result .chip{background:var(--surface);border-color:transparent}
.r-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.r-top b{font:700 16px/1.4 var(--f-display)}
.r-val{font:600 34px/1.15 var(--f-num);direction:ltr;text-align:right}
.r-val small{font:500 14px var(--f-body);color:var(--muted)}
.result p{margin:2px 0 0;font-size:14px}
/* log */
.mchips{display:flex;gap:6px;flex-wrap:wrap}
.mchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink)}
.mchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mchip small{font-family:var(--f-num);opacity:.65;margin-inline-start:4px}
.chart{direction:ltr;margin-top:8px}
.chart svg{display:block;width:100%;height:auto}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .tk{fill:var(--muted);font:500 10px var(--f-num)}
.chart .band{fill:var(--ok-soft)}
.chart .ref{stroke:var(--ok);stroke-width:1;stroke-dasharray:3 3;opacity:.7}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:middle;margin-inline-end:5px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.stat{background:var(--surface-2);border-radius:12px;padding:8px 10px;min-width:0}
.stat span{display:block;font-size:11.5px;color:var(--muted)}
.stat b{font:600 16px/1.3 var(--f-num);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:420px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rlist{display:grid}
.rd{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);min-width:0}
.rd:last-child{border-bottom:0}
.rd .v{font:600 16px var(--f-num);min-width:70px}
.rd .m{flex:1;min-width:0;font-size:12.5px;color:var(--muted)}
.rd .m b{color:var(--ink);font-weight:500;font-size:13px}
.x{background:none;border:0;color:var(--muted);padding:6px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:600}
.x svg{width:16px;height:16px}
.x.confirm{color:var(--on-bad);background:var(--bad);padding:4px 10px}
/* body numbers */
.kv{display:grid;gap:0}
.kv>div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);align-items:baseline}
.kv>div:last-child{border-bottom:0}
.kv span{color:var(--muted);font-size:13.5px}
.kv b{font:600 15px var(--f-num);text-align:left;white-space:nowrap}
.kv em{font-style:normal;font-size:12px;color:var(--muted);display:block;text-align:left}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 94%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs-in{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));max-width:560px;margin:0 auto}
.tabs button{background:none;border:0;display:grid;justify-items:center;gap:1px;padding:4px 0;color:var(--muted);font-size:11.5px;font-weight:600;border-radius:12px}
.tabs button span.i{width:46px;height:28px;border-radius:999px;display:grid;place-items:center}
.tabs svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs button[aria-current="page"] span.i{background:var(--accent-soft)}
/* sheet */
.sheet-bg{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:94%;overflow:auto;overscroll-behavior:contain;border-radius:24px 24px 0 0;
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sheet-h{position:sticky;top:0;z-index:3;background:var(--surface);display:flex;align-items:center;gap:10px;padding:14px 0 10px}
.sheet-h h2{font:700 17px/1.35 var(--f-display);margin:0;flex:1;text-wrap:balance}
.sheet-h .x{background:var(--surface-2);width:34px;height:34px;border-radius:50%}
.sheet-b{display:grid;gap:14px}
.sheet-b>p{margin:0}
.steps{margin:0;padding-inline-start:20px;font-size:14px;display:grid;gap:4px}
.toast{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;max-width:min(92vw,440px);box-shadow:0 6px 24px rgba(0,0,0,.2)}
/* tests */
.stage{border-radius:18px;background:var(--surface-2);border:1px solid var(--line);padding:16px;display:grid;gap:10px;justify-items:center;text-align:center}
.bignum{font:600 56px/1 var(--f-num);color:var(--ink)}
.bignum small{font:500 14px var(--f-body);color:var(--muted);display:block;margin-top:6px}
.hr-top{display:flex;gap:16px;align-items:center;width:100%;justify-content:center}
.hr-cam{width:72px;height:72px;border-radius:50%;overflow:hidden;background:#200;border:3px solid var(--pulse);flex:none}
.hr-cam video{width:100%;height:100%;object-fit:cover}
.heart{color:var(--pulse);width:30px;height:30px}
.heart.beat{animation:hb var(--beat,1s) ease-in-out infinite}
@keyframes hb{0%,100%{transform:scale(1)}15%{transform:scale(1.22)}30%{transform:scale(1)}}
.wave{width:100%;height:90px;border-radius:12px;display:block;
  background-color:var(--surface);background-image:linear-gradient(var(--pulse-grid) 1px,transparent 1px),linear-gradient(90deg,var(--pulse-grid) 1px,transparent 1px);background-size:12px 12px}
.prog{height:6px;border-radius:6px;background:var(--line);overflow:hidden;width:100%}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s linear}
.status{font-size:14px;color:var(--muted);min-height:1.7em}
.pad{width:100%;min-height:240px;border-radius:20px;border:0;display:grid;place-items:center;font:700 20px/1.4 var(--f-display);color:var(--ink);background:var(--surface-2);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.pad.wait{background:var(--warn-soft)}.pad.go{background:var(--ok);color:var(--surface)}.pad.early{background:var(--bad-soft)}
.eye-box{background:#fff;border-radius:16px;width:220px;height:220px;max-width:100%;display:grid;place-items:center;border:1px solid var(--line)}
.eye-box canvas{width:200px;height:200px}
.arrows{direction:ltr;display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);gap:6px;justify-content:center}
.arrows button{border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink)}
.arrows button svg{width:26px;height:26px}
.arrows .u{grid-area:1/2}.arrows .l{grid-area:2/1}.arrows .r{grid-area:2/3}.arrows .d{grid-area:3/2}.arrows .n{grid-area:2/2;font-size:11.5px;font-weight:600;color:var(--muted)}
.plate{width:260px;height:260px;max-width:100%;border-radius:50%;background:#f3efe6}
.opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;width:100%}
.opts button{padding:12px 4px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font:600 18px var(--f-num);color:var(--ink)}
.opts button.wide{grid-column:span 4;font:600 14px var(--f-body)}
.whitecard{background:#fff;border-radius:14px;padding:8px;border:1px solid var(--line)}
.cal-wrap{width:100%;overflow:hidden;border-radius:12px;border:1px dashed var(--line);padding:10px 0}
.cal-card{height:auto;aspect-ratio:53.98/85.6;max-width:none;border-radius:10px;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 55%,var(--ink)));border:2px solid var(--ink)}
.q{border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:0;display:grid;gap:8px}
.q legend{font-size:14.5px;font-weight:500;padding:0 4px;line-height:1.55}
.q .seg span{font-size:12.5px;padding:6px 10px}
/* triage */
.triage{border-radius:18px;padding:16px;display:grid;gap:8px}
.triage.bad{background:var(--bad-soft)}.triage.warn{background:var(--warn-soft)}.triage.info{background:var(--info-soft)}.triage.ok{background:var(--ok-soft)}
.triage h3{font:700 18px/1.35 var(--f-display);margin:0}
.triage p{margin:0;font-size:14px}
.callnum{font:600 40px/1.1 var(--f-num);user-select:all;-webkit-user-select:all}
.sym{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:8px}
.sym button{text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 12px;font-size:14px;font-weight:600;color:var(--ink);line-height:1.45}
.know summary{cursor:pointer;font:700 15px/1.4 var(--f-display);list-style:none;display:flex;justify-content:space-between;gap:10px}
.know summary::-webkit-details-marker{display:none}
.know summary::after{content:"+";color:var(--muted);font-family:var(--f-num)}
.know[open] summary::after{content:"−"}
.know ol,.know ul{margin:10px 0 0;padding-inline-start:20px;font-size:14px;display:grid;gap:4px}
.fast{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px}
.fast div{background:var(--surface-2);border-radius:12px;padding:8px;text-align:center;font-size:12px;line-height:1.45}
.fast b{display:block;font:700 22px/1.2 var(--f-num);color:var(--bad)}
/* chat */
.chat{display:grid;gap:10px;align-content:start;min-height:120px}
.msg{max-width:88%;padding:10px 13px;border-radius:16px;font-size:14.5px;line-height:1.7;white-space:normal;overflow-wrap:anywhere}
.msg.u{justify-self:start;background:var(--accent);color:var(--accent-ink);border-end-start-radius:6px}
.msg.a{justify-self:end;background:var(--surface-2);border:1px solid var(--line);border-end-end-radius:6px}
.msg.a ul{margin:4px 0;padding-inline-start:18px}
.msg.a p{margin:0 0 6px}.msg.a p:last-child{margin:0}
.chat-f{display:flex;gap:8px;align-items:flex-end;position:sticky;bottom:0;background:var(--surface);padding-top:8px}
.chat-f textarea{min-height:48px;flex:1}
.sugg{display:flex;gap:6px;flex-wrap:wrap}
.sugg button{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--ink)}
/* medical id + report */
.mid{border-radius:18px;border:1px solid var(--line);overflow:hidden}
.mid-h{background:var(--bad);color:var(--on-bad);padding:8px 14px;font:700 14px var(--f-display);display:flex;justify-content:space-between}
.mid .kv{padding:4px 14px}
.paper{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:13.5px;overflow-x:auto}
.paper h4{font:700 14px var(--f-display);margin:12px 0 6px}
.paper h4:first-child{margin-top:0}
.paper table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.paper td,.paper th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
.paper th{color:var(--muted);font-weight:500;font-size:12px}
.foot{font-size:12px;color:var(--muted);line-height:1.7;margin-top:6px}
.enc-search{display:flex;gap:8px}
.enc-search input{flex:1;min-width:0}
.topics{display:flex;flex-wrap:wrap;gap:8px}
.topics button{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:8px 14px;font-size:14px;color:var(--ink);text-align:start}
.sym button small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
.art h4{font:700 15px/1.4 var(--f-display);margin:4px 0 6px}
.art ul{margin:0;padding-inline-start:20px;display:grid;gap:5px;font-size:14.5px;line-height:1.75}
.art .triage ul{font-size:14px}
.lead{font-size:15.5px;line-height:1.85;margin:0}
.loading{display:grid;justify-items:center;gap:10px;padding:28px 0;text-align:center}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--accent-soft);border-top-color:var(--accent);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.msg .conf{display:inline-block;margin-top:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>

};

/* ---------- data ---------- */
const COUNTRIES=[['SA','السعودية','997'],['AE','الإمارات','998'],['KW','الكويت','112'],['QA','قطر','999'],['BH','البحرين','999'],['OM','عُمان','9999'],['EG','مصر','123'],['JO','الأردن','911'],['IQ','العراق','122'],['LB','لبنان','140'],['MA','المغرب','15'],['DZ','الجزائر','14'],['TN','تونس','190'],['XX','دولة أخرى','112']];
const KEY='pocket-clinic:v1';
function blankState(){return{v:1,updated:0,demo:false,profile:{name:'',sex:'',birthYear:'',height:'',weight:'',blood:'',conditions:'',allergies:'',contactName:'',contactPhone:'',country:'SA',emNum:'997',gluUnit:'mg',activity:'1.375',waist:'',neck:'',hip:'',pxmm:0},readings:[],meds:[],medLog:{},water:{}}}

function normalize(x){

  if(!remote)return; if(writing){dirty=true;return}

async function connectRemote(){

/* ---------- classification ---------- */
const LVN={ok:'طبيعي',warn:'انتبه',bad:'يحتاج تدخلاً',info:'ملاحظة'};
const C=(lv,t,a)=>({lv,t,a});
function cBP(s,d){
  if(s>180||d>120)return C('bad','أزمة ارتفاع ضغط','استرح 5 دقائق وأعد القياس. إذا بقي مرتفعاً أو صاحبه ألم في الصدر أو ضيق نفس أو صداع شديد أو ضعف أو اضطراب في الرؤية، فاتصل بالإسعاف فوراً.');

function resample(ts,vs,fs){const out=[];if(ts.length<2)return out;const dt=1/fs;let j=0;for(let t=ts[0];t<=ts[ts.length-1];t+=dt){while(j<ts.length-2&&ts[j+1]<t)j++;const span=ts[j+1]-ts[j]||1;const f=clamp((t-ts[j])/span,0,1);out.push(vs[j]+(vs[j+1]-vs[j])*f)}return out}
function movAvg(x,w){const n=x.length,p=new Float64Array(n+1);for(let i=0;i<n;i++)p[i+1]=p[i]+x[i];const h=Math.floor(w/2),o=new Array(n);for(let i=0;i<n;i++){const a=Math.max(0,i-h),b=Math.min(n-1,i+h);o[i]=(p[b+1]-p[a])/(b-a+1)}return o}
function bandpass(x,fs,lo,hi){const tr=movAvg(x,Math.max(3,Math.round(fs/lo)));const d=x.map((v,i)=>v-tr[i]);return movAvg(d,Math.max(1,Math.round(fs/hi/2)))}
function autoRate(y,fs,minR,maxR){
  const n=y.length;if(n<fs*4)return null;let m=0;for(const v of y)m+=v;m/=n;const x=y.map(v=>v-m);
  const l0=Math.max(2,Math.floor(fs*60/maxR)),l1=Math.min(n-3,Math.ceil(fs*60/minR));if(l1<=l0+2)return null;
  const ac=new Float64Array(l1+2);
  for(let L=l0-1;L<=l1+1;L++){let s=0,e1=0,e2=0;for(let i=0;i+L<n;i++){s+=x[i]*x[i+L];e1+=x[i]*x[i];e2+=x[i+L]*x[i+L]}ac[L]=s/Math.sqrt(e1*e2||1)}
  const pk=[];for(let L=l0;L<=l1;L++)if(ac[L]>ac[L-1]&&ac[L]>=ac[L+1])pk.push(L);if(!pk.length)return null;
  let bl=pk[0],best=ac[bl];for(const L of pk)if(ac[L]>best){best=ac[L];bl=L}
  for(const L of pk){if(L<bl&&Math.abs(L*2-bl)<=2&&ac[L]>0.85*best){bl=L;best=ac[L];break}}
  const a=ac[bl-1],b=ac[bl],c=ac[bl+1],den=a-2*b+c,off=den?0.5*(a-c)/den:0;
  return{rate:60*fs/(bl+clamp(off,-.5,.5)),q:best};
}
function drawWave(cv,arr,cap,color){
  const dpr=window.devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;if(!W)return;
  if(cv.width!==Math.round(W*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr)}
  const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,W,H);if(arr.length<2)return;
  let mx=0;for(const v of arr)mx=Math.max(mx,Math.abs(v));mx=mx||1;
  c.strokeStyle=color;c.lineWidth=2;c.lineJoin='round';c.beginPath();
  arr.forEach((v,i)=>{const x=(i/(cap-1))*W;const y=H/2-v/mx*H*0.38;i?c.lineTo(x,y):c.moveTo(x,y)});c.stroke();
}

function vLog(){

      else if(band)body+=`<div class="legend"><span><i style="background:var(--ok-soft);height:10px"></i>النطاق الطبيعي</span></div>`;
      const r30=rs.filter(r=>Date.now()-r.ts<30*D),ser=r30.map(r=>M.ser(r.v));
      if(ser.length){const f=(i,fn)=>fn(...ser.map(s=>s[i])),avg=i=>ser.reduce((a,s)=>a+s[i],0)/ser.length;
        const dec=['temp','tremor'].includes(logK)?(logK==='tremor'?2:1):(logK==='wt'||(logK==='glu'&&P().gluUnit==='mmol')?1:0);

    }

function niceStep(raw){const p=10**Math.floor(Math.log10(raw||1)),n=raw/p;return (n<1.5?1:n<3?2:n<7?5:10)*p}
function chartSVG(pts,o){
  if(pts.length<2)return `<p class="hint">تحتاج قراءتين على الأقل لرسم المنحنى.</p>`;
  const W=340,H=176,L=36,R=12,T=12,B=26;
  const xs=pts.map(p=>p.x),x0=Math.min(...xs),x1=Math.max(...xs);
  let ys=pts.flatMap(p=>p.ys.filter(v=>v!=null));const allY=[...ys];if(o.band)allY.push(...o.band);if(o.refs)allY.push(...o.refs);
  let y0=Math.min(...allY),y1=Math.max(...allY);const pad=(y1-y0)*0.12||1;y0-=pad;y1+=pad;
  const st=niceStep((y1-y0)/4),ticks=[];for(let t=Math.ceil(y0/st)*st;t<=y1;t+=st)ticks.push(+t.toFixed(6));
  const X=v=>L+(W-L-R)*(v-x0)/((x1-x0)||1),Y=v=>T+(H-T-B)*(1-(v-y0)/(y1-y0));
  const dec=st<1?(st<0.1?2:1):0;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="منحنى القراءات">`;
  if(o.band)s+=`<rect class="band" x="${L}" y="${Y(Math.min(o.band[1],y1)).toFixed(1)}" width="${W-L-R}" height="${(Y(Math.max(o.band[0],y0))-Y(Math.min(o.band[1],y1))).toFixed(1)}"/>`;
  ticks.forEach(t=>{s+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}"/><text class="tk" x="${L-6}" y="${(Y(t)+3.5).toFixed(1)}" text-anchor="end">${t.toFixed(dec)}</text>`});
  (o.refs||[]).forEach(r=>{s+=`<line class="ref" x1="${L}" x2="${W-R}" y1="${Y(r).toFixed(1)}" y2="${Y(r).toFixed(1)}"/>`});
  const cols=['var(--accent)','var(--pulse)'];const nser=pts[0].ys.length;
  for(let i=0;i<nser;i++){
    const P2=pts.filter(p=>p.ys[i]!=null).map(p=>[X(p.x),Y(p.ys[i])]);
    if(i===0&&nser===1)s+=`<path d="M${P2[0][0].toFixed(1)} ${Y(y0).toFixed(1)} ${P2.map(q=>'L'+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ')} L${P2[P2.length-1][0].toFixed(1)} ${Y(y0).toFixed(1)}Z" fill="${cols[0]}" fill-opacity=".10"/>`;
    s+=`<polyline points="${P2.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ')}" fill="none" stroke="${cols[i]}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
    P2.forEach((q,j)=>{s+=`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="${j===P2.length-1?4.2:2.2}" fill="${j===P2.length-1?cols[i]:'var(--surface)'}" stroke="${cols[i]}" stroke-width="1.6"/>`});
  }
  s+=`<text class="tk" x="${L}" y="${H-6}" text-anchor="start">${fD.format(x0)}</text><text class="tk" x="${W-R}" y="${H-6}" text-anchor="end">${fD.format(x1)}</text></svg>`;
  return s;
}

function bodyNums(){
  const p=P(),h=+p.height,w=+p.weight,a=age(),sex=p.sex;
  if(!(h>50)||!(w>10))return `<p class="hint" style="margin:0">أدخل طولك ووزنك لحساب مؤشراتك.</p>`;
  const hm=h/100,bmi=w/(hm*hm),cb=cBMI(bmi),rows=[];
  rows.push(['مؤشر كتلة الجسم',bmi.toFixed(1),`<span class="chip ${cb.lv}">${cb.t}</span>`]);

  if(a&&(sex==='m'||sex==='f')){const bmr=10*w+6.25*h-5*a+(sex==='m'?5:-161),tdee=bmr*(+p.activity||1.375);
    rows.push(['الحرق الأساسي (BMR)',Math.round(bmr)+' سعرة','معادلة ميفلين']);
    rows.push(['احتياجك اليومي',Math.round(tdee)+' سعرة','لإنقاص الوزن: '+Math.round(tdee-500)])}
  rows.push(['الماء اليومي',(Math.round(w*33/250)*250/1000).toFixed(2).replace(/0$/,'')+' لتر','33 مل لكل كغ']);
  if(a){const mx=220-a;rows.push(['أقصى نبض',mx+' ن/د','220 − العمر']);rows.push(['نبض حرق الدهون',Math.round(mx*.6)+'–'+Math.round(mx*.7)+' ن/د','60–70%']);rows.push(['نبض اللياقة القلبية',Math.round(mx*.7)+'–'+Math.round(mx*.85)+' ن/د','70–85%'])}
  const wa=+p.waist,ne=+p.neck,hi=+p.hip;
  if(wa>30){const r=wa/h;rows.push(['نسبة الخصر إلى الطول',r.toFixed(2),`<span class="chip ${r<0.5?'ok':r<0.6?'warn':'bad'}">${r<0.5?'صحية':r<0.6?'مرتفعة':'مرتفعة جداً'}</span>`])}
  if(wa>30&&ne>15&&(sex==='m'||(sex==='f'&&hi>30))){
    let bf=sex==='m'?495/(1.0324-0.19077*Math.log10(wa-ne)+0.15456*Math.log10(h))-450:495/(1.29579-0.35004*Math.log10(wa+hi-ne)+0.22100*Math.log10(h))-450;
    if(isFinite(bf)&&bf>2&&bf<70){const cut=sex==='m'?[6,14,18,25]:[14,21,25,32];const lab=bf<cut[0]?['رياضي جداً','ok']:bf<cut[1]?['رياضي','ok']:bf<cut[2]?['لياقة جيدة','ok']:bf<cut[3]?['متوسط','warn']:['مرتفع','bad'];
      rows.push(['نسبة الدهون (طريقة البحرية)',bf.toFixed(1)+'%',`<span class="chip ${lab[1]}">${lab[0]}</span>`])}}
  return `<div class="kv">${rows.map(r=>`<div><span>${r[0]}</span><span><b>${r[1]}</b>${r[2]?`<em>${r[2]}</em>`:''}</span></div>`).join('')}</div>`;
}

/* ---------- add reading ---------- */
function numIn(id,label,ph,attrs='inputmode="decimal"'){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" class="numin" ${attrs} placeholder="${ph}" autocomplete="off"></div>`}
const getN=id=>{const v=($('#'+id)||{}).value;if(v==null||String(v).trim()==='')return null;const n=parseFloat(String(v).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace('٫','.').replace(',','.'));return isFinite(n)?n:NaN};
function sheetAdd(k){
  const forms={
    bp:`<div class="form">${numIn('f-sys','الانقباضي (الرقم العلوي)','120','inputmode="numeric"')}${numIn('f-dia','الانبساطي (الرقم السفلي)','80','inputmode="numeric"')}${numIn('f-pul','النبض (اختياري)','72','inputmode="numeric"')}</div><p class="hint">اجلس مرتاحاً 5 دقائق، ظهرك مسنود وقدماك على الأرض، والذراع بمستوى القلب. لا تتكلم أثناء القياس.</p>`,
    glu:`<div class="form">${numIn('f-glu','السكر ('+gUnit()+')',P().gluUnit==='mmol'?'5.4':'95')}</div><div class="field"><span class="lbl">توقيت القياس</span><div class="seg">${Object.entries(CTX).map(([v,n],i)=>`<label><input type="radio" name="f-ctx" value="${v}" ${i===0?'checked':''}><span>${n}</span></label>`).join('')}</div></div><p class="hint">صائم = دون طعام 8 ساعات على الأقل.</p>`,
    spo2:`<div class="form">${numIn('f-spo','تشبع الأكسجين (%)','98','inputmode="numeric"')}${numIn('f-pul','النبض (اختياري)','72','inputmode="numeric"')}</div><p class="hint">استخدم جهاز قياس الأكسجين على الإصبع، ويدك دافئة وثابتة، وانتظر حتى تستقر القراءة.</p>`,
    temp:`<div class="form">${numIn('f-tmp','الحرارة (°م)','36.8')}</div><p class="hint">يمكنك إدخال الفهرنهايت وسيُحوَّل تلقائياً.</p>`,
    wt:`<div class="form">${numIn('f-wt','الوزن (كغ)',P().weight||'70')}</div><p class="hint">تزن صباحاً بعد دخول الحمام وقبل الأكل للحصول على قراءات قابلة للمقارنة.</p>`,
    hr:`<div class="form">${numIn('f-hr','النبض (نبضة/د)','72','inputmode="numeric"')}</div><p class="hint">عُدّ نبضك في المعصم 30 ثانية واضربه في 2، أو استخدم <button type="button" class="linkish" data-act="test" data-t="heart">القياس بالكاميرا</button>.</p>`,
    rr:`<div class="form">${numIn('f-rr','الأنفاس في الدقيقة','16','inputmode="numeric"')}</div><p class="hint">عُدّ مرات ارتفاع صدرك خلال 30 ثانية واضربها في 2، أو استخدم <button type="button" class="linkish" data-act="test" data-t="breath">القياس بالحساس</button>.</p>`
  };
  openSheet('سجّل '+MET[k].n,`<form id="addF" class="sheet-b" novalidate>${forms[k]}<p class="err" id="addErr"></p><button class="btn block" type="submit">احفظ القراءة</button></form><div id="addOut"></div>`,b=>{
    const f=$('#addF',b);setTimeout(()=>{const i=$('input.numin',f);if(i)i.focus()},120);
    f.addEventListener('submit',e=>{e.preventDefault();const err=$('#addErr',b);err.textContent='';
      const bad=m=>{err.textContent=m;return null};let v=null,note='';
      if(k==='bp'){const s=getN('f-sys'),d=getN('f-dia'),p=getN('f-pul');if(!(s>=60&&s<=260))return bad('أدخل الرقم العلوي بين 60 و260.');if(!(d>=30&&d<=160))return bad('أدخل الرقم السفلي بين 30 و160.');if(d>=s)return bad('الرقم العلوي يجب أن يكون أكبر من السفلي.');v={sys:Math.round(s),dia:Math.round(d)};if(p>=30&&p<=220)v.pulse=Math.round(p)}
      if(k==='glu'){let g=getN('f-glu');const mm=P().gluUnit==='mmol';if(!(g>0))return bad('أدخل قيمة السكر.');const mg=mm?g*18:g;if(!(mg>=20&&mg<=600))return bad(mm?'أدخل قيمة بين 1.1 و33.3.':'أدخل قيمة بين 20 و600.');v={mg:Math.round(mg),ctx:($('input[name="f-ctx"]:checked',b)||{}).value||'r'}}
      if(k==='spo2'){const s=getN('f-spo');if(!(s>=60&&s<=100))return bad('أدخل نسبة بين 60 و100.');v={pct:Math.round(s)}}
      if(k==='temp'){let t=getN('f-tmp');if(t>=90&&t<=110){t=(t-32)*5/9;note='حُوّلت من فهرنهايت.'}if(!(t>=33&&t<=43))return bad('أدخل حرارة بين 33 و43 درجة مئوية.');v={c:Math.round(t*10)/10}}
      if(k==='wt'){const w=getN('f-wt');if(!(w>=20&&w<=300))return bad('أدخل وزناً بين 20 و300 كغ.');v={kg:Math.round(w*10)/10}}
      if(k==='hr'){const h=getN('f-hr');if(!(h>=30&&h<=220))return bad('أدخل نبضاً بين 30 و220.');v={bpm:Math.round(h),src:'man'}}
      if(k==='rr'){const r=getN('f-rr');if(!(r>=4&&r<=60))return bad('أدخل قيمة بين 4 و60.');v={rpm:Math.round(r),src:'man'}}
      if(!v)return;
      addReading(k,v);
      if((k==='bp'||k==='spo2')){const p=getN('f-pul');if(p>=30&&p<=220)addReading('hr',{bpm:Math.round(p),src:k})}
      const c=MET[k].cls(v);f.hidden=true;
      $('#addOut',b).innerHTML=`<div class="sheet-b">${resultHTML(c,MET[k].val(v),unitOf(k))}${note?`<p class="hint">${note}</p>`:''}<div class="row"><button class="btn" type="button" data-act="close">تم</button><button class="btn ghost" type="button" data-act="add" data-k="${k}">قراءة أخرى</button></div></div>`;
    });
  });
}

/* ---------- test: heart (camera PPG) ---------- */
function testHeart(b){
  b.innerHTML=`<div class="stage">
    <div class="hr-top"><div class="hr-cam"><video id="hrVid" playsinline muted autoplay></video></div><div class="bignum"><bdi id="hrBpm">--</bdi><small>نبضة في الدقيقة</small></div>${ic('heart','heart')}</div>
    <canvas class="wave" id="hrWave" aria-hidden="true"></canvas>
    <div class="prog"><i id="hrProg"></i></div>
    <div class="status" id="hrSt">اضغط «ابدأ» ثم غطِّ الكاميرا الخلفية والفلاش بطرف إصبعك.</div>
  </div>
  <ol class="steps"><li>اجلس واسترح دقيقة قبل القياس.</li><li>غطِّ العدسة والفلاش معاً بطرف السبابة، بلمسة خفيفة دون ضغط.</li><li>ثبّت يدك ولا تتكلم حتى يكتمل الشريط (30 ثانية).</li></ol>
  <button class="btn block" type="button" id="hrGo">${ic('heart')}ابدأ القياس</button>
  <div id="hrOut"></div>`;
  const vid=$('#hrVid',b),st=$('#hrSt',b),bpmEl=$('#hrBpm',b),prog=$('#hrProg',b),wave=$('#hrWave',b),goBtn=$('#hrGo',b),out=$('#hrOut',b),heart=$('.heart',b);
  const DUR=30,WARM=2.5,CAP=150,col=cssVar('--pulse')||'#cf3653';
  let stream=null,stopped=true,t0=null,miss=0,ema1=null,ema2=0,lastEst=0;let ts=[],R=[],G=[],disp=[];
  const cv=document.createElement('canvas');cv.width=40;cv.height=30;const cx=cv.getContext('2d',{willReadFrequently:true});
  function stopCam(){stopped=true;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}try{vid.srcObject=null}catch(e){}}
  function reset(){t0=null;ts=[];R=[];G=[];disp=[];ema1=null;ema2=0;prog.style.width='0';bpmEl.textContent='--';heart.classList.remove('beat')}
  function estimate(a,bnd){
    const idx=[];for(let i=0;i<ts.length;i++)if(ts[i]>=a&&ts[i]<=bnd)idx.push(i);if(idx.length<60)return null;
    const t=idx.map(i=>ts[i]);let best=null;
    for(const ch of [R,G]){const v=idx.map(i=>ch[i]);const mean=v.reduce((x,y)=>x+y,0)/v.length;if(mean>252||mean<8)continue;
      const y=bandpass(resample(t,v,30),30,0.7,4);const e=autoRate(y,30,40,180);if(e&&(!best||e.q>best.q))best=e}
    return best;
  }
  function frame(){
    if(stopped)return;
    if(vid.readyState>=2&&vid.videoWidth){
      cx.drawImage(vid,0,0,40,30);const d=cx.getImageData(8,6,24,18).data;let r=0,g=0,bl=0;const n=d.length/4;
      for(let i=0;i<d.length;i+=4){r+=d[i];g+=d[i+1];bl+=d[i+2]}r/=n;g/=n;bl/=n;
      const now=performance.now()/1000,finger=r>55&&r>g*1.45&&r>bl*1.45;
      if(!finger){if(++miss>8&&t0!==null){reset();st.textContent='ابتعد إصبعك. أعد وضعه على الكاميرا والفلاش معاً.'}else if(t0===null)st.textContent='ضع طرف إصبعك على الكاميرا الخلفية والفلاش…'}
      else{miss=0;if(t0===null){t0=now;st.textContent='ممتاز، ثبّت إصبعك… جارٍ القياس'}
        const el=now-t0;ts.push(el);R.push(r);G.push(g);
        const sig=r>250?g:r;if(ema1===null)ema1=sig;ema1+=(sig-ema1)*0.05;const hp=sig-ema1;ema2+=(hp-ema2)*0.4;disp.push(-ema2);if(disp.length>CAP)disp.shift();drawWave(wave,disp,CAP,col);
        prog.style.width=clamp(el/DUR*100,0,100)+'%';
        if(el>WARM+7&&now-lastEst>1){lastEst=now;const e=estimate(Math.max(WARM,el-10),el);if(e&&e.q>0.3){bpmEl.textContent=Math.round(e.rate);heart.style.setProperty('--beat',(60/e.rate).toFixed(2)+'s');heart.classList.add('beat')}}
        if(el>=DUR){finish();return}}
    }
    if(vid.requestVideoFrameCallback)vid.requestVideoFrameCallback(frame);else requestAnimationFrame(frame);
  }
  function finish(){
    const e=estimate(WARM,DUR);stopCam();goBtn.hidden=false;goBtn.disabled=false;goBtn.innerHTML=ic('heart')+'قِس مرة أخرى';heart.classList.remove('beat');
    if(!e||e.q<0.32){st.textContent='';out.innerHTML=`<div class="banner warn">${ic('alert')}<div><b>لم نلتقط نبضاً واضحاً</b><p>جرّب مرة أخرى: لمسة خفيفة دون ضغط، وغطِّ الفلاش والعدسة معاً، وثبّت يدك. الأيدي الباردة تضعف الإشارة؛ دفّئها أولاً.</p></div></div>`;bpmEl.textContent='--';return}
    const bpm=Math.round(e.rate),c=cHR(bpm);bpmEl.textContent=bpm;st.textContent='جودة الإشارة: '+(e.q>0.7?'ممتازة':e.q>0.5?'جيدة':'مقبولة');
    out.innerHTML=`<div class="sheet-b">${resultHTML(c,bpm,'نبضة/د')}<div class="row"><button class="btn" type="button" id="hrSave">احفظ في السجل</button></div></div>`;
    $('#hrSave',out).onclick=ev=>{addReading('hr',{bpm,src:'cam',q:+e.q.toFixed(2)});ev.target.disabled=true;ev.target.textContent='حُفظت';toast('حُفظت القراءة')};
  }
  goBtn.onclick=async()=>{
    out.innerHTML='';reset();goBtn.disabled=true;st.textContent='جارٍ تشغيل الكاميرا…';
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){camFail();return}
    try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:320},height:{ideal:240},frameRate:{ideal:30}}})}catch(e){camFail(e);return}
    const track=stream.getVideoTracks()[0];let torch=false;
    try{const caps=track.getCapabilities&&track.getCapabilities();if(caps&&caps.torch){await track.applyConstraints({advanced:[{torch:true}]});torch=true}}catch(e){}
    vid.srcObject=stream;try{await vid.play()}catch(e){}
    stopped=false;goBtn.hidden=true;st.textContent=torch?'ضع طرف إصبعك على الكاميرا والفلاش…':'لم يتوفر الفلاش في هذا المتصفح. قف قرب ضوء قوي وغطِّ الكاميرا بإصبعك…';
    frame();
  };
  function camFail(e){
    goBtn.disabled=false;st.textContent='';
    const denied=e&&(e.name==='NotAllowedError'||e.name==='SecurityError');
    out.innerHTML=`<div class="banner warn">${ic('alert')}<div><b>الكاميرا غير متاحة</b><p>${IN_VIEWER?'الكاميرا لا تعمل داخل هذا العرض. افتح التطبيق مباشرة في متصفح هاتفك (Chrome أو Safari) لقياس النبض بالكاميرا.':denied?'لم يُسمح باستخدام الكاميرا. اسمح بها من إعدادات المتصفح للموقع ثم أعد المحاولة.':'لم نتمكن من تشغيل الكاميرا الخلفية على هذا الجهاز.'}</p><div class="row" style="margin-top:8px"><button class="btn sm" type="button" data-act="add" data-k="hr">أدخل النبض يدوياً</button></div></div></div>`;
  }
  return stopCam;
}

function testBreath(b){

  let live=true,listener=null,timer=0;

  function sensorUI(){

    for(let i=3;i>0;i--){if(!live)return;st.textContent='مدّ ذراعك… '+i;await sleep(1000)}
    const ts=[],X=[],Y=[],Z=[],disp=[];const t0=performance.now()/1000;let gx=null,gy,gz;
    listener=e=>{let a=e.acceleration,x,y,z;if(a&&a.x!=null){x=a.x;y=a.y;z=a.z}else{a=e.accelerationIncludingGravity;if(!a||a.x==null)return;if(gx===null){gx=a.x;gy=a.y;gz=a.z}gx+=(a.x-gx)*.1;gy+=(a.y-gy)*.1;gz+=(a.z-gz)*.1;x=a.x-gx;y=a.y-gy;z=a.z-gz}

/* ---------- test: reaction ---------- */
function testReact(b){
  b.innerHTML=`<p class="hint" style="margin:0">حين يتحول المربع إلى الأخضر المسه بأسرع ما يمكن. خمس محاولات.</p><button type="button" class="pad" id="rxPad">المس للبدء</button><div class="row" id="rxTimes"></div><div id="rxOut"></div>`;

  const set=(s,t)=>{state=s;pad.className='pad '+(s==='wait'?'wait':s==='go'?'go':s==='early'?'early':'');pad.textContent=t};
  function arm(){set('wait','انتظر اللون الأخضر…');to=setTimeout(()=>{tGo=performance.now();set('go','المس الآن!')},1500+Math.random()*2500)}

    if(state==='idle'||state==='early'||state==='shown'){arm();return}

      if(res.length<5){set('shown',ms+' ملي ثانية · المس للمحاولة التالية')}
      else{state='done';const avg=Math.round(res.reduce((a,x)=>a+x,0)/res.length),best=Math.min(...res),c=cReact(avg);pad.className='pad';pad.textContent='انتهى الاختبار';
        out.innerHTML=`<div class="sheet-b">${resultHTML(c,avg,'ملي ثانية',`<p class="small muted">أفضل محاولة: <bdi>${best}</bdi> ملي ثانية.</p>`)}<div class="row"><button class="btn" type="button" id="rxSave">احفظ في السجل</button><button class="btn ghost" type="button" id="rxRe">أعد</button></div></div>`;
        $('#rxSave',out).onclick=ev=>{addReading('react',{ms:avg,best});ev.target.disabled=true;ev.target.textContent='حُفظت';toast('حُفظت النتيجة')};
        $('#rxRe',out).onclick=()=>{res=[];times.innerHTML='';out.innerHTML='';set('idle','المس للبدء')}}}
  });

/* ---------- test: visual acuity (tumbling E) ---------- */
function testAcuity(b){
  const SN=[200,100,70,50,40,30,25,20],DIST=400,mm20=DIST*Math.tan(5/60*Math.PI/180);
  let eye='R',lvl=0,trial=0,ok=0,wrong=0,dir=0,passed=null,results={};
  function intro(){
    b.innerHTML=`${P().pxmm?'':`<div class="banner info">${ic('ruler')}<div><b>عايِر الشاشة أولاً</b><p>لتكون أحجام الحروف دقيقة على هاتفك.</p><div class="row" style="margin-top:8px"><button class="btn sm" type="button" id="acCal">عايِر الآن</button></div></div></div>`}
    <ol class="steps"><li>امسك الهاتف على بُعد 40 سم من عينيك (تقريباً المسافة من المرفق إلى أطراف الأصابع).</li><li>إذا كنت تلبس نظارة للقراءة أو للبعيد فالبسها.</li><li>غطِّ عينك ${eye==='R'?'اليسرى':'اليمنى'} بكفّك دون ضغط، واختبر العين ${EYE[eye]}.</li><li>اضغط السهم الذي يشير إلى اتجاه فتحة الحرف E.</li></ol>
    <button class="btn block" type="button" id="acGo">${ic('eye')}ابدأ بالعين ${EYE[eye]}</button>`;
    const cal=$('#acCal',b);if(cal)cal.onclick=()=>{b.innerHTML=calibHTML();mountCalib(b,intro)};
    $('#acGo',b).onclick=()=>{lvl=0;trial=0;ok=0;wrong=0;passed=null;stage();next()};
  }
  function stage(){
    b.innerHTML=`<div class="stage"><div class="status" id="acSt"></div><div class="eye-box"><canvas id="acCv" width="200" height="200"></canvas></div>
    <div class="arrows"><button type="button" class="u" data-d="3" aria-label="أعلى">${ic('arrowU')}</button><button type="button" class="l" data-d="2" aria-label="يسار">${ic('arrowL')}</button><button type="button" class="n" data-d="-1">لا أراه</button><button type="button" class="r" data-d="0" aria-label="يمين">${ic('arrowR')}</button><button type="button" class="d" data-d="1" aria-label="أسفل">${ic('arrowD')}</button></div></div>`;
    $$('.arrows button',b).forEach(x=>x.onclick=()=>answer(+x.dataset.d));
  }
  function drawE(){
    const cv=$('#acCv',b),dpr=window.devicePixelRatio||1;cv.width=Math.round(200*dpr);cv.height=Math.round(200*dpr);
    const c=cv.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,cv.width,cv.height);
    const hpx=mm20*(SN[lvl]/20)*pxmm()*dpr,u=Math.max(1,Math.round(hpx/5)),s=u*5;
    c.save();c.translate(Math.round(cv.width/2),Math.round(cv.height/2));c.rotate(dir*Math.PI/2);c.translate(-s/2,-s/2);c.fillStyle='#000';
    c.fillRect(0,0,u,s);c.fillRect(0,0,s,u);c.fillRect(0,2*u,s,u);c.fillRect(0,4*u,s,u);c.restore();
    $('#acSt',b).textContent=`العين ${EYE[eye]} · المستوى ${lvl+1} من ${SN.length} · المحاولة ${trial+1} من 4`;
  }
  function next(){dir=Math.floor(Math.random()*4);drawE()}
  function answer(d){
    if(d===dir)ok++;else wrong++;trial++;

      trial=0;ok=0;wrong=0}
    next();
  }
  function finishEye(){
    const d=passed||400;results[eye]=d;addReading('vision',{eye,d});
    if(eye==='R'){eye='L';b.innerHTML=`${resultHTML(cVision(d),snel(d),'العين اليمنى · '+snelM(d))}<button class="btn block" type="button" id="acNext">الآن العين اليسرى</button>`;$('#acNext',b).onclick=intro;return}
    const worst=Math.max(results.R||400,results.L||400);
    b.innerHTML=`<div class="grid2">${resultHTML(cVision(results.R),snel(results.R),'العين اليمنى · '+snelM(results.R))}${resultHTML(cVision(results.L),snel(results.L),'العين اليسرى · '+snelM(results.L))}</div>
    <p class="hint">حُفظت النتائج في سجلك. ${Math.abs(SN.indexOf(results.R)-SN.indexOf(results.L))>=2?'يوجد فرق واضح بين العينين؛ يُنصح بفحص النظر.':''}${worst>30?' يُنصح بفحص النظر لدى أخصائي البصريات.':''} هذا فحص للرؤية القريبة ولا يغني عن فحص العيادة.</p><button class="btn block" type="button" data-act="close">تم</button>`;
  }
  intro();
}

/* ---------- test: color plates ---------- */
function lumOf(r,g,b){const f=c=>{c/=255;return c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4)};return 0.2126*f(r)+0.7152*f(g)+0.0722*f(b)}

function drawPlate(cv,digit,kind,sat){
  const S0=260,dpr=window.devicePixelRatio||1;cv.width=S0*dpr;cv.height=S0*dpr;const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);
  const m=document.createElement('canvas');m.width=S0;m.height=S0;const mc=m.getContext('2d');mc.fillStyle='#000';mc.font=`700 ${S0*0.6}px Arial,Helvetica,sans-serif`;mc.textAlign='center';mc.textBaseline='middle';mc.fillText(String(digit),S0/2,S0/2+S0*0.03);
  const md=mc.getImageData(0,0,S0,S0).data,R0=S0/2-3,cell=18,grid=new Map(),dots=[];
  const key=(x,y)=>((x/cell)|0)+','+((y/cell)|0);
  for(let a=0;a<12000&&dots.length<1700;a++){
    const r=2.2+Math.pow(Math.random(),1.8)*6.4,ang=Math.random()*Math.PI*2,rad=Math.sqrt(Math.random())*(R0-r),x=S0/2+Math.cos(ang)*rad,y=S0/2+Math.sin(ang)*rad;
    let okk=true;const gx=(x/cell)|0,gy=(y/cell)|0;
    for(let i=-1;i<=1&&okk;i++)for(let j=-1;j<=1&&okk;j++){const arr=grid.get((gx+i)+','+(gy+j));if(arr)for(const d of arr){if(Math.hypot(d[0]-x,d[1]-y)<d[2]+r+0.9){okk=false;break}}}
    if(!okk)continue;const d=[x,y,r];dots.push(d);const k=key(x,y);if(!grid.has(k))grid.set(k,[]);grid.get(k).push(d);

  for(const [x,y,r] of dots){

    if(kind==='ctrl')col=inside?atLum(210,0.18,0.07+Math.random()*0.06):atLum(36,0.28,0.42+Math.random()*0.18);

  }
}

}

/* ---------- test: hearing ---------- */
function hearCls(v){return v.flags&&v.flags.length?C('warn','يحتاج متابعة',v.flags.join(' · ')+'. اختبار مقارن غير معاير؛ يُنصح بتخطيط السمع لدى أخصائي.'):C('ok','سمع متوازن','لم يظهر فرق واضح بين الأذنين أو انخفاض عند ترددات معينة. اختبار مقارن غير معاير.')}
function audiogram(v){
  const F=[500,1000,2000,4000,8000],W=320,H=190,L=34,R=14,T=14,B=26,X=i=>L+(W-L-R)*i/(F.length-1),Y=r=>T+(H-T-B)*clamp(r,0,80)/80;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="مخطط السمع">`;
  for(let r=0;r<=80;r+=20)s+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${Y(r)}" y2="${Y(r)}"/><text class="tk" x="${L-6}" y="${Y(r)+3.5}" text-anchor="end">${r}</text>`;
  F.forEach((f,i)=>s+=`<text class="tk" x="${X(i)}" y="${H-7}" text-anchor="middle">${f>=1000?f/1000+'k':f}</text>`);
  for(const [e,col] of [['R','var(--bad)'],['L','var(--info)']]){const pts=F.map((f,i)=>[X(i),Y(v[e]&&v[e][f]!=null?v[e][f]:80)]);
    s+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${col}" stroke-width="1.8"/>`;
    pts.forEach(([x,y])=>{s+=e==='R'?`<circle cx="${x}" cy="${y}" r="5" fill="var(--surface)" stroke="${col}" stroke-width="2"/>`:`<path d="M${x-4.5} ${y-4.5}l9 9M${x+4.5} ${y-4.5}l-9 9" stroke="${col}" stroke-width="2.2" stroke-linecap="round"/>`})}
  return s+'</svg>';
}
function testHear(b){
  const F=[1000,2000,4000,8000,500],LV=[-80,-70,-60,-50,-40,-30,-20,-10];let ctx=null,live=true,heardFlag=false,toneOn=0;
  b.innerHTML=`<ol class="steps"><li>البس سماعات الأذن (السلكية أفضل) في مكان هادئ.</li><li>اضبط صوت الهاتف على 50% واترك هذا المستوى ثابتاً في كل مرة تختبر فيها لتقارن النتائج.</li><li>ستسمع نغمات تتصاعد تدريجياً في كل أذن. اضغط «أسمعها» فور سماع أي نغمة ولو كانت خافتة جداً.</li></ol>
  <button class="btn block" type="button" id="hGo">${ic('ear')}ابدأ الاختبار (دقيقتان تقريباً)</button>`;
  $('#hGo',b).onclick=run;
  function tone(f,db,ear){const t=ctx.currentTime+0.02,o=ctx.createOscillator(),g=ctx.createGain(),m=ctx.createChannelMerger(2),a=Math.pow(10,db/20);
    o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(a,t+0.06);g.gain.setValueAtTime(a,t+0.85);g.gain.linearRampToValueAtTime(0,t+0.95);
    o.connect(g);g.connect(m,0,ear==='L'?0:1);m.connect(ctx.destination);o.start(t);o.stop(t+1)}
  function wait(ms){return new Promise(res=>{const t0=performance.now();const iv=setInterval(()=>{if(!live||heardFlag||performance.now()-t0>ms){clearInterval(iv);res()}},40)})}
  async function run(){
    try{ctx=new (window.AudioContext||window.webkitAudioContext)();await ctx.resume()}catch(e){b.innerHTML=`<div class="banner warn">${ic('alert')}<div><b>الصوت غير متاح</b><p>لم نتمكن من تشغيل الصوت على هذا الجهاز.</p></div></div>`;return}
    b.innerHTML=`<div class="stage"><div class="status" id="hSt"></div><div class="prog"><i id="hProg"></i></div><button type="button" class="pad" id="hPad" style="min-height:200px">أسمعها</button></div><button class="btn ghost block" type="button" data-act="close">إيقاف</button>`;
    const st=$('#hSt',b),pad=$('#hPad',b),prog=$('#hProg',b);
    pad.addEventListener('pointerdown',e=>{e.preventDefault();if(performance.now()-toneOn<2600){heardFlag=true;pad.classList.add('go');setTimeout(()=>pad.classList.remove('go'),220)}});
    const res={R:{},L:{}};let done=0;
    for(const ear of ['R','L'])for(const f of F){
      let th=null;
      for(const lv of LV){if(!live)return;st.textContent=`الأذن ${EYE[ear]} · ${f} هرتز`;heardFlag=false;await sleep(500+Math.random()*900);if(!live)return;
        toneOn=performance.now();tone(f,lv,ear);await wait(1900);if(heardFlag){th=lv;await sleep(350);break}}
      res[ear][f]=th==null?80:th+80;done++;prog.style.width=(done/(F.length*2)*100)+'%';
    }
    try{ctx.close()}catch(e){}
    const Fs=[500,1000,2000,4000,8000],all=Fs.flatMap(f=>[res.R[f],res.L[f]]),best=Math.min(...all),flags=[];
    const asym=Fs.filter(f=>Math.abs(res.R[f]-res.L[f])>=20);if(asym.length>=2)flags.push('فرق واضح بين الأذنين');
    const drop=Fs.filter(f=>Math.min(res.R[f],res.L[f])-best>=30);if(drop.length)flags.push('انخفاض عند '+drop.map(f=>f>=1000?f/1000+' كيلوهرتز':f+' هرتز').join(' و'));
    if(Fs.some(f=>res.R[f]>=80||res.L[f]>=80))flags.push('نغمات لم تُسمع');
    const v={R:res.R,L:res.L,flags};addReading('hear',v);
    b.innerHTML=`${resultHTML(hearCls(v),null,'')}<div class="chart">${audiogram(v)}</div><div class="legend"><span><i style="background:var(--bad)"></i>الأذن اليمنى (O)</span><span><i style="background:var(--info)"></i>الأذن اليسرى (X)</span><span>الأعلى في المخطط = سمع أفضل</span></div>
    <p class="hint">ضعف السمع المفاجئ في أذن واحدة حالة عاجلة تستدعي مراجعة طبيب الأنف والأذن خلال 24–48 ساعة.</p><button class="btn block" type="button" data-act="close">تم</button>`;
  }
  return()=>{live=false;try{ctx&&ctx.close()}catch(e){}};
}

  <div><h3 class="sec" style="margin:0 0 8px;font-size:15px">وهل ينطبق عليك أيٌّ مما يلي؟</h3><div class="checks">${ck(s.ur,'ur')}</div></div>

      else if(ur.length){lv='warn';h='راجع طبيباً أو قسم الطوارئ اليوم';p='الأعراض التي اخترتها تستحق فحصاً طبياً خلال 24 ساعة. إذا ظهرت أي علامة خطر قبل ذلك فاتصل بالإسعاف.'}

      else{lv='ok';h='يمكنك العناية بنفسك في المنزل';p=s.self}

function sheetArticle(topic,force){
  topic=String(topic||'').replace(/\s+/g,' ').trim().slice(0,120);if(!topic)return;
  if(!aiSample){toast('الموسوعة تعمل عند فتح التطبيق من داخل Claude');return}
  const cached=!force&&artCache()[topic];
  openSheet(topic,`<div id="artBody"></div>`,b=>{
    const body=$('#artBody',b);
    if(cached){renderArt(body,topic,cached.a);artPut(topic,cached.a);return}
    let live=true;const t0=Date.now(),ctl=new AbortController();
    body.innerHTML=`<div class="loading"><div class="spin"></div><b>يُكتب مدخل «${esc(topic)}»</b><span class="hint" id="artT" style="margin:0">يراجع المعلومات بعناية قبل الكتابة، وقد يستغرق ذلك حتى دقيقة.</span><button class="btn ghost sm" type="button" id="artStop">إيقاف</button></div>`;
    const iv=setInterval(()=>{const el=$('#artT',b);if(el)el.textContent='يفكّر بعمق قبل الكتابة… '+Math.round((Date.now()-t0)/1000)+' ث'},1000);
    $('#artStop',b).onclick=()=>ctl.abort();
    callAI(artPrompt(topic),{signal:ctl.signal},true).then(r=>{clearInterval(iv);if(!live)return;const a=cleanArt(r);
        if(!a){body.innerHTML=`<p class="err">جاء الرد ناقصاً. أعد المحاولة.</p><button class="btn" type="button" id="artAgain">أعد المحاولة</button>`;$('#artAgain',body).onclick=()=>sheetArticle(topic,true);return}
        if(a.kind!=='off_topic')artPut(topic,a);renderArt(body,topic,a)})
      .catch(e=>{clearInterval(iv);if(!live)return;body.innerHTML=`<div class="banner warn">${ic('alert')}<div><b>لم يكتمل المدخل</b><p>${esc(aiErr(e))}</p></div></div><button class="btn" type="button" id="artAgain">أعد المحاولة</button>`;$('#artAgain',body).onclick=()=>sheetArticle(topic,true)});
    return()=>{live=false;clearInterval(iv);ctl.abort()};
  });
}

${aiContext()}`}
function chatMD(t){return mdLite(t).replace(/<p>\s*درجة الثقة\s*[:：]\s*(عالية|متوسطة|منخفضة)[.\s]*<\/p>/,(m,l)=>`<span class="chip conf ${l==='عالية'?'ok':l==='متوسطة'?'warn':'bad'}">درجة الثقة: ${l}</span>`)}
function sheetChat(prefill,draft){
  if(!aiSample){toast('المساعد الذكي غير متاح هنا');return}
  openSheet('طبيب الجيب',`<p class="hint" style="margin:0">مساعد ذكي للإرشاد العام، لا يغني عن الطبيب. في الطوارئ اتصل بـ<bdi>${esc(emNum())}</bdi>.</p>
  <div class="chat" id="chLog"></div>
  <div class="sugg" id="chSug">${['عندي صداع منذ يومين مع غثيان','كيف أفهم نتيجة تحليل الدم الشامل؟','ما الفرق بين السكري الأول والثاني؟','ماذا تعني قراءات ضغطي الأخيرة؟','كيف أحسّن نومي؟'].map(t=>`<button type="button" data-s="${esc(t)}">${t}</button>`).join('')}</div>
  <form class="chat-f" id="chF"><textarea id="chIn" rows="2" placeholder="صف ما تشعر به…" aria-label="رسالتك"></textarea><button class="btn" type="submit" id="chSend">إرسال</button><button class="btn ghost" type="button" id="chStop" hidden>إيقاف</button></form>`,b=>{
    const log=$('#chLog',b),inp=$('#chIn',b),send=$('#chSend',b),stop=$('#chStop',b),sug=$('#chSug',b);let ctl=null,busy=false;
    function draw(){log.innerHTML=chat.turns.map(t=>`<div class="msg ${t.role==='user'?'u':'a'}">${t.role==='user'?esc(t.content).replace(/\n/g,'<br>'):chatMD(t.content)}</div>`).join('');sug.hidden=chat.turns.length>0}
    async function ask(text){
      if(busy||!text.trim())return;busy=true;chat.turns.push({role:'user',content:text.trim()});draw();inp.value='';
      const bub=document.createElement('div');bub.className='msg a';bub.textContent='يفكّر بعمق قبل الإجابة…';log.append(bub);bub.scrollIntoView({block:'end'});
      send.hidden=true;stop.hidden=false;ctl=new AbortController();
      try{const r=await callAI([{role:'user',content:rules()},{role:'assistant',content:'فهمت. سأتبع هذه التعليمات.'},...chat.turns],{cache:false,signal:ctl.signal,onText:({text})=>{bub.innerHTML=chatMD(text)}});
        chat.turns.push({role:'assistant',content:r.text});}
      catch(e){const code=e&&e.code;if(e&&e.text){chat.turns.push({role:'assistant',content:e.text})}
        else{chat.turns.pop();}
        if(code!=='cancelled')toast(code==='not_granted'?'لم يُسمح باستخدام المساعد':code==='rate_limited'?'طلبات كثيرة، انتظر قليلاً ثم أعد المحاولة':'تعذّر الرد الآن، حاول مرة أخرى')}
      busy=false;send.hidden=false;stop.hidden=true;draw();const lm=log.lastElementChild;if(lm)lm.scrollIntoView({block:'end'});
    }
    $('#chF',b).onsubmit=e=>{e.preventDefault();ask(inp.value)};
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask(inp.value)}});
    stop.onclick=()=>ctl&&ctl.abort();sug.onclick=e=>{const t=e.target.closest('button');if(t)ask(t.dataset.s)};
    draw();if(prefill)ask(prefill);else{if(draft){inp.value=draft}setTimeout(()=>{inp.focus();try{inp.setSelectionRange(inp.value.length,inp.value.length)}catch(e){}},150)}
    return()=>{ctl&&ctl.abort()};
  });
}

/* ---------- SOS + medical ID ---------- */
function medID(){const p=P(),a=age();const row=(k,v)=>v?`<div><span>${k}</span><b style="font-family:var(--f-body);white-space:normal;text-align:left">${esc(v)}</b></div>`:'';
  return `<div class="mid"><div class="mid-h"><span>البطاقة الطبية</span><span>${esc(p.name||'')}</span></div><div class="kv">
  ${row('العمر',a?a+' سنة':'')}${row('فصيلة الدم',p.blood)}${row('الحساسية',p.allergies||'لم تُسجَّل')}${row('الأمراض المزمنة',p.conditions)}${row('الأدوية',S.meds.filter(m=>m.on).map(m=>m.name+(m.dose?' '+m.dose:'')).join('، '))}${row('جهة الطوارئ',p.contactName?(p.contactName+' '+(p.contactPhone||'')):'')}
  </div></div>`}
function sheetSOS(){
  openSheet('الطوارئ',`<div class="triage bad"><span class="small">رقم الإسعاف في ${esc(countryName())}</span><div class="callnum"><bdi>${esc(emNum())}</bdi></div>
  <div class="row"><a class="btn danger" href="tel:${esc(emNum())}">${ic('phone')}اتصل الآن</a><button class="btn ghost" type="button" data-act="copy" data-txt="${esc(emNum())}">انسخ الرقم</button>${P().contactPhone?`<a class="btn ghost" href="tel:${esc(P().contactPhone)}">${esc(P().contactName||'جهة الطوارئ')}</a>`:''}</div>
  <p class="small">إذا لم يعمل زر الاتصال فاطلب الرقم يدوياً. يمكنك تغيير الدولة والرقم من «ملفي».</p></div>
  ${medID()}${knowHTML(true)}`);
}

/* ---------- report ---------- */
function reportData(){
  const p=P(),a=age(),rows=[];
  for(const k of Object.keys(MET)){const r=last(k);if(!r)continue;const M=MET[k],c=M.cls(r.v);let avg='';
    if(NUMERIC.includes(k)){const ser=S.readings.filter(x=>x.k===k&&Date.now()-x.ts<30*D).map(x=>M.ser(x.v));if(ser.length>1){const n=ser[0].length,dec=['temp','wt','tremor'].includes(k)?1:0;avg=[...Array(n)].map((_,i)=>(ser.reduce((s,x)=>s+x[i],0)/ser.length).toFixed(dec)).join('/')+' ('+ser.length+')'}}
    rows.push({n:M.n,v:M.val(r.v)+' '+unitOf(k)+(M.sub&&M.sub(r.v)?' · '+M.sub(r.v):''),d:fD.format(r.ts),s:c.t,avg})}
  return{p,a,rows,meds:S.meds.filter(m=>m.on)};
}
function reportInner(){
  const {p,a,rows,meds}=reportData();
  return `<h4>بيانات المريض</h4><table><tr><th>الاسم</th><td>${esc(p.name||'—')}</td><th>العمر</th><td>${a?a+' سنة':'—'}</td></tr><tr><th>الجنس</th><td>${p.sex==='m'?'ذكر':p.sex==='f'?'أنثى':'—'}</td><th>فصيلة الدم</th><td>${esc(p.blood||'—')}</td></tr><tr><th>الطول</th><td>${esc(p.height||'—')} سم</td><th>الوزن</th><td>${esc(p.weight||'—')} كغ</td></tr></table>
  <h4>الأمراض والحساسية</h4><p style="margin:0">الأمراض المزمنة: ${esc(p.conditions||'لا يوجد')}<br>الحساسية: ${esc(p.allergies||'لا يوجد')}</p>
  <h4>الأدوية الحالية</h4>${meds.length?`<table>${meds.map(m=>`<tr><td>${esc(m.name)}</td><td>${esc(m.dose||'')}</td><td>${(m.times||[]).join('، ')}</td></tr>`).join('')}</table>`:'<p style="margin:0">لا يوجد</p>'}
  <h4>آخر القياسات</h4>${rows.length?`<table><tr><th>القياس</th><th>آخر قيمة</th><th>التاريخ</th><th>التقييم</th><th>متوسط 30 يوماً (العدد)</th></tr>${rows.map(r=>`<tr><td>${esc(r.n)}</td><td>${esc(r.v)}</td><td>${r.d}</td><td>${esc(r.s)}</td><td>${esc(r.avg||'—')}</td></tr>`).join('')}</table>`:'<p style="margin:0">لا توجد قياسات.</p>'}
  <p class="foot">أُعدّ هذا التقرير في ${fLong.format(new Date())} من قياسات منزلية سجّلها المستخدم في تطبيق عيادة الجيب، وهي قياسات استرشادية تحتاج تأكيداً سريرياً.</p>`;
}
function reportText(){const {p,a,rows,meds}=reportData();return [`تقرير صحي — ${p.name||''}`,`العمر: ${a||'—'} | فصيلة الدم: ${p.blood||'—'} | الطول ${p.height||'—'} سم | الوزن ${p.weight||'—'} كغ`,`الأمراض المزمنة: ${p.conditions||'لا يوجد'}`,`الحساسية: ${p.allergies||'لا يوجد'}`,`الأدوية: ${meds.map(m=>m.name+' '+(m.dose||'')).join('، ')||'لا يوجد'}`,'',...rows.map(r=>`${r.n}: ${r.v} (${r.d}) — ${r.s}${r.avg?' | متوسط 30 يوماً '+r.avg:''}`)].join('\n')}
function sheetReport(){
  openSheet('تقرير للطبيب',`<div class="paper" id="rep">${reportInner()}</div><div class="row">
    <button class="btn" type="button" id="repDl">${ic('down')}نزّل التقرير</button><button class="btn ghost" type="button" id="repCp">انسخ كنص</button>${IN_VIEWER?'':`<button class="btn ghost" type="button" id="repPr">اطبع / PDF</button>`}</div>`,b=>{
    $('#repCp',b).onclick=()=>copyText(reportText());
    $('#repDl',b).onclick=()=>saveFile('تقرير-صحي-'+dayKey()+'.html',`<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تقرير صحي</title><style>body{font:14px/1.7 Tahoma,Arial,sans-serif;color:#10302e;max-width:760px;margin:24px auto;padding:0 16px}h1{font-size:20px}h4{margin:18px 0 6px;font-size:15px}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #d3e0dd;padding:6px 4px;text-align:right}th{color:#557170;font-weight:500}.foot{color:#557170;font-size:12px}</style></head><body><h1>تقرير صحي — عيادة الجيب</h1>${reportInner()}</body></html>`);
    const pr=$('#repPr',b);if(pr)pr.onclick=()=>{const w=window.open('','_blank');if(!w){toast('اسمح بالنوافذ المنبثقة للطباعة');return}w.document.write(`<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>تقرير صحي</title><style>body{font:13px/1.7 Tahoma,Arial,sans-serif;margin:24px}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #ccc;padding:5px;text-align:right}h4{margin:16px 0 6px}</style></head><body><h2>تقرير صحي — عيادة الجيب</h2>${reportInner()}<script>onload=()=>print()<\/script></body></html>`);w.document.close()};
  });
}

/* ---------- actions ---------- */
const OPEN_TEST={heart:['قياس النبض بالكاميرا',testHeart],breath:['معدل التنفس',testBreath],tremor:['ثبات اليد',testTremor],react:['سرعة رد الفعل',testReact],acuity:['حدة البصر',testAcuity],color:['تمييز الألوان',testColor],amsler:['شبكة أمسلر',b=>testGrid(b,'amsler')],astig:['اللابؤرية',b=>testGrid(b,'astig')],hear:['فحص السمع',testHear]};
const ACT={
  go:a=>go(a.dataset.v),close:()=>closeSheet(),
  vital:a=>{const k=a.dataset.k;if(last(k)){logK=k;go('log')}else sheetAdd(k)},
  add:a=>sheetAdd(a.dataset.k),addPick:()=>sheetAddPick(),
  test:a=>{const t=OPEN_TEST[a.dataset.t];if(t)openSheet(t[0],'',t[1])},
  sym:a=>sheetSym(a.dataset.id),sys:a=>sheetSys(a.dataset.i),enc:a=>sheetArticle(a.dataset.topic),q:a=>sheetQ(a.dataset.q),chat:()=>sheetChat(),sos:()=>sheetSOS(),report:()=>sheetReport(),calib:()=>sheetCalib(),
  logk:a=>{logK=a.dataset.k;if(view==='log')render();else go('log')},
  copy:a=>copyText(a.dataset.txt),
  water:a=>{ensureReal();const k=dayKey(),before=S.water[k]||0;S.water[k]=Math.max(0,before+(+a.dataset.ml));persist();render();if(before<waterGoal()&&S.water[k]>=waterGoal())toast('أحسنت! وصلت إلى هدف الماء اليوم')},
  dose:a=>{ensureReal();const k=dayKey(),key=a.dataset.key;S.medLog[k]=S.medLog[k]||{};if(S.medLog[k][key])delete S.medLog[k][key];else S.medLog[k][key]=Date.now();persist();render()},
  del:a=>{if(!a.classList.contains('confirm')){$$('.x.confirm').forEach(x=>{x.classList.remove('confirm');x.innerHTML=ic('trash')});a.classList.add('confirm');a.textContent='تأكيد الحذف';return}
    S.readings=S.readings.filter(r=>r.id!==a.dataset.id);persist();render();toast('حُذفت القراءة')},
  demoClear:()=>{ensureReal();persist();render();toast('بدأ ملفك الخاص')},
  medToggle:a=>{const m=S.meds.find(x=>x.id===a.dataset.id);if(m){m.on=!m.on;persist();render()}},
  medDel:a=>{if(!a.classList.contains('confirm')){a.classList.add('confirm');a.textContent='تأكيد';return}S.meds=S.meds.filter(x=>x.id!==a.dataset.id);persist();render()},
  notif:async()=>{try{const r=await Notification.requestPermission();toast(r==='granted'?'فُعّلت التذكيرات':'لم يُسمح بالتنبيهات')}catch(e){toast('التنبيهات غير مدعومة هنا')}render()},
  export:()=>saveFile('عيادة-الجيب-نسخة-'+dayKey()+'.json',JSON.stringify(S,null,1)),
  import:()=>$('#importFile').click(),
  wipe:a=>{if(!a.classList.contains('confirm')){a.classList.add('confirm');a.style.background='var(--bad)';a.style.color='var(--on-bad)';a.textContent='اضغط مرة أخرى لحذف كل شيء نهائياً';return}
    const keep={country:P().country,emNum:P().emNum,gluUnit:P().gluUnit,pxmm:P().pxmm};S=blankState();Object.assign(S.profile,keep);persist();render();toast('حُذفت كل البيانات')}
};
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;const f=ACT[a.dataset.act];if(f){e.preventDefault();f(a,e)}});
$('#sheetBg').addEventListener('click',e=>{if(e.target.id==='sheetBg')closeSheet()});
addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheetBg').hidden)closeSheet()});
$('#importFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const x=normalize(JSON.parse(rd.result));if(!x)throw 0;S=x;S.demo=false;persist();render();toast('استُعيدت بياناتك')}catch(err){toast('الملف غير صالح. اختر ملف نسخة احتياطية من عيادة الجيب.')}};rd.readAsText(f);e.target.value=''});
document.addEventListener('change',e=>{
  const el=e.target;if(el.id==='medForm'||el.closest('#medForm'))return;const f=el.dataset&&el.dataset.p;if(!f)return;
  if(el.type==='radio'&&!el.checked)return;const wasDemo=ensureReal();const v=el.value;
  P()[f]=String(v).trim();
  if(f==='country'){const c=COUNTRIES.find(x=>x[0]===v);if(c)P().emNum=c[2];const n=$('#p-emNum');if(n)n.value=P().emNum}
  if(f==='weight'&&+v>=20&&+v<=300){const lw=last('wt');if(!lw||Math.abs(lw.v.kg-+v)>=0.05){S.readings.push({id:uid(),k:'wt',ts:Date.now(),v:{kg:Math.round(+v*10)/10}})}}
  persist();
  if(wasDemo||f==='gluUnit'){render();return}
  const bn=$('#bodyNums');if(bn)bn.innerHTML=bodyNums();
  const nm=P().name?P().name.split(' ')[0]:'';$('#hello').textContent=(nm?'أهلاً '+nm+' · ':'')+fLong.format(new Date());
});
document.addEventListener('submit',e=>{
  if(e.target.id==='encF'){e.preventDefault();const q=$('#encQ').value.trim();if(q)sheetArticle(q);return}
  if(e.target.id!=='medForm')return;e.preventDefault();const name=$('#m-name').value.trim();if(!name){$('#m-name').focus();return}
  const times=['m-t1','m-t2','m-t3'].map(i=>$('#'+i).value).filter(Boolean);if(!times.length)return;
  ensureReal();S.meds.push({id:uid(),name,dose:$('#m-dose').value.trim(),times:[...new Set(times)].sort(),on:true});persist();render();toast('أُضيف '+name);
});

/* ---------- medication reminders ---------- */
const notified=new Set();
setInterval(()=>{
  const now=new Date(),hm=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0'),log=S.medLog[dayKey()]||{};
  for(const m of S.meds){if(!m.on||!(m.times||[]).includes(hm))continue;const key=dayKey()+m.id+hm;if(notified.has(key)||log[m.id+'@'+hm])continue;notified.add(key);
    toast('حان موعد '+m.name+(m.dose?' · '+m.dose:''));
    if(!IN_VIEWER&&'Notification' in window&&Notification.permission==='granted'){const opt={body:(m.dose||'')+' — الساعة '+hm,icon:'icon-192.png',tag:key};
      if(navigator.serviceWorker&&navigator.serviceWorker.controller)navigator.serviceWorker.ready.then(r=>r.showNotification('موعد الدواء: '+m.name,opt)).catch(()=>{});else try{new Notification('موعد الدواء: '+m.name,opt)}catch(e){}}
    if(view==='home'&&$('#sheetBg').hidden)render();
  }
},20000);

/* ---------- boot ---------- */
view=VIEWS[location.hash.slice(1)]?location.hash.slice(1):'home';
render();
connectRemote();
if(IN_VIEWER){claude.use('sample').then(async s=>{if(!s)return;aiSample=s;try{const l=await s.limits();const t=l&&l.modelTiers;aiTier=(!t||t.includes('complex'))?'complex':'default'}catch(e){}if($('#sheetBg').hidden)render()}).catch(()=>{})}
if(!IN_VIEWER&&'serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
})();
</script>
